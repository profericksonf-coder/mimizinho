    const carros = [['', t('fl_semCarro')], ...E.unidades.map((u) => [u.id, nomeCarro(u)])];
    const semana = [['', '–'], ...[1, 2, 3, 4, 5, 6, 0].map((n) => [String(n), t('sem_' + n)])];
    return `<div class="jan-fundo"><div class="janela" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      <button class="fechar" id="jan-fechar" data-acao="fecharModal" aria-label="${t('fechar')}">×</button>
      <h2 class="titulo">${esc(titulo)}</h2>
      <p class="nota">${t('avisoDados')}</p>
      ${campoForm('fl', 'nome', 'fl_nome', 'type="text" maxlength="80" autocomplete="off"')}
      ${campoForm('fl', 'cpf', 'fl_cpf', 'type="text" inputmode="numeric" maxlength="14" autocomplete="off"')}
      ${campoForm('fl', 'cnhNumero', 'fl_cnhNumero', 'type="text" inputmode="numeric" maxlength="14" autocomplete="off"')}
      <div class="campo-claro"><label for="fl-cnhCategoria">${t('fl_cnhCategoria')}</label>
        <select id="fl-cnhCategoria" data-campo="fl.cnhCategoria" aria-invalid="${!!e.cnhCategoria}">${opcoes(L.CATEGORIAS_CNH.map((x) => [x, x]), f.cnhCategoria)}</select>${erroSel('cnhCategoria')}</div>
      ${campoForm('fl', 'cnhValidade', 'fl_cnhValidade', 'type="date"')}
      ${campoForm('fl', 'endereco', 'fl_endereco', 'type="text" maxlength="160" autocomplete="off"')}
      ${campoForm('fl', 'fone', 'fl_fone', 'type="tel" maxlength="20" autocomplete="off"')}
      ${campoForm('fl', 'email', 'fl_email', 'type="email" maxlength="120" autocomplete="off"')}
      <h3 class="rotulo">${t('fl_antTitulo')}</h3>
      <label class="marcar claro"><input id="fl-antOk" type="checkbox" data-campo="fl.antOk"${f.antOk ? ' checked' : ''}> ${t('fl_antOk')}</label>
      <p class="nota">${t('fl_antAjuda')}</p>
      ${campoForm('fl', 'antData', 'fl_antData', `type="date" max="${hoje}"`)}
      ${campoForm('fl', 'antObs', 'fl_antObs', 'type="text" maxlength="200" autocomplete="off"')}
      <h3 class="rotulo">${t('fl_aluguel')}</h3>
      <div class="campo-claro"><label for="fl-unidade">${t('fl_unidade')}</label>
        <select id="fl-unidade" data-campo="fl.unidade" aria-invalid="${!!e.unidade}">${opcoes(carros, f.unidade)}</select>${erroSel('unidade')}</div>
      ${campoForm('fl', 'entrega', 'fl_entrega', 'type="date"')}
      ${campoForm('fl', 'devolucao', 'fl_devolucao', 'type="date"', t('fl_devolucaoAjuda'))}
      <div class="campo-claro"><label for="fl-diaVenc">${t('fl_diaVenc')}</label>
        <select id="fl-diaVenc" data-campo="fl.diaVenc" aria-invalid="${!!e.diaVenc}">${opcoes(semana, f.diaVenc)}</select>${erroSel('diaVenc')}</div>
      ${campoForm('fl', 'valorSemanal', 'fl_valorSemanal', 'type="text" inputmode="decimal" maxlength="10" autocomplete="off"')}
      <button class="botao verde largo" id="fl-salvar" data-acao="salvarCliente">${t('fl_salvar')}</button>
      ${!atual ? '' : c.certezaRemover
        ? `<div class="certeza" role="alert"><p>${esc(t('removerClienteCerteza', { n: atual.nome }))}</p>
          <div class="certeza-botoes"><button class="botao pare" data-acao="removerClienteSim">${t('simRemover')}</button><button class="botao linha" data-acao="removerClienteNao">${t('naoManter')}</button></div></div>`
        : `<button class="botao linha" data-acao="removerClientePedir">${t('removerCliente')}</button>`}
    </div></div>`;
  }

  const MB = 1024 * 1024;
  const tamanhoTxt = (b) => (b >= MB ? `${(b / MB).toLocaleString(LOCALE, { maximumFractionDigits: 1 })} MB` : `${Math.max(1, Math.round(b / 1024))} KB`);
  const TIPO_CURTO = { 'application/pdf': 'PDF', 'image/jpeg': 'JPG', 'image/png': 'PNG', 'image/webp': 'WEBP' };
  const donoNome = (dono) => (dono.startsWith('cl') ? (clienteId(dono) || {}).nome || '' : (() => { const u = unidade(dono); return u ? nomeCarro(u) : ''; })());
  const donoExiste = (dono) => (dono.startsWith('cl') ? !!clienteId(dono) : E.unidades.some((u) => u.id === dono));

  function modalAnexos() {
    const m = UI.modal, e = m.erros, hoje = hojeData(), maxMb = L.REGRAS.anexoMaxBytes / MB;
    const lista = anexosDe(m.dono).sort((a, b) => b.data.localeCompare(a.data) || b.id.localeCompare(a.id));
    const titulo = t('anexosDe', { n: donoNome(m.dono) });
    return `<div class="jan-fundo"><div class="janela" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      <button class="fechar" id="jan-fechar" data-acao="fecharModal" aria-label="${t('fechar')}">×</button>
      <h2 class="titulo">${esc(titulo)}</h2>
      <p class="nota">${esc(t('anexosAjuda', { n: maxMb }))}</p>
      ${lista.length ? `<ul class="manut-regs anexos">${lista.map((a) => `<li><span><strong>${esc(a.nome)}</strong> · ${esc(dataBR(a.data))} · ${TIPO_CURTO[a.tipo]} · ${esc(tamanhoTxt(a.tamanho))}</span>
        <span class="acoes-linha"><button class="fino" data-acao="abrirAnexo" data-x="${a.id}">${t('abrirAnexo')}</button><button class="fino" data-acao="baixarAnexo" data-x="${a.id}">${t('baixarAnexo')}</button>
        <button class="fino" data-acao="apagarAnexo" data-x="${a.id}">${t(UI.certezaAnexo === a.id ? 'apagarManutCerteza' : 'apagarManut')}</button></span></li>`).join('')}</ul>`
        : `<p class="vazio">${t('semAnexos')}</p>`}
      <div class="campo-claro"><label for="fa-arquivo">${t('fa_arquivo')}</label>
        <input id="fa-arquivo" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" data-campo="fa.arquivo" aria-invalid="${!!e.arquivo}">
        ${m.arquivo ? `<p class="nota">${esc(m.arquivo.name)} · ${esc(tamanhoTxt(m.arquivo.size))}</p>` : ''}
        ${e.arquivo ? `<p id="fa-arquivo-erro" class="erro" role="alert">${esc(t(e.arquivo, { n: maxMb }))}</p>` : ''}</div>
      ${campoForm('fa', 'nome', 'fa_nome', 'type="text" maxlength="60" autocomplete="off"', t('fa_nomeAjuda'))}
      ${campoForm('fa', 'data', 'fa_data', `type="date" max="${hoje}"`)}
      <button class="botao verde largo" id="fa-salvar" data-acao="salvarAnexo"${m.gravando ? ' disabled' : ''}>${t('fa_salvar')}</button>
    </div></div>`;
  }

  // no IPVA, preenche o valor calculado; se o dono digitou outro valor, respeita
  function ipvaAutomatico(c) {
    const u = unidade(c.f.unidade);
    if (c.f.tipo === 'ipva' && (c.f.valor === '' || c.auto) && u && u.fipe) { c.f.valor = reaisTxt(L.ipva(u.fipe, E.config.aliqLocadora)); c.auto = true; }
    else if (c.auto && (c.f.tipo !== 'ipva' || !u || !u.fipe)) { c.f.valor = ''; c.auto = false; }
  }

  /* ---------- desenhar ---------- */
  function seletorDe(el) {
    if (!el || el === document.body) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    if (el.dataset && el.dataset.acao) return `[data-acao="${el.dataset.acao}"]` + (el.dataset.x ? `[data-x="${CSS.escape(el.dataset.x)}"]` : '');
    return null;
  }

  // redesenho vindo de `change`: esperar o foco assentar e o clique terminar, senão o botão some antes do clique contar
  let dedoApertado = false, redesenhoPendente = false;
  function desenharDepois() {
    if (dedoApertado) { redesenhoPendente = true; return; }
    setTimeout(desenhar, 0);
  }
  addEventListener('pointerdown', () => { dedoApertado = true; }, true);
  for (const ev of ['pointerup', 'pointercancel']) {
    addEventListener(ev, () => {
      dedoApertado = false;
      setTimeout(() => { if (redesenhoPendente) { redesenhoPendente = false; desenhar(); } }, 30);
    }, true);
  }

  function desenhar() {
    const foco = seletorDe(document.activeElement);
    const rolos = {};
    for (const id of ['rolo-cliente', 'rolo-painel', 'rolo-quadro', 'rolo-tipos', 'rolo-chips', 'rolo-filtro', 'rolo-reservas', 'rolo-frota', 'rolo-lojas', 'rolo-margem', 'rolo-sim']) {
      const el = document.getElementById(id);
      if (el) rolos[id] = [el.scrollTop, el.scrollLeft];
    }
    document.getElementById('app').innerHTML = `${topo()}<main class="palco modo-${UI.modo}">
      ${UI.modo !== 'locadora' ? cliente() : ''}
      ${UI.modo !== 'cliente' ? painel() : ''}
    </main>`;
    desenharModal();
    for (const [id, pos] of Object.entries(rolos)) {
      const el = document.getElementById(id);
      if (el) { el.scrollTop = pos[0]; el.scrollLeft = pos[1]; }
    }
    if (foco) { const el = document.querySelector(foco); if (el) el.focus({ preventScroll: true }); }
  }

  function desenharModal() {
    const alvo = document.getElementById('modal');
    const m = UI.modal;
    const antes = alvo.querySelector('.janela');
    const y = antes ? antes.scrollTop : 0;
    const janelas = { vistoria: modalVistoria, checkin: modalCheckin, carro: modalCarro, manut: modalManut, custo: modalCusto, cliente: modalCliente, anexos: modalAnexos };
    alvo.innerHTML = !m ? '' : janelas[m.tipo] ? janelas[m.tipo]() : modalReserva(reserva(m.id));
    const depois = alvo.querySelector('.janela');
    if (depois) depois.scrollTop = y;
  }

  function irPara(tela) {
    UI.tela = tela;
    if (document.activeElement) document.activeElement.blur();
    desenhar();
    const r = document.getElementById('rolo-cliente');
    if (r) r.scrollTop = 0;
    // leva o foco pra tela nova, senão quem usa teclado fica preso no botão que sumiu
    const alvo = r && r.querySelector('h1, .voltar, .placa select, button');
    if (alvo && document.activeElement === document.body) alvo.focus({ preventScroll: true });
  }

  function abrirModal(m) {
    if (!UI.modal) UI.abridor = seletorDe(document.activeElement);
    UI.modal = m;
    UI.certezaCancelar = null;
    desenharModal();
    const jan = document.querySelector('.janela');
    if (jan) jan.scrollTop = 0;
    const f = document.getElementById('jan-fechar');
    if (f) f.focus();
  }

  function fecharModal() {
    UI.modal = null;
    UI.certezaCancelar = null;
    desenharModal();
    const el = UI.abridor && document.querySelector(UI.abridor);
    if (el) el.focus({ preventScroll: true });
  }

  /* ---------- operações ---------- */
  function confirmarReserva() {
    const r = UI.rascunho, { ini, fim } = periodo(), m = UI.modeloId;
    const editada = UI.editandoId ? reserva(UI.editandoId) : null;
    if (UI.editandoId && (!editada || editada.status !== 'reservada')) {
      log('alteração recusada: a reserva não está mais ativa', UI.editandoId);
      UI.editandoId = null; UI.rascunho = null; UI.abaCliente = 'reservas';
      irPara('reservas');
      return;
    }
    const erroPeriodo = erroDaBusca();
    if (erroPeriodo) {
      log('reserva recusada: o período deixou de valer', erroPeriodo.chave);
      UI.erroBusca = erroPeriodo;
      UI.rascunho = null;
      UI.abaCliente = 'reservar';
      irPara('busca');
      return;
    }
    const livres = L.unidadesLivres(E, m, UI.busca.local, ini, fim, hojeTxt(), UI.editandoId);
    if (!livres.length) {
      log('reserva recusada: carro ficou sem unidade livre', m);
      r.erroReserva = 'erroSemCarro';
      desenhar();
      return;
    }
    const conta = orcar(m, r.plano, r.extras);
    const extras = r.extras.filter((x) => !(x === 'vidros' && plano(r.plano).incluiVidros));
    const dados = {
      unidade: (editada && livres.find((u) => u.id === editada.unidade) || livres[0]).id, modelo: m, local: UI.busca.local, localDev: localDev(), ini, fim,
      plano: r.plano, extras, pagamento: r.pagamento, tarifaDia: E.tarifas[m],
      motorista: { nome: r.motorista.nome.trim(), email: r.motorista.email.trim(), fone: r.motorista.fone.trim(), cpf: r.motorista.cpf.trim(), idade: Number(r.motorista.idade) },
      linhas: conta.linhas, total: conta.total,
    };
    let alvo;
    if (editada) {
      // contrato mudou: CNH e selfie continuam valendo, mas precisa assinar de novo
      Object.assign(editada, dados);
      editada.checkin = { ...editada.checkin, assinatura: null, em: null };
      alvo = editada;
      log('reserva alterada', editada.codigo);
      if (UI.modo === 'ambos') avisar(t('alteradaAviso', { c: editada.codigo }));
    } else {
      const codigo = L.novoCodigo(E.reservas.map((x) => x.codigo), Math.random);
      alvo = { id: 'r' + codigo, codigo, status: 'reservada', minha: true, multa: 0, vistoria: {},
        checkin: { cnh: false, selfie: false, assinatura: null, em: null }, ...dados };
      E.reservas.push(alvo);
      log('reserva criada', codigo);
      if (UI.modo === 'ambos') avisar(t('novaReservaAviso', { c: codigo, n: alvo.motorista.nome }));
    }
    salvar();
    UI.foiAlteracao = !!editada;
    UI.editandoId = null;
    UI.confirmadaId = alvo.id;
    UI.rascunho = null;
    UI.destaque = alvo.id;
    setTimeout(() => { if (UI.destaque === alvo.id) { UI.destaque = null; desenhar(); } }, 5000);
    irPara('confirmada');
  }

  function salvarVistoria() {
    const v = UI.modal, r = reserva(v.id), u = unidade(r.unidade);
    if (v.fotos.length < D.FOTOS.length) { v.erroFotos = true; desenharModal(); return; }
    const km = Number(v.km);
    const minimo = v.fase === 'dev' && r.vistoria.ret ? r.vistoria.ret.km : u.km;
    if (!Number.isFinite(km) || km < minimo || km < 0 || String(v.km).trim() === '') {
      v.erroKm = String(minimo);
      desenharModal();
      return;
    }
    r.vistoria[v.fase] = { pins: v.pins, comb: Number(v.comb), km, fotos: [...v.fotos] };
    u.km = km;
    r.status = v.fase === 'ret' ? 'retirada' : 'devolvida';
    if (v.fase === 'dev') {
      u.situacao = 'vistoria'; // volta pra loja e passa por vistoria/limpeza antes de alugar de novo
      // devolveu em outra loja: o carro passa a estar lá, a não ser que já tenha reserva saindo daqui
      if (!E.reservas.some((x) => x.unidade === u.id && x.status === 'reservada' && x.local === u.local)) u.local = r.localDev;
    }
    salvar();
    log(`vistoria de ${v.fase} registrada`, r.codigo);
    avisar(t(v.fase === 'ret' ? 'retiradaOk' : 'devolucaoOk', { c: r.codigo, n: L.pontosDe(r) }));
    fecharModal();
    desenhar();
  }

  function pontoSVG(svg, evento) {
    const p = new DOMPoint(evento.clientX, evento.clientY).matrixTransform(svg.getScreenCTM().inverse());
    return [Math.round(p.x), Math.round(p.y)];
  }

  function adicionarPin(zonaEl, evento) {
    const v = UI.modal, z = C.ZONAS.find((x) => x.id === zonaEl.dataset.zona);
    let x = z.x + z.w / 2, y = z.y + z.h / 2;
    const svg = document.getElementById('vist-svg');
    if (evento && evento.clientX && svg.getScreenCTM()) [x, y] = pontoSVG(svg, evento);
    v.pins.push({ x, y, zona: z.id, tipo: v.dano });
    const id = zonaEl.id;
    desenharModal();
    const el = document.getElementById(id);
    if (el) el.focus({ preventScroll: true });
  }

  function concluirCheckin() {
    const c = UI.modal, r = reserva(c.id);
    const texto = c.texto.trim();
    if (!c.aceite) c.erro = 'ck_erroAceite';
    else if (!c.tracos.length && texto.length < 3) c.erro = 'ck_erroAssinatura';
    else c.erro = null;
    if (c.erro) { desenharModal(); return; }
    r.checkin = { cnh: true, selfie: true, assinatura: c.tracos.length ? { tipo: 'traco', tracos: c.tracos } : { tipo: 'texto', texto: texto.slice(0, 80) }, em: hojeTxt() };
    salvar();
    log('check-in digital concluído', r.codigo);
    c.etapa = 4;
    desenhar();
    const h = document.getElementById('ck-pronto');
    if (h) h.focus();
  }

  function focarErro(pre, erros) {
    const k = Object.keys(erros)[0];
    const el = k && document.getElementById(`${pre}-${k}`);
    if (el) el.focus();
  }

  function proximoId(prefixo, lista) {
    const nums = lista.map((x) => Number(String(x.id).slice(prefixo.length))).filter(Number.isInteger);
    return prefixo + (Math.max(0, ...nums) + 1);
  }

  function salvarCarro() {
    const c = UI.modal, f = c.f;
    const atual = c.unidade ? E.unidades.find((u) => u.id === c.unidade) : null;
    if (c.unidade && !atual) { log('edição cancelada: o carro não está mais na frota', c.unidade); fecharModal(); desenhar(); return; }
    const { erros, carro } = L.validarCarro(f, {
      categorias: D.CATEGORIAS, anoAtual: anoAtual(),
      placasEmUso: E.unidades.filter((u) => u !== atual).map((u) => L.normalizarPlaca(u.placa)),
      renavamsEmUso: E.unidades.filter((u) => u !== atual && u.renavam).map((u) => u.renavam),
    });
    const nome = carro.modelo.toLocaleLowerCase(LOCALE);
    let m = E.modelos.find((x) => x.nome.toLocaleLowerCase(LOCALE) === nome);
    // reserva ativa foi feita pra este modelo; trocar o modelo do carro no meio bagunçaria a reserva
    if (!erros.modelo && atual && (!m || m.id !== atual.modelo) && temReservaAtiva(atual)) erros.modelo = 'erroModeloComReserva';
    c.erros = erros;
    if (Object.keys(erros).length) { log('cadastro de carro com erro', Object.keys(erros).join(', ')); desenharModal(); focarErro('fc', erros); return; }
    if (!m) {
      m = { id: proximoId('m', E.modelos.filter((x) => /^m\d+$/.test(x.id))), nome: carro.modelo, cat: carro.categoria,
        tipo: D.DESENHO_POR_CATEGORIA[carro.categoria] || 'sedan', cor: '#7E8A90' };
      E.modelos.push(m);
      log('modelo novo na frota', m.nome);
    }
    m.cat = carro.categoria; // categoria e diária são do modelo (o cliente reserva o modelo, "ou similar")
    E.tarifas[m.id] = carro.tarifa;
    if (atual) {
      Object.assign(atual, { modelo: m.id, ano: carro.ano, placa: carro.placa, km: carro.km, fipe: carro.fipe, foto: f.foto || null, cor: carro.cor, renavam: carro.renavam });
    } else {
      E.unidades.push({ id: proximoId('u', [...E.unidades, ...E.removidos]), modelo: m.id, placa: carro.placa, local: D.LOCAIS[0].id,
        km: carro.km, situacao: 'ok', ano: carro.ano, oleoKm: L.REGRAS.oleoPadraoKm, filtroKm: L.REGRAS.filtroPadraoKm, foto: f.foto || null, fipe: carro.fipe,
        cor: carro.cor, renavam: carro.renavam, kmData: null });
    }
    const ok = salvar();
    log(atual ? 'carro editado' : 'carro cadastrado', carro.placa);
    avisar(ok ? t('carroSalvo', { p: carro.placa }) : t('erroSalvarAparelho'));
    fecharModal();
    desenhar();
  }

  function removerCarro() {
    const u = E.unidades.find((x) => x.id === UI.modal.unidade);
    if (!u) { fecharModal(); desenhar(); return; }
    if (temReservaAtiva(u)) { UI.modal.certezaRemover = false; avisar(t('erroRemoverComReserva', { p: u.placa })); desenharModal(); return; }
    if (E.clientes.some((c) => c.unidade === u.id)) { UI.modal.certezaRemover = false; avisar(t('erroCarroComCliente', { p: u.placa })); desenharModal(); return; }
    E.unidades = E.unidades.filter((x) => x !== u);
    // com reserva ou aluguel semanal recebido, o carro vai pro arquivo pra o histórico continuar abrindo
    // (e a id não é reaproveitada por outro carro); sem nada, sai de vez
    if (E.reservas.some((r) => r.unidade === u.id) || E.recebimentos.some((p) => p.unidade === u.id)) E.removidos.push(u);
    else {
      E.manutencoes = E.manutencoes.filter((r) => r.unidade !== u.id);
      E.custos = E.custos.filter((c) => c.unidade !== u.id);
      apagarAnexosDe(u.id);
    }
    salvar();
    log('carro removido da frota', u.placa);
    avisar(t('carroRemovido', { p: u.placa }));
    fecharModal();
    desenhar();
  }

  // reduz a foto no próprio aparelho (nada sai daqui) pra caber no armazenamento local
  function lerFoto(arquivo) {
    const c = UI.modal;
    if (!c || c.tipo !== 'carro' || !arquivo) return;
    const erro = (chave) => { if (UI.modal === c) { c.erros = { ...c.erros, foto: chave }; desenharModal(); } };
    if (!/^image\//.test(arquivo.type)) { log('arquivo escolhido não é imagem', arquivo.type); erro('erroFotoCarro'); return; }
    if (arquivo.size > 15 * 1024 * 1024) { log('foto grande demais', `${Math.round(arquivo.size / 1048576)} MB`); erro('erroFotoGrande'); return; }
    log('reduzindo foto do carro', `${Math.round(arquivo.size / 1024)} KB`);
    const url = URL.createObjectURL(arquivo), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      try {
        const escala = Math.min(1, 640 / Math.max(img.naturalWidth, img.naturalHeight));
        const tela = document.createElement('canvas');
        tela.width = Math.max(1, Math.round(img.naturalWidth * escala));
        tela.height = Math.max(1, Math.round(img.naturalHeight * escala));
        tela.getContext('2d').drawImage(img, 0, 0, tela.width, tela.height);
        const dado = tela.toDataURL('image/jpeg', 0.72);
        if (UI.modal !== c) return; // fechou a janela no meio
        c.f.foto = dado;
        delete c.erros.foto;
        log('foto pronta', `${Math.round(dado.length / 1024)} KB`);
        desenharModal();
      } catch (falha) {
        console.warn('[volante] não consegui reduzir a foto do carro:', falha);
        erro('erroFotoCarro');
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); console.warn('[volante] o navegador não abriu essa imagem (formato não suportado?)'); erro('erroFotoCarro'); };
    img.src = url;
  }

  function salvarManut() {
    const c = UI.modal, u = E.unidades.find((x) => x.id === c.unidade);
    if (!u) { log('registro cancelado: o carro não está mais na frota', c.unidade); fecharModal(); desenhar(); return; }
    const { erros, registro } = L.validarManutencao(c.f, hojeTxt().slice(0, 10));
    c.erros = erros;
    if (Object.keys(erros).length) { log('manutenção com erro', Object.keys(erros).join(', ')); desenharModal(); focarErro('fm', erros); return; }
    E.manutencoes.push({ id: proximoId('mt', E.manutencoes), unidade: u.id, ...registro });
    if (registro.km > u.km) u.km = registro.km; // hodômetro andou desde o último registro
    salvar();
    log('manutenção registrada', `${u.placa} ${registro.tipo}`);
    avisar(t('manutSalva', { p: u.placa }));
    fecharModal();
    desenhar();
  }

  function salvarCusto() {
    const c = UI.modal, u = E.unidades.find((x) => x.id === c.f.unidade);
    if (!u) { log('custo não lançado: o carro não está mais na frota', c.f.unidade); fecharModal(); desenhar(); return; }
    const { erros, custo } = L.validarCusto(c.f, hojeTxt().slice(0, 10));
    c.erros = erros;
    if (Object.keys(erros).length) { log('custo com erro', Object.keys(erros).join(', ')); desenharModal(); focarErro('fu', erros); return; }
    E.custos.push({ id: proximoId('cu', E.custos), unidade: u.id, ...custo });
    const ok = salvar();
    log('custo lançado', `${u.placa} ${custo.tipo} ${custo.valor}`);
    avisar(ok ? t('custoSalvo', { p: u.placa, v: moeda(custo.valor) }) : t('erroSalvarAparelho'));
    fecharModal();
    desenhar();
  }

  /* ---------- clientes, anexos e lembretes ---------- */
  function salvarCliente() {
    const c = UI.modal, atual = c.cliente ? clienteId(c.cliente) : null;
    if (c.cliente && !atual) { log('edição cancelada: o cliente não existe mais', c.cliente); fecharModal(); desenhar(); return; }
    const { erros, cliente } = L.validarCliente(c.f, { unidades: E.unidades.map((u) => u.id), hoje: hojeData() });
    if (!Object.keys(erros).length) {
      const conflito = L.conflitoCarroCliente(E, cliente, atual && atual.id);
      if (conflito) erros.unidade = conflito;
    }
    c.erros = erros;
    if (Object.keys(erros).length) { log('cadastro de cliente com erro', Object.keys(erros).join(', ')); desenharModal(); focarErro('fl', erros); return; }
    if (atual) Object.assign(atual, cliente);
    // id nunca reaproveitada: pagamentos de cliente removido continuam guardados com a id antiga
    else E.clientes.push({ id: proximoId('cl', [...E.clientes, ...E.recebimentos.map((p) => ({ id: p.cliente }))]), ...cliente });
    const ok = salvar();
    log(atual ? 'cliente editado' : 'cliente cadastrado', cliente.unidade || 'sem carro');
    avisar(ok ? t('clienteSalvo', { n: cliente.nome }) : t('erroSalvarAparelho'));
    fecharModal();
    desenhar();
  }

  function apagarAnexosDe(dono) {
    for (const a of anexosDe(dono)) Anexos.apagar(a.id).catch((falha) => console.warn('[volante] não consegui apagar o arquivo do anexo', a.id, falha));
    E.anexos = E.anexos.filter((a) => a.dono !== dono);
  }

  function removerCliente() {
    const c = clienteId(UI.modal.cliente);
    if (!c) { fecharModal(); desenhar(); return; }
    E.clientes = E.clientes.filter((x) => x !== c);
    apagarAnexosDe(c.id);
    salvar();
    log('cliente removido', c.id);
    avisar(t('clienteRemovido', { n: c.nome }));
    fecharModal();
    desenhar();
  }

  // confere tamanho e tipo (pelos primeiros bytes) assim que o arquivo é escolhido
  async function escolherAnexo(arquivo) {
    const m = UI.modal;
    if (!m || m.tipo !== 'anexos') return;
    m.arquivo = null; m.tipoArq = null; delete m.erros.arquivo;
    if (!arquivo) { desenharModal(); return; }
    if (arquivo.size > L.REGRAS.anexoMaxBytes) { log('anexo grande demais', tamanhoTxt(arquivo.size)); m.erros.arquivo = 'erroAnexoGrande'; desenharModal(); return; }
    let tipo = null;
    try { tipo = L.tipoPorAssinatura(new Uint8Array(await arquivo.slice(0, 12).arrayBuffer())); }
    catch (falha) { console.warn('[volante] não consegui ler o começo do arquivo escolhido:', falha); }
    if (UI.modal !== m) return; // fechou a janela no meio
    if (!tipo) { log('anexo recusado: não é PDF nem imagem', arquivo.type || 'tipo desconhecido'); m.erros.arquivo = 'erroAnexoTipo'; desenharModal(); return; }
    m.arquivo = arquivo; m.tipoArq = tipo;
    if (!m.f.nome.trim()) m.f.nome = arquivo.name.replace(/\.[^.]*$/, '').replace(/[\\/<>]/g, ' ').slice(0, 60);
    desenharModal();
  }

  async function salvarAnexo() {
    const m = UI.modal;
    if (!m || m.tipo !== 'anexos' || m.gravando) return;
    if (!donoExiste(m.dono)) { log('anexo não guardado: o dono não existe mais', m.dono); fecharModal(); desenhar(); return; }
    const { erros, anexo } = L.validarAnexo(m.f, hojeData());
    if (!m.arquivo) erros.arquivo = 'erroAnexoFalta';
    m.erros = erros;
    if (Object.keys(erros).length) { log('anexo com erro', Object.keys(erros).join(', ')); desenharModal(); focarErro('fa', erros); return; }
    const id = proximoId('ax', E.anexos);
    m.gravando = true;
    desenharModal();
    log('guardando anexo no aparelho', `${id} ${tamanhoTxt(m.arquivo.size)}`);
    try {
      await Anexos.guardar(id, new Blob([m.arquivo], { type: m.tipoArq }));
    } catch (falha) {
      console.error('[volante] falhou ao guardar o anexo no IndexedDB:', falha);
      m.gravando = false;
      if (UI.modal === m) { m.erros = { arquivo: 'erroAnexoAparelho' }; desenharModal(); }
      return;
    }
    E.anexos.push({ id, dono: m.dono, nome: anexo.nome, tipo: m.tipoArq, tamanho: m.arquivo.size, data: anexo.data });
    if (!salvar()) {
      E.anexos = E.anexos.filter((a) => a.id !== id);
      Anexos.apagar(id).catch(() => {});
      avisar(t('erroSalvarAparelho'));
    } else avisar(t('anexoSalvo', { n: anexo.nome }));
    m.gravando = false; m.arquivo = null; m.tipoArq = null; m.f = { nome: '', data: hojeData() };
    desenhar();
  }

  function nomeDoArquivo(a) {
    const ext = { 'application/pdf': 'pdf', 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[a.tipo];
    return `${a.nome.replace(/[^\p{L}\p{N} _-]/gu, '').trim() || 'anexo'}.${ext}`;
  }

  // abre numa aba nova ou baixa; o arquivo vem do próprio aparelho, com o tipo conferido no envio
  async function abrirAnexo(id, baixar) {
    const a = E.anexos.find((x) => x.id === id);
    if (!a) return;
    try {
      const blob = await Anexos.ler(id);
      if (!blob) { log('anexo sem arquivo no aparelho', id); avisar(t('erroAnexoSumiu')); return; }
      const url = URL.createObjectURL(new Blob([blob], { type: a.tipo }));
      const link = document.createElement('a');
      link.href = url; link.rel = 'noopener';
      if (baixar) link.download = nomeDoArquivo(a); else link.target = '_blank';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      log(baixar ? 'anexo baixado' : 'anexo aberto', id);
    } catch (falha) {
      console.error('[volante] não consegui abrir o anexo', id, falha);
      avisar(t('erroAnexoAparelho'));
    }
  }

  function marcarPago(clId, venc) {
    const c = clienteId(clId), hoje = hojeData();
    const l = c && L.lembretePagamento(c, E.recebimentos, hoje);
    if (!l || l.venc !== venc) { log('pagamento ignorado: o vencimento mudou (clique repetido?)', `${clId} ${venc}`); desenhar(); return; }
    E.recebimentos.push({ id: proximoId('pg', E.recebimentos), cliente: c.id, unidade: c.unidade, venc, data: hoje, valor: c.valorSemanal });
    const ok = salvar();
    log('pagamento semanal registrado', `${c.id} ${venc} ${c.valorSemanal}`);
    const u = unidade(c.unidade);
    avisar(ok ? t('pagoOk', { n: c.nome, v: moeda(c.valorSemanal), p: u ? u.placa : '' }) : t('erroSalvarAparelho'));
    desenhar();
  }

  function registrarKm(uid) {
    const u = E.unidades.find((x) => x.id === uid);
    if (!u) return;
    const { erro, km } = L.validarKmInformado(UI.kmLembrete[uid], u.km);

      UI.erroKmLembrete[uid] = erro;
      log('km informado com erro', `${u.placa} ${erro}`);

      return;
    }
    delete UI.erroKmLembrete[uid]; delete UI.kmLembrete[uid];
    u.km = km; u.kmData = hojeData();
    const ok = salvar();
    log('km mensal registrado', `${u.placa} ${km}`);
    const hoje = hojeData();
    const alerta = ['oleo', 'filtro'].map((tp) => [tp, L.situacaoTroca(u, E.manutencoes, tp, hoje)]).find(([, s]) => s.estado === 'passou' || s.estado === 'perto');
    avisar(!ok ? t('erroSalvarAparelho') : alerta
      ? t('kmRegistradoTroca', { p: u.placa, k: fmtNum(km), t: t('curto_' + alerta[0]).toLocaleLowerCase(LOCALE), s: t('tr_' + alerta[1].estado) })
      : t('kmRegistrado', { p: u.placa, k: fmtNum(km) }));
    desenhar();
  }

    if (UI[campo] === id) return true;

    apagarAnexo(x) {
      if (!pedirCerteza('certezaAnexo', x)) return;
      Anexos.apagar(x).catch((falha) => console.warn('[volante] não consegui apagar o arquivo do anexo', x, falha));
      E.anexos = E.anexos.filter((a) => a.id !== x);
      UI.certezaAnexo = null;
      salvar();
      log('anexo apagado', x);
      avisar(t('anexoApagado'));
      desenhar();
    },
    marcarPago(x, y) { marcarPago(x, y); },
    registrarKm(x) { registrarKm(x); },
    apagarPagamento(x) {
      if (!pedirCerteza('certezaPagamento', x)) return;
      E.recebimentos = E.recebimentos.filter((p) => p.id !== x);
      UI.certezaPagamento = null;
      salvar();
      log('pagamento semanal apagado', x);
      avisar(t('pagamentoApagado'));
      desenhar();
    },
  };

  function erroDaBusca() {
    const { ini, fim } = periodo();
    const chave = L.validarPeriodo(ini, fim, hojeTxt());
    if (chave) return { chave };
    for (const [loja, quando] of [[local(UI.busca.local), ini], [local(localDev()), fim]]) {
      if (!L.lojaAberta(loja, quando)) return { chave: 'erroLojaFechada', vars: { l: loja.nome, h: loja.nota } };
    }
    return null;
  }

  function buscar() {
    UI.erroBusca = erroDaBusca();
    if (UI.erroBusca) { UI.tela = 'busca'; desenhar(); return; }
    UI.abaCliente = 'reservar';
    irPara('resultados');
  }

  function atualizarDatasNaPlaca() {
    const { ini, fim } = periodo(), n = L.diarias(ini, fim);
    document.querySelector('form.placa .placa-aba').textContent = n ? dias(n) : '–';
    const dev = document.getElementById('b-fdata');
    dev.min = UI.busca.iniData;
    if (document.activeElement !== dev) dev.value = UI.busca.fimData;
    const erro = document.querySelector('.erro-placa');
    if (erro) erro.remove();
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', (e) => {
    const zona = e.target.closest('[data-zona]');
    if (zona && UI.modal) { adicionarPin(zona, e); return; }
    const el = e.target.closest('[data-acao]');
    if (!el || el.disabled) return;
    if (el.dataset.fundo && e.target !== el) return; // clique dentro da janela não fecha
    if (e.detail > 1 && el.dataset.acao === 'etapaAvancar') return; // 2º clique do duplo não confirma a reserva
    const acao = ACOES[el.dataset.acao];
    if (!acao) { console.warn('[volante] botão sem ação conhecida:', el.dataset.acao); return; }
    acao(el.dataset.x, el.dataset.y);
  });

  // assinatura na tela: desenha com dedo ou mouse; guarda só números (sem imagem)
  let tracando = null;
  document.addEventListener('pointerdown', (e) => {
    const svg = e.target.closest && e.target.closest('#ck-assin');
    if (!svg || !UI.modal || UI.modal.tipo !== 'checkin') return;
    e.preventDefault();
    if (svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
    tracando = [pontoSVG(svg, e)];
    UI.modal.tracos.push(tracando);
    svg.classList.add('assinado');
    svg.querySelector('.traco').setAttribute('d', tracosD(UI.modal.tracos));
  });
  document.addEventListener('pointermove', (e) => {
    if (!tracando) return;
    const svg = document.getElementById('ck-assin');
    if (!svg) { tracando = null; return; }
    const p = pontoSVG(svg, e), ult = tracando[tracando.length - 1];
    const total = UI.modal.tracos.reduce((s, tr) => s + tr.length, 0);
    if (total > 1500 || (Math.abs(p[0] - ult[0]) < 2 && Math.abs(p[1] - ult[1]) < 2)) return;
    tracando.push([Math.max(0, Math.min(300, p[0])), Math.max(0, Math.min(120, p[1]))]);
    svg.querySelector('.traco').setAttribute('d', tracosD(UI.modal.tracos));
  });
  for (const ev of ['pointerup', 'pointercancel']) document.addEventListener(ev, () => { tracando = null; });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && UI.modal) { fecharModal(); return; }
    if (e.key === 'Tab' && UI.modal) {
      const jan = document.querySelector('.janela');
      const itens = [...jan.querySelectorAll('button:not(:disabled), input, select, [tabindex="0"]')];
      const primeiro = itens[0], ultimo = itens[itens.length - 1], atual = document.activeElement;
      if (!jan.contains(atual)) { e.preventDefault(); primeiro.focus(); }
      else if (e.shiftKey && atual === primeiro) { e.preventDefault(); ultimo.focus(); }
      else if (!e.shiftKey && atual === ultimo) { e.preventDefault(); primeiro.focus(); }
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.zona) {
      e.preventDefault();
      adicionarPin(e.target, null);
    }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.dataset.form === 'busca') buscar();
  });

  document.addEventListener('input', (e) => {
    const c = e.target.dataset.campo;
    if (!c) return;
    if (c.startsWith('motorista.')) UI.rascunho.motorista[c.split('.')[1]] = e.target.value;
    if (c === 'vist.km') UI.modal.km = e.target.value;
    if (c === 'ck.texto') UI.modal.texto = e.target.value;
    if (/^f[cmula]\.\w+$/.test(c) && c !== 'fc.foto' && c !== 'fa.arquivo' && UI.modal && UI.modal.f) UI.modal.f[c.slice(3)] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (c === 'fu.valor' && UI.modal) UI.modal.auto = false; // o dono digitou: não troca mais o valor sozinho
    if (c.startsWith('novoFixo.')) UI.novoFixo[c.slice(9)] = e.target.value;
    if (c === 'kmLembrete') UI.kmLembrete[e.target.dataset.x] = e.target.value;
  });

  document.addEventListener('change', (e) => {
    const el = e.target, c = el.dataset.campo;
    if (!c) return;
    if (c === 'fc.foto') { lerFoto(el.files && el.files[0]); return; }
    if (c === 'fa.arquivo') { escolherAnexo(el.files && el.files[0]); return; }
    if (c === 'fu.tipo' || c === 'fu.unidade') {
      const m = UI.modal;
      if (!m || m.tipo !== 'custo') return;
      m.f[c.slice(3)] = el.value;
      ipvaAutomatico(m);
      desenharModal();
      const de = document.getElementById(el.id);
      if (de) de.focus({ preventScroll: true });
      return;
    }
    if (/^f[cmula]\.\w+$/.test(c)) { if (UI.modal && UI.modal.f) UI.modal.f[c.slice(3)] = el.type === 'checkbox' ? el.checked : el.value; return; }
    if (c.startsWith('novoFixo.')) { UI.novoFixo[c.slice(9)] = el.value; return; }
    if (c === 'ficha') { if (E.unidades.some((u) => u.id === el.value)) { UI.fichaId = el.value; desenhar(); } return; }
    if (c === 'fixoNome' || c === 'fixoValor') {
      const f = E.fixos.find((x) => x.id === el.dataset.x);
      if (!f) return;
      const { erros, fixo } = L.validarFixo(c === 'fixoNome' ? { nome: el.value, valor: reaisTxt(f.valor) } : { nome: f.nome, valor: el.value });
      const erro = c === 'fixoNome' ? erros.nome : erros.valor;
      if (erro) { UI.erroFixo[f.id] = erro; desenharDepois(); return; }
      delete UI.erroFixo[f.id];
      if (c === 'fixoNome') f.nome = fixo.nome; else f.valor = fixo.valor;
      salvar();
      log('custo fixo alterado', `${f.nome} ${f.valor}`);
      avisar(t('fixoSalvo', { n: f.nome, v: moeda(f.valor) }));
      desenharDepois();
      return;
    }
    if (c === 'aliquota') {
      const k = el.dataset.x, v = L.validarAliquota(el.value);
      if (!['aliqLocadora', 'aliqParticular'].includes(k)) return;
      if (v === null) { UI.erroConfig[k] = true; desenharDepois(); return; }
      delete UI.erroConfig[k];
      E.config[k] = v;
      salvar();
      log('alíquota de IPVA alterada', `${k} ${v}`);
      avisar(t('aliquotaSalva', { a: pctTxt(v) }));
      desenharDepois();
      return;
    }
    if (c.startsWith('sim.')) {
      const k = c.slice(4);
      if (k === 'n') {
        const n = Number(el.value.trim());
        if (!/^\d{1,3}$/.test(el.value.trim()) || n < 1 || n > 500) UI.sim.erros.n = true;
        else { UI.sim.n = n; delete UI.sim.erros.n; }
      } else if (['custo', 'diaria', 'fipe'].includes(k)) {
        const v = L.validarDinheiro(el.value, 0, 500000000, null);
        if (v === null && el.value.trim() !== '') UI.sim.erros[k] = true;
        else { UI.sim[k] = v; delete UI.sim.erros[k]; }
      }
      desenharDepois();
      return;
    }
    if (c === 'intervalo') {
      const u = E.unidades.find((x) => x.id === el.dataset.x), tipo = el.dataset.y;
      if (!u || !['oleo', 'filtro'].includes(tipo)) return;
      const chave = `${u.id}-${tipo}`, km = L.validarIntervalo(el.value);
      if (km === null) { UI.erroIntervalo[chave] = true; desenharDepois(); return; }
      delete UI.erroIntervalo[chave];
      u[tipo === 'oleo' ? 'oleoKm' : 'filtroKm'] = km;
      salvar();
      log('intervalo de troca alterado', `${u.placa} ${tipo} ${km}`);
      avisar(t('intervaloSalvo', { p: u.placa, k: t('curto_' + tipo), n: fmtNum(km) }));
      desenharDepois();
      return;
    }
    if (c === 'ordem') { UI.ordem = el.value; desenhar(); return; }
    if (c === 'cambio') { UI.cambio = el.value; desenhar(); return; }
    if (c.startsWith('busca.')) {
      const k = c.split('.')[1];
      UI.busca[k] = el.type === 'checkbox' ? el.checked : el.value;
      // devolução nunca fica antes da retirada ao mudar a data de retirada
      if (k === 'iniData' && UI.busca.fimData <= UI.busca.iniData && UI.busca.iniData) UI.busca.fimData = L.somarDias(UI.busca.iniData, 3);
      UI.erroBusca = null;
      if (el.type === 'date') { atualizarDatasNaPlaca(); return; }
      desenhar();
      return;
    }
    if (c === 'plano') {
      const r = UI.rascunho;
      r.plano = el.value;
      if (plano(r.plano).incluiVidros) r.extras = r.extras.filter((x) => x !== 'vidros');
      desenhar();
      return;
    }
    if (c === 'extra') {
      const r = UI.rascunho;
      r.extras = el.checked ? [...r.extras, el.value] : r.extras.filter((x) => x !== el.value);
      desenhar();
      return;
    }
    if (c === 'pagamento') { UI.rascunho.pagamento = el.value; return; }
    if (c === 'motorista.idade') { desenharDepois(); return; }
    if (c === 'vist.comb') { UI.modal.comb = Number(el.value); return; }
    if (c === 'ck.aceite') { UI.modal.aceite = el.checked; UI.modal.erro = null; return; }
    if (c === 'tarifa') {
      const id = el.dataset.x, cents = L.validarTarifa(el.value);
      if (cents === null) { UI.erroTarifa[id] = true; desenharDepois(); return; }
      delete UI.erroTarifa[id];
      E.tarifas[id] = cents;
      salvar();
      log('preço alterado', id);
      avisar(t('tarifaSalva', { m: modelo(id).nome, v: moeda(cents) }));
      desenharDepois();
    }
  });

  // duas abas abertas na mesma demonstração ficam iguais
  window.addEventListener('storage', (e) => {
    if (e.key !== CHAVE) return;
    E = carregar();
    const m = UI.modal;
    if (m && (m.tipo === 'carro' || m.tipo === 'manut' || m.tipo === 'custo')) {
      // janela do dono continua aberta, a não ser que o carro tenha saído da frota na outra aba
      const id = m.tipo === 'custo' ? m.f.unidade : m.unidade;
      if (id && !E.unidades.some((u) => u.id === id)) UI.modal = null;
    } else if (m && m.tipo === 'cliente') {
      if (m.cliente && !clienteId(m.cliente)) UI.modal = null;
    } else if (m && m.tipo === 'anexos') {
      if (!donoExiste(m.dono)) UI.modal = null;
    } else if (m) {
      const r = reserva(m.id);
      const esperado = m.tipo === 'vistoria' ? (m.fase === 'ret' ? 'reservada' : 'retirada') : m.tipo === 'checkin' ? 'reservada' : null;
      if (!r || (esperado && r.status !== esperado)) UI.modal = null;
    }
    if (UI.editandoId && !(reserva(UI.editandoId) && reserva(UI.editandoId).status === 'reservada')) { UI.editandoId = null; UI.rascunho = null; if (UI.tela === 'reserva') UI.tela = 'busca'; }
    if ((UI.tela === 'reservaDet' && !reserva(UI.viagemId)) || (UI.tela === 'confirmada' && !reserva(UI.confirmadaId))) { UI.tela = 'busca'; UI.abaCliente = 'reservar'; }
    desenhar();
  });

  window.addEventListener('resize', () => {
    if (window.innerWidth < 1180 && UI.modo === 'ambos') { UI.modo = 'cliente'; desenhar(); }
  });

  function modoDoEndereco() {
    const pedido = location.hash.slice(1);
    if (['cliente', 'locadora', 'ambos'].includes(pedido)) UI.modo = pedido;
  }
  window.addEventListener('hashchange', () => { modoDoEndereco(); desenhar(); });
  modoDoEndereco();
  desenhar();
  log('demonstração pronta', `${E.unidades.length} carros, ${E.reservas.length} reservas`);
})();

</script>

</html>
