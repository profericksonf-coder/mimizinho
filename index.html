    return `<div class="tela com-barra">
      <button class="voltar" data-acao="irResultados">← ${t('voltar')}</button>
      <div class="vitrine grande">${carroDe(m.id)}</div>
      <div><span class="cc-grupo">${t('cat_' + m.cat)}</span>
      <h1 class="titulo" tabindex="-1">${esc(m.nome)} <small>${t('ouSimilar')}</small></h1></div>
      <div class="specs-ic">${specs(m)}</div>
      <section class="bloco">
        <h2 class="rotulo">${t('oQueInclui')}</h2>
        <ul class="inclui">
          <li>${t('inclui_km')}</li>
          <li>${esc(t('inclui_protecao', { v: moeda(basica.copart) }))}</li>
          <li>${t('inclui_27h')}</li>
          <li>${t('inclui_cancelar')}</li>
          <li>${t('inclui_digital')}</li>
        </ul>
      </section>
      <section class="bloco">
        <h2 class="rotulo">${t('protecoesDisp')}</h2>
        <div class="mini-planos">${D.PLANOS.map((p) => `<div class="mini-plano"><strong>${t('plano_' + p.id)}</strong><small>${p.copart ? esc(t('planoCopart', { v: moeda(p.copart) })) : t('planoSemCopart')}</small><b>${p.dia ? esc(t('maisPorDia', { v: moeda(p.dia) })) : t('incluido')}</b></div>`).join('')}</div>
      </section>
      <section class="bloco">
        <h2 class="rotulo">${t('ondeRetira')}</h2>
        <div class="revisao"><p><strong>${esc(loja.nome)}</strong></p><p>${esc(loja.endereco)} · ${esc(loja.nota)}</p>
          <p>${t('retirada')}: ${esc(dataHora(ini))}</p><p>${t('devolucao')}: ${esc(local(localDev()).nome)}, ${esc(dataHora(fim))}</p></div>
      </section>
      <section class="bloco">
        <h2 class="rotulo">${t('paraRetirar')}</h2>
        <ul class="inclui neutro">
          <li>${t('req_idade', { n: L.REGRAS.idadeMin })}</li>
          <li>${t('req_cnh', { n: L.REGRAS.cnhMinAnos })}</li>
          <li>${t('req_cartao')}</li>
        </ul>
      </section>
      <section class="bloco"><h2 class="rotulo">${t('resumo')}</h2>${conta2HTML(conta)}</section>
    </div>
    <div class="barra"><div><small>${t('total')}</small><b>${esc(moeda(conta.total))}</b></div><button class="botao verde" data-acao="iniciarReserva">${t('reservarCarro')}</button></div>`;
  }

  function conta2HTML(conta) {
    return `<dl class="conta">${conta.linhas.map((l) => `<div><dt>${esc(linhaTexto(l))}</dt><dd>${esc(moeda(l.valor))}</dd></div>`).join('')}
      <div class="conta-total"><dt>${t('total')}</dt><dd>${esc(moeda(conta.total))}</dd></div></dl>`;
  }

  function etapaProtecao() {
    const r = UI.rascunho;
    return `<fieldset class="grupo"><legend class="rotulo">${t('etapa1')}</legend>
      ${D.PLANOS.map((p) => `<label class="opcao plano"><input id="plano-${p.id}" type="radio" name="plano" data-campo="plano" value="${p.id}"${r.plano === p.id ? ' checked' : ''}>
        <span class="op-txt"><strong>${t('plano_' + p.id)}</strong>
          <small>${p.copart ? esc(t('planoCopart', { v: moeda(p.copart) })) : t('planoSemCopart')} · ${esc(t('planoCaucao', { v: moeda(p.caucao) }))}</small>
          <span class="cobre"><em>${t('cobre')}</em>${p.cobre.map((c) => `<span class="sim">${esc(c)}</span>`).join('')}</span>
          ${p.naoCobre.length ? `<span class="cobre"><em>${t('naoCobre')}</em>${p.naoCobre.map((c) => `<span class="nao">${esc(c)}</span>`).join('')}</span>` : ''}
        </span>
        <span class="op-preco">${p.dia ? esc(t('maisPorDia', { v: moeda(p.dia) })) : t('incluido')}</span></label>`).join('')}
    </fieldset>`;
  }

  function etapaAdicionais() {
    const r = UI.rascunho, premium = plano(r.plano).incluiVidros;
    return `<fieldset class="grupo"><legend class="rotulo">${t('etapa2')}</legend>
      ${D.EXTRAS.map((e) => {
        const travado = e.id === 'vidros' && premium;
        return `<label class="opcao${travado ? ' travada' : ''}"><input id="extra-${e.id}" type="checkbox" data-campo="extra" value="${e.id}"${r.extras.includes(e.id) || travado ? ' checked' : ''}${travado ? ' disabled' : ''}>
        <span class="op-txt"><strong>${t('extra_' + e.id)}</strong><small>${travado ? t('vidrosNaPremium') : t('extraTxt_' + e.id)}</small></span>
        <span class="op-preco">${travado ? t('incluido') : esc(t('maisPorDia', { v: moeda(e.dia) }))}</span></label>`;
      }).join('')}
    </fieldset>`;
  }

  function campoMotorista(id, tipo, rotulo, extra) {
    const r = UI.rascunho, erro = r.erros[id];
    return `<div class="campo-claro"><label for="m-${id}">${t(rotulo)}</label>
      <input id="m-${id}" type="${tipo}" value="${esc(r.motorista[id])}" data-campo="motorista.${id}" ${extra || ''} aria-invalid="${!!erro}"${erro ? ` aria-describedby="m-${id}-erro"` : ''}>
      ${erro ? `<p id="m-${id}-erro" class="erro" role="alert">${t(erro)}</p>` : ''}</div>`;
  }

  function etapaMotorista() {
    return `<div class="grupo"><h2 class="rotulo">${t('etapa3')}</h2>
      <p class="nota">${t('avisoDados')}</p>
      ${campoMotorista('nome', 'text', 'nomeCompleto', 'autocomplete="off" maxlength="80"')}
      ${campoMotorista('email', 'email', 'email', 'autocomplete="off" maxlength="120"')}
      ${campoMotorista('fone', 'tel', 'telefone', 'autocomplete="off" maxlength="20"')}
      ${campoMotorista('cpf', 'text', 'cpf', 'autocomplete="off" inputmode="numeric" maxlength="14"')}
      ${campoMotorista('idade', 'number', 'idadeMotorista', 'inputmode="numeric" min="21" max="99"')}
      <p class="nota">${t('avisoIdade', { n: L.REGRAS.idadeMin, c: L.REGRAS.cnhMinAnos })}</p>
    </div>`;
  }

  function etapaPagamento(conta) {
    const r = UI.rascunho, m = modelo(UI.modeloId), { ini, fim } = periodo();
    const ext = r.extras.filter((x) => !(x === 'vidros' && plano(r.plano).incluiVidros));
    return `<div class="grupo"><h2 class="rotulo">${t('resumo')}</h2>
      <div class="revisao">
        <p><strong>${esc(m.nome)}</strong> ${t('ouSimilar')} · ${t('cat_' + m.cat)}</p>
        <p>${t('retirada')}: ${esc(local(UI.busca.local).nome)}, ${esc(dataHora(ini))}</p>
        <p>${t('devolucao')}: ${esc(local(localDev()).nome)}, ${esc(dataHora(fim))}</p>
        <p>${t('protecaoRes')}: ${t('plano_' + r.plano)}</p>
        <p>${t('adicionaisRes')}: ${ext.length ? ext.map((x) => t('extra_' + x)).join(', ') : t('nenhum')}</p>
        <p>${t('condutorRes')}: ${esc(r.motorista.nome)}</p>
      </div>
      ${conta2HTML(conta)}
      <p class="pontos-ganha">${icone('pontos')} ${esc(t('pontosGanha', { n: L.diarias(ini, fim) * L.REGRAS.pontosPorDiaria }))}</p>
    </div>
    <fieldset class="grupo"><legend class="rotulo">${t('pagamento')}</legend>
      ${['cartao', 'pix'].map((p) => `<label class="opcao"><input id="pag-${p}" type="radio" name="pag" data-campo="pagamento" value="${p}"${r.pagamento === p ? ' checked' : ''}><span class="op-txt"><strong>${t('pag_' + p)}</strong></span><span></span></label>`).join('')}
      <p class="nota">${t('pagNota')}</p>
      ${r.erroReserva ? `<p class="erro" role="alert">${t(r.erroReserva)}</p>` : ''}
    </fieldset>`;
  }

  function telaReserva() {
    const r = UI.rascunho, conta = orcar(UI.modeloId, r.plano, r.extras);
    const corpo = [null, etapaProtecao, etapaAdicionais, etapaMotorista, etapaPagamento][r.etapa](conta);
    const ultimo = r.etapa === 4;
    return `<div class="tela com-barra">
      <button class="voltar" data-acao="etapaVoltar">← ${t('voltar')}</button>
      <div class="passos" aria-label="${t('etapaDe', { n: r.etapa })}">
        ${[1, 2, 3, 4].map((n) => `<span class="passo${n === r.etapa ? ' atual' : n < r.etapa ? ' feito' : ''}"><i>${n}</i><span>${t('etapa' + n)}</span></span>`).join('')}
      </div>
      ${corpo}
    </div>
    <div class="barra"><div><small>${t('total')}</small><b>${esc(moeda(conta.total))}</b></div>
      <button class="botao ${ultimo ? 'ambar' : 'verde'}" data-acao="etapaAvancar">${t(ultimo ? (UI.editandoId ? 'salvarAlteracao' : 'confirmarReserva') : 'continuar')}</button></div>`;
  }

  function telaConfirmada() {
    const r = reserva(UI.confirmadaId);
    return `<div class="tela confirmada">
      <div class="chaveiro">
        <span class="argola"></span>
        <div class="etiqueta">
          <small>${esc(D.CONFIG.marca)}</small>
          <strong class="codigo">${esc(r.codigo)}</strong>
          ${placaHTML(unidade(r.unidade).placa)}
        </div>
      </div>
      <h1 class="titulo centro" tabindex="-1">${t(UI.foiAlteracao ? 'reservaAlterada' : 'reservaConfirmada')}</h1>
      <p class="centro specs">${esc(modelo(r.modelo).nome)} ${t('ouSimilar')} · ${esc(dataHora(r.ini))}</p>
      ${L.checkinFeito(r) ? '' : `<p class="centro proximo">${esc(t('proximoPasso', { l: local(r.local).nome }))}</p>`}
      <div class="acoes-col">
        ${L.checkinFeito(r) ? '' : `<button class="botao ambar" data-acao="abrirCheckin" data-x="${r.id}">${t('fazerCheckin')}</button>`}
        <button class="botao verde" data-acao="verViagem" data-x="${r.id}">${t('verReserva')}</button>
        <button class="botao linha" data-acao="irBusca">${t('novaReservaBotao')}</button>
      </div>
    </div>`;
  }

  function cartaoViagem(r) {
    const pend = r.status === 'reservada' && !L.checkinFeito(r);
    return `<button class="cartao-viagem" data-acao="verViagem" data-x="${r.id}">
      <span class="cv-carro">${carroDe(r.modelo)}</span>
      <span class="cv-txt">
        <span class="selo st-${r.status}">${t('st_' + r.status)}</span>
        <strong>${esc(modelo(r.modelo).nome)}</strong>
        <small>${esc(r.codigo)} · ${esc(local(r.local).nome)}</small>
        <small>${esc(dataCurta(r.ini))} → ${esc(dataCurta(r.fim))}</small>
        ${pend ? `<small class="alerta-ck">${t('checkinPendente')}</small>` : ''}
      </span>
    </button>`;
  }

  function cartaoFidelidade() {
    const f = L.fidelidade(E.reservas);
    const niv = L.REGRAS.niveis, i = niv.findIndex(([id]) => id === f.nivel);
    const pct = f.proximo ? Math.round(((f.saldo - niv[i][1]) / (niv[i + 1][1] - niv[i][1])) * 100) : 100;
    return `<section class="fid nivel-${f.nivel}">
      <div class="fid-topo"><span>${t('fidTitulo')}</span><span class="selo">${t('fidNivel', { n: t('nivel_' + f.nivel) })}</span></div>
      <b class="fid-saldo">${t('fidSaldo', { n: f.saldo.toLocaleString(LOCALE) })}</b>
      <div class="fid-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
      <small>${f.proximo ? t('fidFaltam', { n: f.faltam, p: t('nivel_' + f.proximo) }) : t('fidTopo')}</small>
      ${f.pendentes ? `<small>${t('fidPendentes', { n: f.pendentes })}</small>` : ''}
      <small>${t('fidRegra', { n: L.REGRAS.pontosPorDiaria })}</small>
    </section>`;
  }

  function telaReservas() {
    const minhas = E.reservas.filter((r) => r.minha).sort((a, b) => L.ms(b.ini) - L.ms(a.ini));
    const prox = minhas.filter((r) => L.reservaOcupa(r)).reverse(), ant = minhas.filter((r) => !L.reservaOcupa(r));
    return `<div class="tela">
      ${cartaoFidelidade()}
      ${!minhas.length ? `<p class="vazio">${t('semReservas')}</p>` : ''}
      ${prox.length ? `<section class="bloco"><h2 class="rotulo">${t('proximas')}</h2><div class="lista">${prox.map(cartaoViagem).join('')}</div></section>` : ''}
      ${ant.length ? `<section class="bloco"><h2 class="rotulo">${t('anteriores')}</h2><div class="lista">${ant.map(cartaoViagem).join('')}</div></section>` : ''}
    </div>`;
  }

  function telaReservaDet() {
    const r = reserva(UI.viagemId);
    return `<div class="tela">
      <button class="voltar" data-acao="irReservas">← ${t('voltar')}</button>
      ${detalheReserva(r, false)}
    </div>`;
  }

  // mesmo miolo na tela de reserva do cliente e na janela da locadora
  function detalheReserva(r, noPainel) {
    const u = unidade(r.unidade), m = modelo(r.modelo);
    const ck = L.checkinFeito(r);
    const passos = [['st_reservada', true], ['tl_checkin', ck || r.status === 'retirada' || r.status === 'devolvida'], ['st_retirada', r.status === 'retirada' || r.status === 'devolvida'], ['st_devolvida', r.status === 'devolvida']];
    const ext = r.extras.filter((x) => !(x === 'vidros' && plano(r.plano).incluiVidros));
    return `<div class="det">
      <div class="det-topo">
        <div><span class="selo st-${r.status}">${t('st_' + r.status)}</span><h2 class="det-codigo">${esc(r.codigo)}</h2></div>
        ${placaHTML(u.placa)}
      </div>
      <div class="vitrine pequena">${carroDe(r.modelo)}</div>
      <p><strong>${esc(m.nome)}</strong> ${t('ouSimilar')} · ${t('cat_' + m.cat)}</p>
      ${r.status !== 'cancelada' ? `<ol class="linha-tempo">${passos.map(([k, feito]) => `<li class="${feito ? 'feito' : ''}">${t(k)}</li>`).join('')}</ol>` : ''}
      ${noPainel ? `<p>${t('colCliente')}: <strong>${esc(r.motorista.nome)}</strong></p>` : ''}
      <p>${t('retirada')}: ${esc(local(r.local).nome)}, ${esc(dataHora(r.ini))}</p>
      <p>${t('devolucao')}: ${esc(local(r.localDev).nome)}, ${esc(dataHora(r.fim))}</p>
      <p>${t('protecaoRes')}: ${t('plano_' + r.plano)} · ${t('adicionaisRes')}: ${ext.length ? ext.map((x) => t('extra_' + x)).join(', ') : t('nenhum')}</p>
      ${r.status === 'reservada' ? blocoCheckin(r) : ''}
      ${resumoVistorias(r)}
      ${conta2HTML(r)}
      ${r.multa ? `<p class="nota">${esc(t('multaCobrada', { v: moeda(r.multa) }))}</p>` : ''}
      ${acoesReserva(r, noPainel)}
    </div>`;
  }

  function blocoCheckin(r) {
    if (!L.checkinFeito(r)) return `<div class="ck-caixa pendente"><strong>${t('checkinPendente')}</strong><small>${esc(t('proximoPasso', { l: local(r.local).nome }))}</small></div>`;
    return `<div class="ck-caixa ok">
      ${C.qr(r.codigo)}
      <div><strong>${t('checkinOk')}</strong><small>${esc(t('ck_prontoTxt', { l: local(r.local).nome }))}</small>
      <small>${t('ck_qrSimulado')} · ${esc(t('ck_assinadoEm', { d: dataHora(r.checkin.em) }))}</small></div>
    </div>`;
  }

  function resumoVistorias(r) {
    const v = r.vistoria || {};
    if (!v.ret && !v.dev) return '';
    const novos = v.dev ? v.dev.pins.length : 0;
    return `<section class="bloco"><h3 class="rotulo">${t('vistorias')}</h3>
      <div class="vist-duas">
        ${v.ret ? vistoriaMini(v.ret, [], t('retirada')) : ''}
        ${v.dev ? vistoriaMini(v.dev, v.ret ? v.ret.pins : [], t('devolucao')) : ''}
      </div>
      ${v.dev ? `<p class="selo ${novos ? 'pare' : 'ok'}">${esc(novos === 1 ? t('danoNovoUm') : novos ? t('danosNovos', { n: novos }) : t('semDanoNovo'))}</p>` : ''}
    </section>`;
  }

  function pinsSVG(pins, classe) {
    return pins.map((p, i) => `<g class="pin ${classe}" transform="translate(${Number(p.x)} ${Number(p.y)})"><circle r="${classe === 'velho' ? 6 : 10}"/><text text-anchor="middle" dy="4">${classe === 'velho' ? '' : i + 1}</text></g>`).join('');
  }

  const NIVEIS_COMB = { 8: 'cheio', 6: 'tresQuartos', 4: 'meio', 2: 'umQuarto', 0: 'vazio' };

  function vistoriaMini(v, antigos, rotulo) {
    return `<div class="vist-mini">
      <svg viewBox="0 0 200 420" aria-hidden="true">${C.deCima('var(--carro-claro)')}${pinsSVG(antigos, 'velho')}${pinsSVG(v.pins, 'novo')}</svg>
      <div><strong>${esc(rotulo)}</strong>
      <small>${t('combustivel')}: ${t(NIVEIS_COMB[v.comb] || 'cheio')}</small>
      <small>${esc(Number(v.km).toLocaleString(LOCALE))} km · ${esc(t('fotosFeitas', { n: v.fotos.length }))}</small>
      ${v.pins.length ? `<ul class="danos">${v.pins.map((p, i) => `<li>${i + 1}. ${t('zona_' + p.zona)}: ${t('av_' + p.tipo)}</li>`).join('')}</ul>` : `<small>${t('semAvarias')}</small>`}</div>
    </div>`;
  }

  function acoesReserva(r, noPainel) {
    if (r.status === 'reservada') {
      const certeza = UI.certezaCancelar === r.id;
      const multa = L.multaCancelamento(r, hojeTxt());
      const ck = L.checkinFeito(r);
      return `<div class="acoes-col">
        ${ck ? `<button class="botao verde" data-acao="abrirVistoria" data-x="${r.id}" data-y="ret">${t('fazerVistoriaRet')}</button>`
          : `<button class="botao ambar" data-acao="abrirCheckin" data-x="${r.id}">${t('fazerCheckin')}</button>`}
        ${r.minha && !noPainel ? `<button class="botao linha" data-acao="alterar" data-x="${r.id}">${t('alterarReserva')}</button>` : ''}
        ${certeza ? `<div class="certeza" role="alert"><p>${esc(multa ? t('cancelarMulta', { v: moeda(multa) }) : t('cancelarGratis'))}</p>
          <div class="certeza-botoes"><button class="botao pare" data-acao="cancelarSim" data-x="${r.id}">${t('simCancelar')}</button><button class="botao linha" data-acao="cancelarNao">${t('naoManter')}</button></div></div>`
          : `<button class="botao linha" data-acao="cancelarPedir" data-x="${r.id}">${t('cancelarReserva')}</button>`}
      </div>`;
    }
    if (r.status === 'retirada') {
      return `<div class="acoes-col"><button class="botao ambar" data-acao="abrirVistoria" data-x="${r.id}" data-y="dev">${t('fazerVistoriaDev')}</button></div>`;
    }
    return '';
  }

  function cliente() {
    const telas = { busca: telaBusca, resultados: telaResultados, carro: telaCarro, reserva: telaReserva, confirmada: telaConfirmada, reservas: telaReservas, reservaDet: telaReservaDet };
    const semAbas = UI.tela === 'carro' || UI.tela === 'reserva';
    return `<section class="sup-cliente" aria-label="${t('vistaCliente')}">
      <div class="rolo" id="rolo-cliente">${telas[UI.tela]()}</div>
      ${semAbas ? '' : `<nav class="abas">
        <button data-acao="irBusca" aria-pressed="${UI.abaCliente === 'reservar'}">${t('abaReservar')}</button>
        <button data-acao="irReservas" aria-pressed="${UI.abaCliente === 'reservas'}">${t('abaReservas')}</button>
      </nav>`}
    </section>`;
  }

  /* ---------- LOCADORA ---------- */
  const naLoja = (id) => UI.lojaPainel === 'todas' || id === UI.lojaPainel;

  function filtroLojas() {
    if (D.LOCAIS.length < 2) return ''; // loja única: filtro não serve pra nada
    const op = [['todas', t('todasLojas')], ...D.LOCAIS.map((l) => [l.id, l.nome])];
    return `<div class="filtros" id="rolo-lojas" role="group">${op.map(([id, nome]) => `<button class="chip" data-acao="lojaPainel" data-x="${id}" aria-pressed="${UI.lojaPainel === id}">${esc(nome)}</button>`).join('')}</div>`;
  }

  function kpis() {
    const k = L.indicadores(E, hojeTxt());
    return `<div class="kpis">
      <div class="kpi"><small>${t('kpiRetiradas')}</small><b>${k.retiradasHoje}</b></div>
      <div class="kpi"><small>${t('kpiDevolucoes')}</small><b>${k.devolucoesHoje}</b></div>
      <div class="kpi"><small>${t('kpiNaRua')}</small><b>${k.naRua} <i>${t('kpiDeFrota', { n: k.frota })}</i></b></div>
      <div class="kpi"><small>${t('kpiParados')}</small><b>${k.vistoria} / ${k.manutencao}</b></div>
      <div class="kpi"><small>${t('kpiReceita')}</small><b>${esc(moeda(k.receitaMes))}</b></div>
    </div>`;
  }

  function painelHoje() {
    const hoje = hojeTxt().slice(0, 10), agora = hojeTxt();
    const ret = E.reservas.filter((r) => r.status === 'reservada' && r.ini.slice(0, 10) === hoje && naLoja(r.local)).sort((a, b) => L.ms(a.ini) - L.ms(b.ini));
    const dev = E.reservas.filter((r) => r.status === 'retirada' && r.fim.slice(0, 10) <= hoje && naLoja(r.localDev)).sort((a, b) => L.ms(a.fim) - L.ms(b.fim));
    const linha = (r, quando, extra) => `<tr class="${UI.destaque === r.id ? 'pulsa' : ''}">
        <td class="mono">${esc(quando.slice(0, 10) === hoje ? quando.slice(11) : dataCurta(quando) + ' ' + quando.slice(11))}</td>
        <td><button class="link mono" data-acao="abrirReserva" data-x="${r.id}">${esc(r.codigo)}</button></td>
        <td>${esc(r.motorista.nome)}</td>
        <td>${esc(modelo(r.modelo).nome)}<small>${esc(unidade(r.unidade).placa)} · ${esc(local(r.local).nome)}</small></td>
        <td>${extra}</td></tr>`;
    const tabela = (lista, cab, fn) => lista.length ? `<div class="tabela-rolo"><table class="tabela">
        <thead><tr><th>${t('colHora')}</th><th>${t('colCodigo')}</th><th>${t('colCliente')}</th><th>${t('colCarro')}</th><th>${cab}</th></tr></thead>
        <tbody>${lista.map(fn).join('')}</tbody></table></div>` : `<p class="vazio">${t('nadaHoje')}</p>`;
    return `${blocoLembretes()}${filtroLojas()}
      <section class="bloco"><h2 class="rotulo">${t('retiradasHoje')}</h2>
        ${tabela(ret, t('colCheckin'), (r) => linha(r, r.ini, L.checkinFeito(r) ? `<span class="selo ok">${t('ckFeito')}</span>` : `<span class="selo atencao">${t('ckFalta')}</span>`))}</section>
      <section class="bloco"><h2 class="rotulo">${t('devolucoesHoje')}</h2>
        ${tabela(dev, t('colSituacao'), (r) => linha(r, r.fim, L.ms(r.fim) < L.ms(agora) ? `<span class="selo pare">${t('atrasada')}</span>` : `<span class="selo st-retirada">${t('st_retirada')}</span>`))}</section>`;
  }

  function quadro() {
    const hoje = hojeTxt().slice(0, 10), nDias = 14, celula = 52, inicio = L.somarDias(hoje, -1);
    const base = L.ms(`${inicio}T00:00`);
    const fmtDia = new Intl.DateTimeFormat(LOCALE, { day: '2-digit', timeZone: 'UTC' });
    const fmtSem = new Intl.DateTimeFormat(LOCALE, { weekday: 'narrow', timeZone: 'UTC' });
    const cabec = [];
    for (let i = 0; i < nDias; i++) {
      const d = L.somarDias(inicio, i);
      cabec.push(`<div class="q-dia${d === hoje ? ' hoje' : ''}"><small>${esc(fmtSem.format(L.ms(`${d}T00:00`)))}</small>${esc(fmtDia.format(L.ms(`${d}T00:00`)))}</div>`);
    }
    const agoraX = ((L.ms(hojeTxt()) - base) / L.DIA) * celula;
    const ordemLoja = (u) => D.LOCAIS.findIndex((l) => l.id === u.local);
    const carros = E.unidades.filter((u) => naLoja(u.local)).sort((a, b) => ordemLoja(a) - ordemLoja(b));
    const linhas = carros.map((u) => {
      const m = modelo(u.modelo);
      const barras = E.reservas.filter((r) => r.unidade === u.id && r.status !== 'cancelada').map((r) => {
        const a = (L.ms(r.ini) - base) / L.DIA, b = (L.ms(r.fim) - base) / L.DIA;
        if (b <= 0 || a >= nDias) return '';
        const esq = Math.max(a, 0) * celula, larg = (Math.min(b, nDias) - Math.max(a, 0)) * celula;
        return `<button class="q-barra st-${r.status}${UI.destaque === r.id ? ' pulsa' : ''}" style="left:${esq}px;width:${Math.max(larg - 3, 18)}px" data-acao="abrirReserva" data-x="${r.id}" title="${esc(r.codigo)} · ${esc(r.motorista.nome)}">${esc(r.motorista.nome)}</button>`;
      }).join('');
      return `<div class="q-linha">
        <div class="q-rotulo"><strong>${esc(m.nome)}</strong><small>${esc(u.placa)} · ${esc(local(u.local).nome)}</small></div>
        <div class="q-trilha${u.situacao === 'manutencao' ? ' manutencao' : ''}" style="width:${nDias * celula}px">${barras}</div>
      </div>`;
    }).join('');
    return `${filtroLojas()}
      <div class="legenda">
        <span><i class="st-reservada"></i>${t('legReservada')}</span><span><i class="st-retirada"></i>${t('legNaRua')}</span>
        <span><i class="st-devolvida"></i>${t('legDevolvida')}</span><span><i class="manutencao"></i>${t('legManutencao')}</span>
        <em>${t('quadroAjuda')}</em>
      </div>
      <div class="quadro" id="rolo-quadro" tabindex="0" style="--celula:${celula}px">
        <div class="q-interno" style="--agora:${agoraX}px">
          <div class="q-linha q-cabec"><div class="q-rotulo"></div><div class="q-dias">${cabec.join('')}</div></div>
          ${linhas}
        </div>
      </div>`;
  }

  function reservasTabela() {
    const lista = E.reservas
      .filter((r) => UI.filtroReservas === 'todas' || L.reservaOcupa(r))
      .sort((a, b) => L.ms(a.ini) - L.ms(b.ini));
    const filtro = [['ativas', 'filtroAtivas'], ['todas', 'filtroTodas']];
    return `<div class="filtros" id="rolo-filtro" role="group">${filtro.map(([id, k]) => `<button class="chip" data-acao="filtroReservas" data-x="${id}" aria-pressed="${UI.filtroReservas === id}">${t(k)}</button>`).join('')}</div>
      ${lista.length ? `<div class="tabela-rolo" id="rolo-reservas" tabindex="0"><table class="tabela">
        <thead><tr><th>${t('colCodigo')}</th><th>${t('colCliente')}</th><th>${t('colCarro')}</th><th>${t('colLocal')}</th><th>${t('retirada')}</th><th>${t('devolucao')}</th><th class="num">${t('total')}</th><th>${t('colSituacao')}</th></tr></thead>
        <tbody>${lista.map((r) => `<tr class="${UI.destaque === r.id ? 'pulsa' : ''}">
          <td><button class="link mono" data-acao="abrirReserva" data-x="${r.id}">${esc(r.codigo)}</button></td>
          <td>${esc(r.motorista.nome)}</td>
          <td>${esc(modelo(r.modelo).nome)}<small>${esc(unidade(r.unidade).placa)}</small></td>
          <td>${esc(local(r.local).nome)}</td>
          <td>${esc(dataHora(r.ini))}</td><td>${esc(dataHora(r.fim))}</td>
          <td class="num">${esc(moeda(r.total))}</td>
          <td><span class="selo st-${r.status}">${t('st_' + r.status)}</span>${r.vistoria?.dev?.pins.length ? `<small class="alerta-dano">${t('danoNovoCurto')}</small>` : ''}</td>
        </tr>`).join('')}</tbody></table></div>` : `<p class="vazio">${t('nenhumaReserva')}</p>`}`;
  }

  function frotaLista() {
    const carros = E.unidades.filter((u) => naLoja(u.local));
    return `${filtroLojas()}<div class="frota-topo"><button class="botao verde" data-acao="novoCarro">+ ${t('cadastrarCarro')}</button></div>
      <div class="tabela-rolo" id="rolo-frota" tabindex="0"><table class="tabela">
      <thead><tr><th>${t('placaCarro')}</th><th>${t('colCarro')}</th><th>${t('colLocal')}</th><th class="num">${t('colKm')}</th><th>${t('colSituacao')}</th><th></th></tr></thead>
      <tbody>${carros.map((u) => {
        const estado = L.estadoCarro(E, u, hojeData());
        const botao = estado === 'alugado' ? `<button class="fino" disabled>${t('mandarManutencao')}</button>`
          : estado === 'disponivel' ? `<button class="fino" data-acao="manutencao" data-x="${u.id}">${t('mandarManutencao')}</button>`
          : `<button class="fino" data-acao="liberar" data-x="${u.id}">${t('liberar')}</button>`;
        return `<tr>
          <td>${placaHTML(u.placa)}</td><td>${esc(modelo(u.modelo).nome)}<small>${t('cat_' + modelo(u.modelo).cat)} · ${esc(u.ano)}${u.cor ? ` · ${esc(u.cor)}` : ''}</small></td><td>${esc(local(u.local).nome)}</td>
          <td class="num">${esc(Number(u.km).toLocaleString(LOCALE))}</td>
          <td><span class="selo car-${estado}">${t('car_' + estado)}</span></td>
          <td><span class="acoes-linha">${botao}<button class="fino" data-acao="editarCarro" data-x="${u.id}">${t('editarCarro')}</button></span></td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
  }

  function precosLista() {
    return `<p class="nota">${t('precoAjuda')}</p>
      <div class="precos">${E.modelos.filter((m) => temFrota(m.id)).map((m) => {
        const erro = UI.erroTarifa[m.id], c = E.tarifas[m.id];
        return `<div class="preco-linha">
          <div class="pl-carro">${carroDe(m.id)}</div>
          <label for="tarifa-${m.id}"><span class="cc-grupo">${t('cat_' + m.cat)}</span><strong>${esc(m.nome)}</strong><small>${t('colTarifa')}</small></label>
          <div class="pl-entrada"><span>R$</span><input id="tarifa-${m.id}" inputmode="decimal" value="${c % 100 ? (c / 100).toFixed(2).replace('.', ',') : c / 100}" data-campo="tarifa" data-x="${m.id}" aria-invalid="${!!erro}"></div>
          ${erro ? `<p class="erro" role="alert">${t('erroTarifa')}</p>` : ''}
        </div>`;
      }).join('')}</div>`;
  }

  /* ---------- manutenção (dono) ---------- */
  const SELO_TROCA = { passou: 'pare', perto: 'atencao', ok: 'ok', semRegistro: '' };
  const PESO_TROCA = { passou: 0, perto: 1, semRegistro: 2, ok: 3 };

  function trocasDaFrota() {
    const hoje = hojeData();
    return E.unidades.map((u) => {
      const oleo = L.situacaoTroca(u, E.manutencoes, 'oleo', hoje), filtro = L.situacaoTroca(u, E.manutencoes, 'filtro', hoje);
      return { u, oleo, filtro, pior: Math.min(PESO_TROCA[oleo.estado], PESO_TROCA[filtro.estado]) };
    });
  }

  function blocoTroca(u, tipo, s) {
    const chave = `${u.id}-${tipo}`, erro = UI.erroIntervalo[chave], id = `int-${tipo}-${u.id}`;
    const txt = s.estado === 'semRegistro' ? t('trSemRegistroTxt')
      : t(s.faltam > 0 ? 'trFaltam' : 'trPassou', { p: fmtNum(s.proximaKm), f: fmtNum(Math.abs(s.faltam)) });
    const porData = s.estado === 'semRegistro' ? ''
      : `<small>${esc(t('trUltima', { d: dataBR(s.ultimaData) }))}</small><small>${esc(t(s.diasFaltam > 0 ? 'trData' : 'trDataPassou', { d: dataBR(s.proximaData), n: Math.abs(s.diasFaltam) }))}</small>`;
    return `<div class="troca tr-${s.estado}">
      <div class="troca-topo"><strong>${t('curto_' + tipo)}</strong><span class="selo ${SELO_TROCA[s.estado]}">${t('tr_' + s.estado)}</span></div>
      <small>${esc(txt)}</small>${porData}
      <label for="${id}">${t(tipo === 'oleo' ? 'intervaloOleo' : 'intervaloFiltro')}</label>
      <input id="${id}" inputmode="numeric" value="${esc(s.intervalo)}" data-campo="intervalo" data-x="${u.id}" data-y="${tipo}" aria-invalid="${!!erro}">
      ${erro ? `<p class="erro" role="alert">${t('erroIntervalo')}</p>` : ''}
    </div>`;
  }

  function cartaoManut({ u, oleo, filtro }) {
    const m = modelo(u.modelo);
    const regs = E.manutencoes.filter((r) => r.unidade === u.id).sort((a, b) => b.data.localeCompare(a.data) || b.km - a.km);
    return `<article class="manut-cartao">
      <div class="manut-cab">${placaHTML(u.placa)}<div><strong>${esc(m.nome)}</strong><small>${esc(t('kmAtual', { n: fmtNum(u.km) }))} · ${esc(u.ano)}</small></div>
        <b class="manut-gasto">${esc(t('gastoCarro', { v: moeda(L.gastoManutencao(E.manutencoes, u.id)) }))}</b></div>
      <div class="trocas">${blocoTroca(u, 'oleo', oleo)}${blocoTroca(u, 'filtro', filtro)}</div>
      ${regs.length ? `<ul class="manut-regs">${regs.map((r) => `<li><span><strong>${t('troca_' + r.tipo)}</strong> · ${esc(fmtDataAno.format(L.ms(`${r.data}T00:00`)))} · ${esc(fmtNum(r.km))} km · ${esc(moeda(r.valor))}${r.obs ? `<small>${esc(r.obs)}</small>` : ''}</span>
        <button class="fino" data-acao="apagarManut" data-x="${r.id}">${t(UI.certezaManut === r.id ? 'apagarManutCerteza' : 'apagarManut')}</button></li>`).join('')}</ul>`
        : `<p class="nota">${t('semManutRegistro')}</p>`}
      <button class="botao linha" data-acao="novaManut" data-x="${u.id}">${t('registrarManut')}</button>
    </article>`;
  }

  function manutencaoLista() {
    const lista = trocasDaFrota().sort((a, b) => a.pior - b.pior);
    const vencidas = lista.filter((x) => x.pior === 0).length, perto = lista.filter((x) => x.pior === 1).length;
    const total = E.unidades.reduce((s, u) => s + L.gastoManutencao(E.manutencoes, u.id), 0);
    return `<p class="nota">${esc(t('manutAjuda', { n: fmtNum(L.REGRAS.avisoTrocaKm), d: L.REGRAS.avisoTrocaDias }))}</p>
      <div class="manut-resumo">
        ${vencidas ? `<span class="selo pare">${esc(t('manutVencidas', { n: vencidas }))}</span>` : ''}
        ${perto ? `<span class="selo atencao">${esc(t('manutPerto', { n: perto }))}</span>` : ''}
        <span class="selo">${esc(t('manutTotalGeral', { v: moeda(total) }))}</span>
      </div>
      <div class="manut-lista">${lista.map(cartaoManut).join('')}</div>`;
  }

  /* ---------- ficha do carro, custos, margem, simulador e configurações (dono) ---------- */
  const mesAtual = () => hojeTxt().slice(0, 7);
  const fmtMes = new Intl.DateTimeFormat(LOCALE, { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const nomeMes = (mes) => fmtMes.format(L.ms(`${mes}-01T00:00`));
  const pctTxt = (aliq) => (aliq / 100).toLocaleString(LOCALE, { maximumFractionDigits: 2 });
  const margemTxt = (m) => (m === null ? '–' : `${m.toLocaleString(LOCALE, { maximumFractionDigits: 1 })}%`);
  const moedaSinal = (c) => `<span class="${c < 0 ? 'neg' : ''}">${esc(moeda(c || 0))}</span>`; // c || 0: sem "-R$ 0,00"
  const nomeCarro = (u) => `${u.placa} · ${modelo(u.modelo).nome}`;
  const unidadeFicha = () => E.unidades.find((u) => u.id === UI.fichaId) || E.unidades[0];
  const fotoUnidade = (u) => {
    const m = modelo(u.modelo);
    return u.foto ? `<img class="carro foto-real" src="${esc(u.foto)}" alt="${esc(m.nome)}">` : C.lateral(m.tipo, m.cor, esc(m.nome));
  };

  function mesNav() {
    const atual = UI.mes === mesAtual();
    return `<div class="mes-nav" role="group" aria-label="${t('mesEscolhido')}">
        <button class="fino" data-acao="mes" data-x="-1" aria-label="${t('mesAnterior')}">‹</button>
        <strong>${esc(nomeMes(UI.mes))}</strong>
        <button class="fino" data-acao="mes" data-x="1" aria-label="${t('mesSeguinte')}">›</button>
        ${atual ? '' : `<button class="fino" data-acao="mes" data-x="0">${t('voltarMesAtual')}</button>`}
      </div>
      ${atual ? `<p class="nota">${t('mesEmAndamento')}</p>` : ''}`;
  }

  function contaMargem(mg) {
    const linhas = [
      [t(mg.reservas === 1 ? 'mgReceitaUma' : 'mgReceita', { n: mg.reservas, d: mg.diarias }), mg.receita - mg.semanal],
      ...(mg.semanal ? [[t('mgSemanal'), mg.semanal]] : []),
      [t('mgManutencao'), -mg.manutencao],
      [t('mgCustos'), -mg.custos],
      ...(mg.ipvaEstimado ? [[t('mgIpvaEstimado'), -mg.ipvaEstimado]] : []),
      [t('mgFixo'), -mg.fixo],
    ];
    return `<dl class="conta">${linhas.map(([r, v]) => `<div><dt>${esc(r)}</dt><dd>${moedaSinal(v)}</dd></div>`).join('')}
      <div class="conta-total"><dt>${t('mgLucro')}</dt><dd>${moedaSinal(mg.lucro)}</dd></div>
      <div><dt>${t('mgMargem')}</dt><dd>${esc(margemTxt(mg.margem))}</dd></div></dl>`;
  }

  function listaCustos(u) {
    const lista = E.custos.filter((c) => c.unidade === u.id).sort((a, b) => b.data.localeCompare(a.data) || b.id.localeCompare(a.id));
    if (!lista.length) return `<p class="nota">${t('semCustos')}</p>`;
    return `<ul class="manut-regs">${lista.map((c) => `<li><span><strong>${t('tc_' + c.tipo)}</strong> · ${esc(fmtDataAno.format(L.ms(`${c.data}T00:00`)))} · ${esc(moeda(c.valor))}
        ${L.CUSTOS_ANUAIS.includes(c.tipo) ? `<small>${esc(t('custoAnualTxt', { v: moeda(Math.round(c.valor / 12)) }))}</small>` : ''}${c.obs ? `<small>${esc(c.obs)}</small>` : ''}</span>
      <button class="fino" data-acao="apagarCusto" data-x="${c.id}">${t(UI.certezaCusto === c.id ? 'apagarManutCerteza' : 'apagarManut')}</button></li>`).join('')}</ul>`;
  }

  function fichaCarro() {
    const u = unidadeFicha();
    if (!u) return `<p class="vazio">${t('semCarros')}</p>`;
    const n = E.unidades.length, i = E.unidades.indexOf(u), m = modelo(u.modelo), estado = L.estadoCarro(E, u, hojeData());
    const cliente = L.clienteDoCarro(E, u.id, hojeData());
    const ant = E.unidades[(i - 1 + n) % n], prox = E.unidades[(i + 1) % n];
    const mg = L.margemCarro(E, u, UI.mes);
    const res = E.reservas.filter((r) => r.unidade === u.id && r.ini.slice(0, 7) === UI.mes).sort((a, b) => L.ms(b.ini) - L.ms(a.ini));
    const troca = trocasDaFrota().find((x) => x.u === u);
    const cfg = E.config;
    return `<div class="ficha-nav">
        <button class="fino" id="ficha-ant" data-acao="verFicha" data-x="${ant.id}" aria-label="${t('carroAnterior')}">‹</button>
        <select id="ficha-carro" data-campo="ficha" aria-label="${t('escolherCarro')}">${opcoes(E.unidades.map((x) => [x.id, nomeCarro(x)]), u.id)}</select>
        <button class="fino" id="ficha-prox" data-acao="verFicha" data-x="${prox.id}" aria-label="${t('carroSeguinte')}">›</button>
        <span class="nota">${i + 1} / ${n}</span>
      </div>
      <article class="ficha">
        <div class="ficha-cab">
          <div class="ficha-foto">${fotoUnidade(u)}</div>
          <div class="ficha-dados">${placaHTML(u.placa)}<strong>${esc(m.nome)}</strong>
            <small>${t('cat_' + m.cat)} · ${esc(u.ano)} · ${esc(t('kmAtual', { n: fmtNum(u.km) }))}</small>
            <small>${u.fipe ? esc(t('fichaFipe', { v: moeda(u.fipe) })) : t('fichaSemFipe')}</small>
            <small>${u.cor ? `${esc(t('fichaCor', { c: u.cor }))} · ` : ''}${u.renavam ? esc(t('fichaRenavam', { r: u.renavam })) : t('fichaSemRenavam')}</small>
            ${cliente ? `<small>${t('colCliente')}: <strong>${esc(cliente.nome)}</strong></small>` : ''}
            <span class="acoes-linha"><span class="selo car-${estado}">${t('car_' + estado)}</span><button class="fino" data-acao="editarCarro" data-x="${u.id}">${t('editarCarro')}</button>
              <button class="fino" data-acao="abrirAnexos" data-x="${u.id}">${esc(t('anexosN', { n: anexosDe(u.id).length }))}</button></span>
          </div>
        </div>
        ${mesNav()}
        <section class="bloco"><h3 class="rotulo">${t('fichaMargem')}</h3>${contaMargem(mg)}</section>
        <section class="bloco"><h3 class="rotulo">${t('fichaReservas')}</h3>
          ${res.length ? `<div class="tabela-rolo"><table class="tabela">
            <thead><tr><th>${t('colCodigo')}</th><th>${t('colCliente')}</th><th>${t('retirada')}</th><th>${t('devolucao')}</th><th class="num">${t('total')}</th><th>${t('colSituacao')}</th></tr></thead>
            <tbody>${res.map((r) => `<tr><td><button class="link mono" data-acao="abrirReserva" data-x="${r.id}">${esc(r.codigo)}</button></td><td>${esc(r.motorista.nome)}</td>
              <td>${esc(dataHora(r.ini))}</td><td>${esc(dataHora(r.fim))}</td><td class="num">${esc(moeda(r.status === 'cancelada' ? r.multa : r.total))}</td>
              <td><span class="selo st-${r.status}">${t('st_' + r.status)}</span></td></tr>`).join('')}</tbody></table></div>` : `<p class="nota">${t('fichaSemReservas')}</p>`}
        </section>
        <section class="bloco"><h3 class="rotulo">${t('fichaCustos')}</h3>

          <div class="pl-entrada"><span>R$</span><input id="nf-valor" inputmode="decimal" value="${esc(nf.valor)}" maxlength="13" placeholder="0" data-campo="novoFixo.valor" aria-label="${t('fixoValor')}" aria-invalid="${!!en.valor}"></div>

  function margemPainel() {
    const f = L.margemFrota(E, UI.mes);
    const linhas = f.carros.map((mg, i) => {
      const u = E.unidades.find((x) => x.id === mg.unidade), pos = i === 0 ? 'topo-rank' : i === f.carros.length - 1 ? 'fundo-rank' : '';
      return `<tr class="${pos}"><td class="mono">${i + 1}º</td>
        <td><button class="link" data-acao="verFicha" data-x="${u.id}">${esc(u.placa)}</button><small>${esc(modelo(u.modelo).nome)}</small></td>
        <td class="num">${esc(moeda(mg.receita))}<small>${esc(t('mgDiarias', { n: mg.diarias }))}</small></td>
        <td class="num">${esc(moeda(mg.custoCarro))}</td><td class="num">${esc(moeda(mg.fixo))}</td>
        <td class="num">${moedaSinal(mg.lucro)}</td><td class="num">${esc(margemTxt(mg.margem))}</td></tr>`;
    }).join('');
    const melhor = f.carros[0], pior = f.carros[f.carros.length - 1];
    const placaDe = (mg) => E.unidades.find((x) => x.id === mg.unidade).placa;
    return `${mesNav()}
      <div class="kpis">
        <div class="kpi"><small>${t('mgReceitaFrota')}</small><b>${esc(moeda(f.receita))}</b></div>
        <div class="kpi"><small>${t('mgCustosFrota')}</small><b>${esc(moeda(f.custoCarro))}</b></div>
        <div class="kpi"><small>${t('mgFixoFrota')}</small><b>${esc(moeda(f.fixo))}</b></div>
        <div class="kpi"><small>${t('mgLucro')}</small><b>${moedaSinal(f.lucro)}</b></div>
        <div class="kpi"><small>${t('mgMargem')}</small><b>${esc(margemTxt(f.margem))}</b></div>
      </div>
      ${melhor ? `<div class="manut-resumo"><span class="selo ok">${esc(t('mgMelhor', { p: placaDe(melhor), v: moeda(melhor.lucro) }))}</span>
        <span class="selo pare">${esc(t('mgPior', { p: placaDe(pior), v: moeda(pior.lucro) }))}</span>
        <button class="fino" data-acao="novoCusto" data-x="${esc(UI.fichaId || '')}">+ ${t('lancarCusto')}</button></div>` : ''}

        <thead><tr><th></th><th>${t('colCarro')}</th><th class="num">${t('mgColReceita')}</th><th class="num">${t('mgColCustos')}</th><th class="num">${t('mgColFixo')}</th><th class="num">${t('mgLucro')}</th><th class="num">${t('mgMargem')}</th></tr></thead>
        <tbody>${linhas}</tbody></table></div>` : `<p class="vazio">${t('semCarros')}</p>`}
      ${fixosBloco()}`;
  }

  // ponto de partida do simulador: a frota de hoje, no mês escolhido
  function baseSimulador() {
    const n = E.unidades.length;
    const media = (lista) => (lista.length ? Math.round(lista.reduce((s, v) => s + v, 0) / lista.length) : 0);
    return {
      custo: media(E.unidades.map((u) => L.margemCarro(E, u, UI.mes).custoCarro)),
      diaria: media(E.unidades.map((u) => E.tarifas[u.modelo]).filter(Number.isInteger)),
      fipe: media(E.unidades.map((u) => u.fipe).filter((v) => v > 0)),
      n,
    };
  }

  function simuladorPainel() {
    const base = baseSimulador(), s = UI.sim, cfg = E.config;
    const valor = (k) => (s[k] === null ? base[k] : s[k]);
    const conta = (n) => L.simular({ n, fixosMes: L.totalFixos(E.fixos), custoCarroMes: valor('custo'), diariaMedia: valor('diaria'),
      fipeMedio: valor('fipe'), aliqLocadora: cfg.aliqLocadora, aliqParticular: cfg.aliqParticular });
    const r = conta(s.n);
    const ns = [...new Set([base.n, 5, 10, 15, 20, s.n])].filter((x) => x > 0).sort((a, b) => a - b);
    const campo = (k, rotulo, ajuda) => `<div class="campo-claro"><label for="sim-${k}">${t(rotulo)}</label>
        <div class="pl-entrada"><span>R$</span><input id="sim-${k}" inputmode="decimal" maxlength="13" value="${esc(reaisTxt(valor(k)))}" data-campo="sim.${k}" aria-invalid="${!!s.erros[k]}"></div>
        <p class="nota">${esc(ajuda)}${s[k] !== null ? ` <button class="fino" data-acao="simFrota" data-x="${k}">${t('simUsarFrota')}</button>` : ''}</p>
        ${s.erros[k] ? `<p class="erro" role="alert">${t('erroValorCusto')}</p>` : ''}</div>`;
    const ocup = r.equilibrio === null ? null : Math.round((r.equilibrio / 30) * 100);
    return `<p class="nota">${t('simAjuda')}</p>
      <div class="filtros" role="group" aria-label="${t('simQuantos')}">${[5, 10, 15, 20].map((n) => `<button class="chip" data-acao="simN" data-x="${n}" aria-pressed="${s.n === n}">${esc(t('simNCarros', { n }))}</button>`).join('')}</div>
      <div class="sim-campos">
        <div class="campo-claro"><label for="sim-n">${t('simQuantos')}</label>
          <input id="sim-n" inputmode="numeric" maxlength="3" value="${esc(s.n)}" data-campo="sim.n" aria-invalid="${!!s.erros.n}">
          <p class="nota">${esc(t('simFrotaHoje', { n: base.n }))}</p>
          ${s.erros.n ? `<p class="erro" role="alert">${t('erroSimN')}</p>` : ''}</div>
        ${campo('custo', 'simCusto', t('simCustoAjuda', { m: nomeMes(UI.mes), v: moeda(base.custo) }))}
        ${campo('diaria', 'simDiaria', t('simDiariaAjuda', { v: moeda(base.diaria) }))}
        ${campo('fipe', 'simFipe', t('simFipeAjuda', { v: moeda(base.fipe) }))}
      </div>
      <div class="kpis">
        <div class="kpi"><small>${t('simFixoPorCarro')}</small><b>${esc(moeda(r.fixoPorCarro))}</b><i>${esc(t('simFixoTotal', { v: moeda(L.totalFixos(E.fixos)) }))}</i></div>
        <div class="kpi"><small>${t('simCustoPorCarro')}</small><b>${esc(moeda(r.custoPorCarro))}</b></div>
        <div class="kpi"><small>${esc(t('simEconomia', { n: r.n }))}</small><b>${esc(moeda(r.economiaAnual))}</b><i>${esc(t('simIpvaCarro', { l: moeda(r.ipvaLocadora), p: moeda(r.ipvaParticular) }))}</i></div>
        <div class="kpi"><small>${t('simEquilibrio')}</small><b>${r.equilibrio === null ? '–' : esc(t('simDiariasMes', { n: r.equilibrio }))}</b>${ocup === null ? '' : `<i>${esc(t('simOcupacao', { p: ocup }))}</i>`}</div>
      </div>
      <div class="tabela-rolo" id="rolo-sim" tabindex="0"><table class="tabela rank">
        <thead><tr><th>${t('simColCarros')}</th><th class="num">${t('simFixoPorCarro')}</th><th class="num">${t('simCustoPorCarro')}</th><th class="num">${t('simEquilibrio')}</th><th class="num">${t('simColEconomia')}</th></tr></thead>
        <tbody>${ns.map((n) => { const x = conta(n); return `<tr class="${n === s.n ? 'topo-rank' : ''}"><td>${esc(t('simNCarros', { n }))}${n === base.n ? `<small>${t('simHoje')}</small>` : ''}</td>
          <td class="num">${esc(moeda(x.fixoPorCarro))}</td><td class="num">${esc(moeda(x.custoPorCarro))}</td>
          <td class="num">${x.equilibrio === null ? '–' : esc(t('simDiariasMes', { n: x.equilibrio }))}</td><td class="num">${esc(moeda(x.economiaAnual))}</td></tr>`; }).join('')}</tbody>
      </table></div>
      <p class="nota">${esc(t('simConta', { a: pctTxt(cfg.aliqLocadora), b: pctTxt(cfg.aliqParticular) }))}</p>`;
  }

  function configPainel() {
    const cfg = E.config, e = UI.erroConfig;
    const campo = (k, rotulo, ajuda) => `<div class="campo-claro"><label for="cfg-${k}">${t(rotulo)}</label>
        <div class="pl-entrada"><input id="cfg-${k}" inputmode="decimal" maxlength="5" value="${esc(pctTxt(cfg[k]))}" data-campo="aliquota" data-x="${k}" aria-invalid="${!!e[k]}"><span>%</span></div>

    </section>`;
  }

  /* ---------- clientes do aluguel semanal, anexos e lembretes (dono) ---------- */
  const anexosDe = (dono) => E.anexos.filter((a) => a.dono === dono);
  const clienteId = (id) => E.clientes.find((c) => c.id === id);
  const SELO_LEM = { atrasado: 'pare', hoje: 'atencao', emDias: '' };
  const SELO_CNH = { vencida: 'pare', vence: 'atencao', ok: 'ok' };
  const carroTxt = (id) => { const u = unidade(id); return u ? nomeCarro(u) : t('clCarroRemovido'); };
  const lemPagTxt = (l) => (l.estado === 'atrasado' ? (l.dias === -1 ? t('lem_atrasadoUm') : t('lem_atrasado', { n: -l.dias }))
    : l.estado === 'hoje' ? t('lem_hoje') : l.dias === 1 ? t('lem_amanha') : t('lem_emDias', { n: l.dias }));
  const lemKmTxt = (l) => t('lemKm_' + l.estado, { n: Math.abs(l.dias) });

  // pagamentos semanais e perguntas de km de hoje; `pendentes` = o que precisa de ação agora (atrasado ou hoje)
  function lembretes() {
    const hoje = hojeData();
    const pag = E.clientes.map((c) => ({ c, l: L.lembretePagamento(c, E.recebimentos, hoje) })).filter((x) => x.l)
      .sort((a, b) => a.l.venc.localeCompare(b.l.venc));
    const km = E.clientes.map((c) => { const u = E.unidades.find((x) => x.id === c.unidade); return { c, u, l: L.lembreteKm(c, u, hoje) }; })
      .filter((x) => x.l).sort((a, b) => a.l.dias - b.l.dias);
    const pendentes = pag.filter((x) => x.l.estado !== 'emDias').length + km.filter((x) => x.l.estado !== 'emDias').length;
    return { pag, km, pendentes };
  }

  function blocoLembretes() {
    const { pag, km, pendentes } = lembretes();
    const itemPag = ({ c, l }) => `<li class="lem lem-${l.estado}">
        <div class="lem-txt"><strong>${t('lemPagamento')} · ${esc(c.nome)}</strong>
          <small>${esc(carroTxt(c.unidade))} · ${esc(t('lemPagTxt', { v: moeda(l.valor), d: dataBR(l.venc) }))}</small>
          ${l.abertos > 1 ? `<small class="erro">${esc(t('lemSemanasAbertas', { n: l.abertos }))}</small>` : ''}</div>
        <span class="selo ${SELO_LEM[l.estado]}">${esc(lemPagTxt(l))}</span>
        <button class="botao verde" data-acao="marcarPago" data-x="${c.id}" data-y="${l.venc}">${t('marcarPago')}</button>
      </li>`;
    const itemKm = ({ c, u, l }) => {
      const erro = UI.erroKmLembrete[u.id];
      return `<li class="lem lem-${l.estado}">
        <div class="lem-txt"><strong>${t('lemKm')} · ${esc(c.nome)}</strong>
          <small>${esc(nomeCarro(u))} · ${esc(t('lemKmTxt', { k: fmtNum(u.km), d: dataBR(l.base) }))}</small></div>
        <span class="selo ${SELO_LEM[l.estado]}">${esc(lemKmTxt(l))}</span>
        <span class="lem-km"><input id="km-lem-${u.id}" inputmode="numeric" maxlength="9" autocomplete="off" placeholder="${esc(fmtNum(u.km))}" value="${esc(UI.kmLembrete[u.id] || '')}"
          data-campo="kmLembrete" data-x="${u.id}" aria-label="${esc(t('lemKmNovo') + ' · ' + u.placa)}" aria-invalid="${!!erro}">
          <button class="botao linha" data-acao="registrarKm" data-x="${u.id}">${t('registrarKm')}</button></span>
        ${erro ? `<p class="erro" role="alert">${t(erro)}</p>` : ''}
      </li>`;
    };
    return `<section class="bloco lembretes"><h2 class="rotulo">${pendentes ? esc(t('lembretesN', { n: pendentes })) : t('lembretes')}</h2>
      <p class="nota aviso-lem">${t('lembretesAviso')}</p>
      ${pag.length || km.length ? `<ul class="lem-lista">${pag.map(itemPag).join('')}${km.map(itemKm).join('')}</ul>` : `<p class="vazio">${t('semLembretes')}</p>`}
    </section>`;
  }

  function cartaoCliente(c) {
    const hoje = hojeData(), cnh = L.situacaoCnh(c, hoje), pag = L.lembretePagamento(c, E.recebimentos, hoje);
    const pagos = E.recebimentos.filter((p) => p.cliente === c.id).sort((a, b) => b.venc.localeCompare(a.venc)).slice(0, 4);
    const a = c.antecedentes;
    return `<article class="manut-cartao cliente">
      <div class="cl-cab"><strong>${esc(c.nome)}</strong>
        <small>${t('cpf')} ${esc(c.cpf)} · ${esc(c.fone)}${c.email ? ` · ${esc(c.email)}` : ''}</small>
        <small>${esc(c.endereco)}</small></div>
      <div class="manut-resumo">
        <span class="selo ${SELO_CNH[cnh.estado]}">${esc(t('cnh_' + cnh.estado, { n: cnh.dias }))}</span>
        <span class="selo ${a.ok ? 'ok' : 'atencao'}">${esc(a.ok ? t('ant_sim', { d: dataBR(a.data) }) : t('ant_nao'))}</span>
        ${pag ? `<span class="selo ${SELO_LEM[pag.estado]}">${esc(lemPagTxt(pag))}</span>` : ''}
      </div>
      <small>${esc(t('cnhTxt', { c: c.cnhCategoria, d: dataBR(c.cnhValidade) }))} · nº ${esc(c.cnhNumero)}</small>
      ${a.obs ? `<small>${esc(a.obs)}</small>` : ''}
      ${c.unidade ? `<small><strong>${esc(t('clCarro', { c: carroTxt(c.unidade) }))}</strong></small>
        <small>${esc(t('clPeriodo', { e: dataBR(c.entrega), d: c.devolucao ? dataBR(c.devolucao) : t('clSemDevolucao') }))}</small>
        <small>${esc(t('clValor', { v: moeda(c.valorSemanal), d: t('sem_' + c.diaVenc).toLocaleLowerCase(LOCALE) }))}</small>` : `<small>${t('clSemCarro')}</small>`}
      ${pagos.length ? `<h3 class="rotulo">${t('clPagamentos')}</h3><ul class="manut-regs">${pagos.map((p) => `<li><span>${esc(t('clPagoEm', { v: dataBR(p.venc), r: moeda(p.valor), p: dataBR(p.data) }))}</span>
        <button class="fino" data-acao="apagarPagamento" data-x="${p.id}">${t(UI.certezaPagamento === p.id ? 'apagarManutCerteza' : 'apagarManut')}</button></li>`).join('')}</ul>` : ''}
      <span class="acoes-linha"><button class="fino" data-acao="editarCliente" data-x="${c.id}">${t('editarCarro')}</button>
        <button class="fino" data-acao="abrirAnexos" data-x="${c.id}">${esc(t('anexosN', { n: anexosDe(c.id).length }))}</button></span>
    </article>`;
  }

  function clientesLista() {
    const lista = [...E.clientes].sort((a, b) => a.nome.localeCompare(b.nome, LOCALE));
    return `<p class="nota">${t('clientesAjuda')}</p>
      <div class="frota-topo"><button class="botao verde" data-acao="novoCliente">+ ${t('cadastrarCliente')}</button></div>
      ${lista.length ? `<div class="manut-lista">${lista.map(cartaoCliente).join('')}</div>` : `<p class="vazio">${t('semClientes')}</p>`}`;
  }

  function painel() {
    const abas = [['hoje', 'abaHoje'], ['quadro', 'abaQuadro'], ['reservas', 'abaReservasPainel'], ['frota', 'abaFrota'], ['clientes', 'abaClientes'], ['ficha', 'abaFicha'], ['manut', 'abaManut'],
      ['margem', 'abaMargem'], ['simulador', 'abaSimulador'], ['precos', 'abaPrecos'], ['config', 'abaConfig']];
    const corpo = { hoje: painelHoje, quadro, reservas: reservasTabela, frota: frotaLista, clientes: clientesLista, ficha: fichaCarro, manut: manutencaoLista,
      margem: margemPainel, simulador: simuladorPainel, precos: precosLista, config: configPainel }[UI.abaPainel]();
    const alertas = trocasDaFrota().filter((x) => x.pior <= 1).length;
    const pendentes = lembretes().pendentes;
    const rotuloAba = (id, k) => (id === 'manut' && alertas ? t('abaManutAlerta', { n: alertas })
      : id === 'hoje' && pendentes ? t('abaHojeN', { n: pendentes }) : t(k));
    return `<section class="sup-painel" aria-label="${t('vistaLocadora')}">
      <div class="rolo" id="rolo-painel"><div class="painel-miolo gut">
        ${kpis()}
        <nav class="abas-painel" role="group">${abas.map(([id, k]) => `<button data-acao="abaPainel" data-x="${id}" aria-pressed="${UI.abaPainel === id}">${rotuloAba(id, k)}</button>`).join('')}</nav>
        ${corpo}
      </div></div>
    </section>`;
  }

  /* ---------- janelas ---------- */
  function modalReserva(r) {
    return `<div class="jan-fundo" data-acao="fecharModal" data-fundo="1"><div class="janela" role="dialog" aria-modal="true" aria-label="${esc(r.codigo)}">
      <button class="fechar" id="jan-fechar" data-acao="fecharModal" aria-label="${t('fechar')}">×</button>
      ${detalheReserva(r, true)}
    </div></div>`;
  }

  function fotoHTML(f, cor) {
    if (f === 'frente') return C.frente(cor, false);
    if (f === 'traseira') return C.frente(cor, true);
    return `<span class="${f === 'direita' ? 'espelho' : ''}">${C.lateral('sedan', cor, '')}</span>`;
  }

  function modalVistoria() {
    const v = UI.modal, r = reserva(v.id), fase = v.fase, m = modelo(r.modelo);
    const antigos = fase === 'dev' && r.vistoria.ret ? r.vistoria.ret.pins : [];
    const zonas = C.ZONAS.map((z) => `<rect id="z-${z.id}" class="zona" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="4" tabindex="0" role="button" aria-label="${t('zona_' + z.id)}" data-zona="${z.id}"><title>${t('zona_' + z.id)}</title></rect>`).join('');
    const niveis = [[8, 'cheio'], [6, 'tresQuartos'], [4, 'meio'], [2, 'umQuarto'], [0, 'vazio']];

      <div class="filtros" role="group" aria-label="${t('tipoDano')}">${D.AVARIAS.map((a) => `<button class="chip" id="tipo-${a}" data-acao="tipoDano" data-x="${a}" aria-pressed="${v.dano === a}">${t('av_' + a)}</button>`).join('')}</div>

        <svg id="vist-svg" viewBox="0 0 200 420">${C.deCima('var(--carro-claro)')}${zonas}${pinsSVG(antigos, 'velho')}${pinsSVG(v.pins, 'novo')}</svg>
        <div class="vist-lado">
          ${v.pins.length ? `<ul class="danos">${v.pins.map((p, i) => `<li><span>${i + 1}. ${t('zona_' + p.zona)}: ${t('av_' + p.tipo)}</span><button class="fino" data-acao="removerPin" data-x="${i}">${t('remover')}</button></li>`).join('')}</ul>` : `<p class="nota">${t('semAvarias')}</p>`}

          <div class="campo-claro"><label for="v-km">${t('odometro')}</label><input id="v-km" type="number" inputmode="numeric" min="0" value="${esc(v.km)}" data-campo="vist.km" aria-invalid="${!!v.erroKm}">${v.erroKm ? `<p class="erro" role="alert">${esc(t('erroOdometro', { n: Number(v.erroKm).toLocaleString(LOCALE) }))}</p>` : ''}</div>
        </div>
      </div>
      <button class="botao ${fase === 'ret' ? 'verde' : 'ambar'} largo" id="v-salvar" data-acao="salvarVistoria">${t(fase === 'ret' ? 'registrarRetirada' : 'registrarDevolucao')}</button>
    </div></div>`;
  }

  function contratoHTML(r) {
    const m = modelo(r.modelo), p = plano(r.plano), n = L.diarias(r.ini, r.fim);
    const cob = p.copart ? t('planoCopart', { v: moeda(p.copart) }) : t('planoSemCopart');
    const itens = [
      t('ct_partes', { m: D.CONFIG.marca, n: r.motorista.nome }),
      t('ct_veiculo', { g: t('cat_' + m.cat), c: m.nome, p: unidade(r.unidade).placa }),
      t('ct_periodo', { i: dataHora(r.ini), f: dataHora(r.fim), d: dias(n) }),
      t('ct_protecao', { p: t('plano_' + p.id), c: cob }),
      t('ct_caucao', { v: moeda(p.caucao) }),
      t('ct_km'), t('ct_combustivel'), t('ct_multas'),
      t('ct_total', { v: moeda(r.total) }),
    ];
    return `<div class="contrato"><strong>${t('contratoTitulo')}</strong><ol>${itens.map((x) => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
  }

  const tracosD = (tracos) => tracos.map((tr) => tr.length === 1 ? `M${tr[0][0]} ${tr[0][1]}l0.5 0` : 'M' + tr.map((p) => `${p[0]} ${p[1]}`).join('L')).join('');

  function modalCheckin() {
    const c = UI.modal, r = reserva(c.id), m = modelo(r.modelo);
    let corpo;
    if (c.etapa === 4) {
      corpo = `<div class="ck-pronto">${C.qr(r.codigo)}
        <h3 class="titulo centro" tabindex="-1" id="ck-pronto">${t('ck_prontoTitulo')}</h3>
        <p class="centro">${esc(t('ck_prontoTxt', { l: local(r.local).nome }))}</p>
        <p class="centro nota">${t('ck_qrSimulado')} · ${esc(r.codigo)}</p></div>
        <button class="botao verde largo" data-acao="fecharModal">${t('fechar')}</button>`;
    } else if (c.etapa === 1 || c.etapa === 2) {
      const qual = c.etapa === 1 ? 'cnh' : 'selfie';
      const feito = c[qual];
      corpo = `<p class="nota">${t(qual === 'cnh' ? 'ck_cnhAjuda' : 'ck_selfieAjuda')}</p>
        <div class="ck-foto${feito ? ' feita' : ''}">${feito ? (qual === 'cnh' ? C.cnh(esc(r.motorista.nome)) : C.selfie()) : '<span class="foto-vazia" aria-hidden="true">📷</span>'}</div>
        ${feito ? `<p class="selo ok">${t('ck_fotoOk')}</p><button class="botao linha" data-acao="ckFoto" data-x="${qual}">${t('ck_refazer')}</button>`
          : `<button class="botao linha" id="ck-tirar" data-acao="ckFoto" data-x="${qual}">${t(qual === 'cnh' ? 'ck_tirarCnh' : 'ck_tirarSelfie')}</button>`}
        ${c.erro ? `<p class="erro" role="alert">${t(c.erro)}</p>` : ''}
        <button class="botao verde largo" id="ck-avancar" data-acao="ckAvancar">${t('continuar')}</button>`;
    } else {
      corpo = `<p class="nota">${t('ck_contratoAjuda')}</p>
        ${contratoHTML(r)}
        <label class="marcar claro"><input id="ck-aceite" type="checkbox" data-campo="ck.aceite"${c.aceite ? ' checked' : ''}> ${t('ck_aceite')}</label>
        <div class="assin-caixa">
          <svg id="ck-assin" class="assin${c.tracos.length ? ' assinado' : ''}" viewBox="0 0 300 120" aria-label="${t('ck_assineAqui')}" role="img">
            <text x="150" y="66" text-anchor="middle" class="assin-dica">${t('ck_assineAqui')}</text>
            <path d="M20 96H280" class="assin-linha"/>
            <path class="traco" d="${tracosD(c.tracos)}"/>
          </svg>
          <button class="fino" data-acao="ckLimpar">${t('ck_limpar')}</button>
        </div>
        <div class="campo-claro"><label for="ck-texto">${t('ck_ouDigite')}</label><input id="ck-texto" type="text" maxlength="80" autocomplete="off" value="${esc(c.texto)}" data-campo="ck.texto"></div>
        ${c.erro ? `<p class="erro" role="alert">${t(c.erro)}</p>` : ''}
        <button class="botao ambar largo" id="ck-concluir" data-acao="ckConcluir">${t('ck_concluir')}</button>`;
    }
    return `<div class="jan-fundo"><div class="janela" role="dialog" aria-modal="true" aria-label="${t('checkinTitulo')}">
      <button class="fechar" id="jan-fechar" data-acao="fecharModal" aria-label="${t('fechar')}">×</button>
      <h2 class="titulo">${t('checkinTitulo')}</h2>
      <p class="specs">${esc(r.codigo)} · ${esc(m.nome)} · ${esc(local(r.local).nome)}</p>
      ${c.etapa < 4 ? `<div class="passos">${[1, 2, 3].map((n) => `<span class="passo${n === c.etapa ? ' atual' : n < c.etapa ? ' feito' : ''}"><i>${n}</i><span>${t('ck_passo' + n)}</span></span>`).join('')}</div>` : ''}
      ${corpo}
    </div></div>`;
  }

  function campoForm(pre, id, rotulo, attrs, ajuda) {
    const c = UI.modal, erro = c.erros[id], idEl = `${pre}-${id}`;
    return `<div class="campo-claro"><label for="${idEl}">${t(rotulo)}</label>
      <input id="${idEl}" value="${esc(c.f[id])}" data-campo="${pre}.${id}" ${attrs} aria-invalid="${!!erro}"${erro ? ` aria-describedby="${idEl}-erro"` : ''}>

      ${erro ? `<p id="${idEl}-erro" class="erro" role="alert">${esc(t(erro, { n: anoAtual() + 1 }))}</p>` : ''}</div>`;
  }

    const c = UI.modal, f = c.f, e = c.erros, u = c.unidade ? unidade(c.unidade) : null;
    const titulo = t(u ? 'editarCarroTitulo' : 'cadastrarCarro');
    const cats = D.CATEGORIAS.map((x) => [x, t('cat_' + x)]);
    return `<div class="jan-fundo"><div class="janela" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      <button class="fechar" id="jan-fechar" data-acao="fecharModal" aria-label="${t('fechar')}">×</button>
      <h2 class="titulo">${esc(titulo)}</h2>
      ${campoForm('fc', 'modelo', 'fc_modelo', 'type="text" list="fc-modelos" maxlength="40" autocomplete="off"', t('fc_modeloAjuda'))}
      <datalist id="fc-modelos">${E.modelos.map((m) => `<option value="${esc(m.nome)}"></option>`).join('')}</datalist>
      <div class="campo-claro"><label for="fc-categoria">${t('fc_categoria')}</label>
        <select id="fc-categoria" data-campo="fc.categoria">${opcoes(cats, f.categoria)}</select>

      ${campoForm('fc', 'ano', 'fc_ano', 'type="text" inputmode="numeric" maxlength="4" autocomplete="off"')}
      ${campoForm('fc', 'placa', 'fc_placa', 'type="text" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false"')}
      ${campoForm('fc', 'tarifa', 'fc_tarifa', 'type="text" inputmode="decimal" maxlength="8" autocomplete="off"')}
      ${campoForm('fc', 'cor', 'fc_cor', 'type="text" maxlength="20" autocomplete="off"')}
      ${campoForm('fc', 'renavam', 'fc_renavam', 'type="text" inputmode="numeric" maxlength="13" autocomplete="off" spellcheck="false"', t('fc_renavamAjuda'))}
      ${campoForm('fc', 'km', 'fc_km', 'type="text" inputmode="numeric" maxlength="9" autocomplete="off"')}
      ${campoForm('fc', 'fipe', 'fc_fipe', 'type="text" inputmode="decimal" maxlength="13" autocomplete="off"', t('fc_fipeAjuda', { a: pctTxt(E.config.aliqLocadora) }))}
      <div class="campo-claro"><label for="fc-foto">${t('fc_foto')}</label>
        ${f.foto ? `<img class="fc-foto" src="${esc(f.foto)}" alt="">` : ''}
        <input id="fc-foto" type="file" accept="image/*" data-campo="fc.foto">
        ${f.foto ? `<button class="fino" data-acao="fcSemFoto">${t('fc_removerFoto')}</button>` : ''}
        <p class="nota">${t('fc_fotoAjuda')}</p>
        ${e.foto ? `<p class="erro" role="alert">${t(e.foto)}</p>` : ''}</div>
      <button class="botao verde largo" id="fc-salvar" data-acao="salvarCarro">${t('fc_salvar')}</button>
      ${!u ? '' : c.certezaRemover
        ? `<div class="certeza" role="alert"><p>${esc(t('removerCarroCerteza', { p: u.placa }))}</p>
          <div class="certeza-botoes"><button class="botao pare" data-acao="removerCarroSim">${t('simRemover')}</button><button class="botao linha" data-acao="removerCarroNao">${t('naoManter')}</button></div></div>`
        : `<button class="botao linha" data-acao="removerCarroPedir">${t('removerCarro')}</button>`}
    </div></div>`;
  }

  function modalManut() {
    const c = UI.modal, f = c.f, e = c.erros, u = unidade(c.unidade), m = modelo(u.modelo);
    const tipos = L.TIPOS_MANUTENCAO.map((x) => [x, t('troca_' + x)]), hoje = hojeTxt().slice(0, 10);
    return `<div class="jan-fundo"><div class="janela" role="dialog" aria-modal="true" aria-label="${t('registrarManut')}">
      <button class="fechar" id="jan-fechar" data-acao="fecharModal" aria-label="${t('fechar')}">×</button>
      <h2 class="titulo">${t('registrarManut')}</h2>
      <p class="specs">${esc(m.nome)} ${placaHTML(u.placa)}</p>
      <div class="campo-claro"><label for="fm-tipo">${t('fm_tipo')}</label>
        <select id="fm-tipo" data-campo="fm.tipo">${opcoes(tipos, f.tipo)}</select>
        ${e.tipo ? `<p class="erro" role="alert">${t('erroTipoManut')}</p>` : ''}</div>
      ${campoForm('fm', 'data', 'fm_data', `type="date" max="${hoje}"`)}
      ${campoForm('fm', 'km', 'fm_km', 'type="text" inputmode="numeric" maxlength="9" autocomplete="off"', t('fm_kmAjuda', { n: fmtNum(u.km) }))}
      ${campoForm('fm', 'valor', 'fm_valor', 'type="text" inputmode="decimal" maxlength="10" autocomplete="off"')}
      ${campoForm('fm', 'obs', 'fm_obs', 'type="text" maxlength="200" autocomplete="off"', t('fm_obsAjuda'))}
      <button class="botao verde largo" id="fm-salvar" data-acao="salvarManut">${t('fm_salvar')}</button>
    </div></div>`;
  }

  // lançamento rápido de custo de um carro; no IPVA, o valor já vem calculado pela FIPE × alíquota de locadora
  function modalCusto() {
    const c = UI.modal, f = c.f, e = c.erros, u = unidade(f.unidade), hoje = hojeTxt().slice(0, 10), cfg = E.config;
    const tipos = L.TIPOS_CUSTO.map((x) => [x, t('tc_' + x)]);
    const ajuda = [];
    if (f.tipo === 'ipva') ajuda.push(u && u.fipe ? t('fuIpvaCalc', { v: moeda(L.ipva(u.fipe, cfg.aliqLocadora)), f: moeda(u.fipe), a: pctTxt(cfg.aliqLocadora) }) : t('fuIpvaSemFipe'));
    if (L.CUSTOS_ANUAIS.includes(f.tipo)) ajuda.push(t('fuAnualAjuda'));
    return `<div class="jan-fundo"><div class="janela" role="dialog" aria-modal="true" aria-label="${t('lancarCusto')}">
      <button class="fechar" id="jan-fechar" data-acao="fecharModal" aria-label="${t('fechar')}">×</button>
      <h2 class="titulo">${t('lancarCusto')}</h2>
      <div class="campo-claro"><label for="fu-unidade">${t('fu_carro')}</label>
        <select id="fu-unidade" data-campo="fu.unidade">${opcoes(E.unidades.map((x) => [x.id, nomeCarro(x)]), f.unidade)}</select></div>
      <div class="campo-claro"><label for="fu-tipo">${t('fu_tipo')}</label>
        <select id="fu-tipo" data-campo="fu.tipo">${opcoes(tipos, f.tipo)}</select>
        ${e.tipo ? `<p class="erro" role="alert">${t('erroTipoCusto')}</p>` : ''}</div>
      ${campoForm('fu', 'data', 'fu_data', `type="date" max="${hoje}"`)}
      ${campoForm('fu', 'valor', 'fu_valor', 'type="text" inputmode="decimal" maxlength="13" autocomplete="off"', ajuda.join(' '))}
      ${campoForm('fu', 'obs', 'fu_obs', 'type="text" maxlength="120" autocomplete="off"', t('fu_obsAjuda'))}
      <button class="botao verde largo" id="fu-salvar" data-acao="salvarCusto">${t('fu_salvar')}</button>
    </div></div>`;
  }

  function modalCliente() {
    const c = UI.modal, f = c.f, e = c.erros, atual = c.cliente ? clienteId(c.cliente) : null, hoje = hojeData();
    const titulo = t(atual ? 'editarClienteTitulo' : 'cadastrarCliente');
