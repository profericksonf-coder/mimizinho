<script>
/* Mimizinho v4: login e dados no banco (Supabase, projeto nexora, schema "mimizinho").
   - Só entra quem tem e-mail e senha E está na tabela mimizinho.membros (a RLS do banco confere isso em toda leitura e gravação).
   - Cada lista do estado do app (carros, clientes, reservas…) é uma tabela; cada item é uma linha com o objeto inteiro em "dados".
   - O app continua trabalhando com o estado em memória; aqui só se grava o que mudou desde a última gravação.
   - Os arquivos dos anexos ficam no Storage, bucket PRIVADO "mimizinho-anexos", com o id do anexo como nome.
   A URL e a chave abaixo são PÚBLICAS por natureza (a "publishable key" vai em qualquer site); quem protege os dados é a RLS. */
(function () {
  const URL_PROJETO = 'https://uurpppwozbflveylsngr.supabase.co';
  const CHAVE_PUBLICA = 'sb_publishable_2FVHZr_PghT-65kN3QHpcw_pt5ARtHi';
  const SCHEMA = 'mimizinho', BUCKET = 'mimizinho-anexos';
  const LISTAS = ['modelos', 'unidades', 'removidos', 'reservas', 'manutencoes', 'custos', 'fixos', 'clientes', 'recebimentos', 'anexos'];
  const AJUSTES = ['versao', 'semeadoEm', 'tarifas', 'config'];
  const POR_PAGINA = 1000; // o Supabase devolve no máximo 1000 linhas por pedido
  const log = (msg, extra) => console.info('[mimizinho/banco] ' + msg, extra === undefined ? '' : extra);

  // link de convite ou de troca de senha chega com "#...type=invite" ou "type=recovery": lido ANTES do supabase-js limpar o endereço
  const tipoDoLink = (/[#&]type=(invite|recovery)\b/.exec(location.hash) || [])[1] || null;

  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    console.error('[mimizinho/banco] biblioteca supabase-js não carregou');
    window.Nuvem = { ok: false };
    return;
  }
  const sb = window.supabase.createClient(URL_PROJETO, CHAVE_PUBLICA, {
    db: { schema: SCHEMA },
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' },
  });

  /* ---------- login ---------- */
  async function sessao() {
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;
    return data.session;
  }
  async function entrar(email, senha) {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error) throw error;
    log('entrou', data.user && data.user.id);
    return data.session;
  }
  async function sair() {
    const { error } = await sb.auth.signOut();
    if (error) throw error;
    foto = null;
  }
  async function definirSenha(senha) {
    const { error } = await sb.auth.updateUser({ password: senha });
    if (error) throw error;
  }
  async function pedirLinkSenha(email) {
    const volta = location.origin + location.pathname;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: volta });
    if (error) throw error;
  }
  const aoMudarSessao = (fn) => sb.auth.onAuthStateChange((evento, s) => setTimeout(() => fn(evento, s), 0));

  // quem tem login no Auth (compartilhado com a Nexora) mas não é membro: não vê nada
  async function ehMembro() {
    const { data, error } = await sb.rpc('eh_membro');
    if (error) throw error;
    return data === true;
  }

  /* ---------- ler tudo ---------- */
  // "foto" = o que o banco tem, linha por linha, desde a última leitura/gravação; é a base pra saber o que mudou
  let foto = null;
  // texto canônico (chaves em ordem): o Postgres reordena as chaves do jsonb, então JSON.stringify puro daria "mudou" à toa
  const canon = (v) => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, c) => { o[c] = x[c]; return o; }, {}) : x));

  async function lerTabela(tabela, colunas, ordem) {
    const linhas = [];
    for (let de = 0; ; de += POR_PAGINA) {
      let pedido = sb.from(tabela).select(colunas).order(ordem, { ascending: true });
      if (ordem !== 'chave') pedido = pedido.order('id', { ascending: true }); // desempate estável entre páginas
      const { data, error } = await pedido.range(de, de + POR_PAGINA - 1);
      if (error) throw error;
      linhas.push(...data);
      if (data.length < POR_PAGINA) return linhas;
    }
  }

  // devolve { vazio, estado, aceitar }: vazio = o banco ainda não recebeu nenhuma cópia
  async function carregar() {
    const ajustes = await lerTabela('ajustes', 'chave, valor', 'chave');
    const nova = { ajustes: new Map(), listas: {}, maxPos: {} };
    const estado = {};
    for (const a of ajustes) { estado[a.chave] = a.valor; nova.ajustes.set(a.chave, canon(a.valor)); }
    const listas = await Promise.all(LISTAS.map((t) => lerTabela(t, 'id, pos, dados', 'pos')));
    LISTAS.forEach((t, i) => {
      nova.listas[t] = new Map();
      nova.maxPos[t] = listas[i].reduce((m, l) => Math.max(m, l.pos), -1);
      estado[t] = listas[i].map((l) => { nova.listas[t].set(l.id, canon(l.dados)); return l.dados; });
    });
    const vazio = !nova.ajustes.has('versao');
    log(vazio ? 'banco vazio' : 'dados lidos do banco', vazio ? '' : `${estado.unidades.length} carros, ${estado.clientes.length} clientes, ${estado.anexos.length} anexos`);
    // aceitar(): o app passa a usar esta leitura como base das próximas gravações (se descartar, a base antiga continua)
    return { vazio, estado: vazio ? null : estado, aceitar: () => { foto = nova; } };
  }

  /* ---------- gravar só o que mudou ---------- */
  let fila = Promise.resolve(), ultimoPedido = null, gravando = false, avisoErro = () => {};
  const pendente = () => gravando || ultimoPedido !== null;

  function gravar(E) {
    if (!foto) { log('gravação ignorada: o banco ainda não foi lido'); return; }
    ultimoPedido = JSON.parse(JSON.stringify(E)); // retrato do estado agora; a gravação acontece logo depois
    if (gravando) return;
    gravando = true;
    fila = fila.then(rodarGravacoes).finally(() => { gravando = false; });
  }

  async function rodarGravacoes() {
    while (ultimoPedido) {
      const E = ultimoPedido;
      ultimoPedido = null;
      try {
        await gravarDiferenca(E);
      } catch (erro) {
        const conflito = erro && (erro.code === '23505' || erro.statusCode === '409' || erro.status === 409);
        console.error('[mimizinho/banco] falhou ao gravar' + (conflito ? ' (outra pessoa salvou o mesmo item ao mesmo tempo)' : ''), erro);
        avisoErro(conflito ? 'conflito' : 'erro', erro);
        if (!conflito && !ultimoPedido) {
          // sem internet ou banco fora: tenta de novo em 8s com o estado mais novo
          ultimoPedido = E;
          await new Promise((ok) => setTimeout(ok, 8000));
        }
      }
    }
  }

  /* compara item a item pelo conteúdo. "pos" (a ordem na lista) só é escrita em item NOVO (fim da fila):
     apagar um item não regrava os outros, então a edição que outra pessoa fez num item vizinho não é atropelada. */
  async function gravarDiferenca(E) {
    let mudou = 0;
    for (const t of LISTAS) {
      const antes = foto.listas[t], agora = new Map();
      const novos = [], trocados = [];
      for (const item of E[t] || []) {
        const txt = canon(item);
        agora.set(item.id, txt);
        if (!antes.has(item.id)) novos.push({ id: item.id, pos: foto.maxPos[t] + 1 + novos.length, dados: item });
        else if (antes.get(item.id) !== txt) trocados.push({ id: item.id, dados: item });
      }
      const sumiram = [...antes.keys()].filter((id) => !agora.has(id));
      if (novos.length) {
        // insert (não upsert): se outra pessoa acabou de criar o mesmo id, dá conflito em vez de apagar o dela
        const { error } = await sb.from(t).insert(novos);
        if (error) throw error;
        for (const r of novos) { antes.set(r.id, agora.get(r.id)); foto.maxPos[t] = Math.max(foto.maxPos[t], r.pos); }
      }
      if (trocados.length) {
        // sem "pos" no pedido: a posição que está no banco continua
        const { error } = await sb.from(t).upsert(trocados, { onConflict: 'id' });
        if (error) throw error;
        for (const r of trocados) antes.set(r.id, agora.get(r.id));
      }
      if (sumiram.length) {
        const { error } = await sb.from(t).delete().in('id', sumiram);
        if (error) throw error;
        for (const id of sumiram) antes.delete(id);
      }
      mudou += novos.length + trocados.length + sumiram.length;
    }
    const ajustes = AJUSTES.filter((k) => E[k] !== undefined && foto.ajustes.get(k) !== canon(E[k]))
      .map((k) => ({ chave: k, valor: E[k] }));
    if (ajustes.length) {
      const { error } = await sb.from('ajustes').upsert(ajustes, { onConflict: 'chave' });
      if (error) throw error;
      for (const a of ajustes) foto.ajustes.set(a.chave, canon(a.valor));
    }
    mudou += ajustes.length;
    if (mudou) log('gravado no banco', `${mudou} ${mudou === 1 ? 'item' : 'itens'}`);
  }

  /* ---------- "Anexar cópia salva": troca tudo pelo conteúdo da cópia ---------- */
  const TIPOS = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'];
  const LIMITE = 5 * 1024 * 1024;

  function dataUrlParaBlob(dataUrl, tipoEsperado) {
    const m = /^data:([a-z/+.-]+)?(;base64)?,(.*)$/s.exec(String(dataUrl));
    if (!m || !m[2]) return null;
    const bin = atob(m[3]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: tipoEsperado });
  }

  // aoAvancar(feitos, total) mostra o andamento; devolve quantos arquivos foram enviados e quantos ficaram sem arquivo
  async function importar(estado, arquivos, aoAvancar) {
    await fila; // espera gravações em andamento terminarem
    let enviados = 0, semArquivo = 0;
    const total = estado.anexos.length;
    for (const a of estado.anexos) {
      const blob = arquivos && arquivos[a.id] ? dataUrlParaBlob(arquivos[a.id], a.tipo) : null;
      if (!blob || !TIPOS.includes(a.tipo) || blob.size > LIMITE || blob.size === 0) {
        semArquivo++;
        log('anexo da cópia sem arquivo válido: entra só a ficha', a.id);
      } else {
        const { error } = await sb.storage.from(BUCKET).upload(a.id, blob, { contentType: a.tipo, upsert: true });
        if (error) throw error;
        enviados++;
      }
      if (aoAvancar) aoAvancar(enviados + semArquivo, total);
    }
    const { error } = await sb.rpc('substituir_tudo', { estado });
    if (error) throw error;
    // arquivos antigos que não pertencem a nenhum anexo da cópia
    try {
      const ids = new Set(estado.anexos.map((a) => a.id));
      const { data } = await sb.storage.from(BUCKET).list('', { limit: 1000 });
      const sobra = (data || []).map((o) => o.name).filter((n) => !ids.has(n));
      if (sobra.length) await sb.storage.from(BUCKET).remove(sobra);
    } catch (erro) { console.warn('[mimizinho/banco] não consegui limpar arquivos antigos (não atrapalha):', erro); }
    log('cópia gravada no banco', `${enviados} arquivos enviados, ${semArquivo} sem arquivo`);
    return { enviados, semArquivo };
  }

  /* ---------- arquivos dos anexos no Storage ---------- */
  const arquivos = {
    // anexo novo: sem upsert, pra não sobrescrever o arquivo de outra pessoa que criou o mesmo id
    async guardar(id, blob) {
      const { error } = await sb.storage.from(BUCKET).upload(id, blob, { contentType: blob.type, upsert: false });
      if (error) throw error;
    },
    async ler(id) {
      const { data, error } = await sb.storage.from(BUCKET).download(id);
      if (error) { if (error.statusCode === '404' || error.status === 404 || /not.?found/i.test(error.message)) return null; throw error; }
      return data;
    },
    async apagar(id) {
      const { error } = await sb.storage.from(BUCKET).remove([id]);
      if (error) throw error;
    },
  };

  window.Nuvem = {
    ok: true, tipoDoLink, cliente: sb, canon,
    sessao, entrar, sair, definirSenha, pedirLinkSenha, aoMudarSessao, ehMembro,
    carregar, gravar, importar, pendente, arquivos,
    aoErroGravar: (fn) => { avisoErro = fn; },
    esperarGravacoes: () => fila,
  };
})();

</script>
<script>
/* Mimizinho: arquivos anexados (PDF e imagem). Até a v3 ficavam só no aparelho, no IndexedDB do navegador
   (localStorage não comporta arquivo; o IndexedDB comporta).
   O app guarda a lista (nome, data, tipo, tamanho) junto com os outros dados e aqui só o conteúdo, pela mesma id. */
(function () {
  const BANCO = 'mimizinho-anexos', LOJA = 'arquivos';
  let aberto = null;

  function abrir() {
    if (aberto) return aberto;
    aberto = new Promise((ok, falha) => {
      if (!window.indexedDB) { falha(new Error('este navegador não tem IndexedDB')); return; }
      const pedido = indexedDB.open(BANCO, 1);
      pedido.onupgradeneeded = () => pedido.result.createObjectStore(LOJA);
      pedido.onsuccess = () => ok(pedido.result);
      pedido.onerror = () => falha(pedido.error);
      pedido.onblocked = () => falha(new Error('banco de anexos bloqueado por outra aba'));
    });
    aberto.catch(() => { aberto = null; }); // deixa tentar de novo na próxima vez
    return aberto;
  }

  async function operar(modo, fazer) {
    const db = await abrir();
    return new Promise((ok, falha) => {
      const tx = db.transaction(LOJA, modo);
      const pedido = fazer(tx.objectStore(LOJA));
      tx.oncomplete = () => ok(pedido ? pedido.result : undefined);
      tx.onerror = () => falha(tx.error);
      tx.onabort = () => falha(tx.error || new Error('gravação de anexo abortada (memória cheia?)'));
    });
  }

  const aparelho = {
    guardar: (id, blob) => operar('readwrite', (s) => s.put(blob, id)),
    ler: (id) => operar('readonly', (s) => s.get(id)),
    apagar: (id) => operar('readwrite', (s) => s.delete(id)),
  };
  /* v4 (19/11/2026): com o banco ligado, os arquivos vão pro Storage do Supabase (bucket privado, só membros).
     O IndexedDB do aparelho continua intocado: é de lá que sai a cópia de quem ainda não mandou os dados pro banco. */
  let destino = aparelho;
  window.Anexos = {
    guardar: (id, blob) => destino.guardar(id, blob),
    ler: (id) => destino.ler(id),
    apagar: (id) => destino.apagar(id),
    usarBanco: (arquivosDoBanco) => { destino = arquivosDoBanco || aparelho; },
    noBanco: () => destino !== aparelho,
  };
})();

<script>
/* Mimizinho: telas do cliente e da locadora. Um único estado salvo no aparelho alimenta as duas vistas,
   então a reserva feita de um lado aparece no outro na hora. */
(function () {
  const L = window.Logica, D = window.Dados, C = window.Carros;
  const CHAVE = 'mimizinho-v3';
  const LOCALE = D.CONFIG.locale;
  const log = (msg, extra) => console.info('[volante] ' + msg, extra === undefined ? '' : extra);

  /* v4 (19/11/2026): os dados vêm do banco depois do login. Enquanto a pessoa não entrou, E fica vazio e só a tela de entrada aparece.
     NUVEM.modo: 'banco' = lê e grava no banco; 'bancoVazio' = o banco ainda não recebeu cópia, então o app mostra o que está
     no aparelho (como na v3) e nada vai pro banco até "Anexar cópia salva". */
  let E = null;
  const NUVEM = { tela: 'iniciando', modo: null, erro: null, email: '', form: { email: '', senha: '', senha2: '' }, msg: null, ocupado: false, mexeuLocal: 0 };

  const hojeTxt = () => L.agoraLocal(new Date());
  const amanha = L.somarDias(hojeTxt().slice(0, 10), 1);
  const buscaPadrao = () => ({ local: D.LOCAIS[0].id, localDev: D.LOCAIS[0].id, mesmo: true, iniData: amanha, iniHora: '10:00', fimData: L.somarDias(amanha, 3), fimHora: '10:00' });

  const UI = {
    // 21/11: lado do cliente desligado por D.CONFIG.ladoCliente (o app mostra só a locadora)
    modo: !D.CONFIG.ladoCliente ? 'locadora' : window.innerWidth >= 1180 ? 'ambos' : 'cliente',
    tela: 'busca', abaCliente: 'reservar',
    busca: buscaPadrao(),
    erroBusca: null, categoria: 'todos', cambio: 'todos', ordem: 'menor',
    modeloId: null, viagemId: null, confirmadaId: null, editandoId: null, foiAlteracao: false,
    rascunho: null, abaPainel: 'hoje', lojaPainel: 'todas', filtroReservas: 'ativas', modal: null, destaque: null,
    erroTarifa: {}, erroIntervalo: {}, certezaManut: null,
    // ficha, custos, margem e simulador (dono)
    fichaId: null, mes: hojeTxt().slice(0, 7), sim: simPadrao(), novoFixo: { nome: '', valor: '' }, erroNovoFixo: {},
    erroFixo: {}, erroConfig: {}, certezaCusto: null, certezaFixo: null,
    // clientes, anexos e lembretes (dono)
    kmLembrete: {}, erroKmLembrete: {}, certezaPagamento: null, certezaAnexo: null,
  };
  function simPadrao() { return { n: 10, custo: null, diaria: null, fipe: null, erros: {} }; }

  /* ---------- guardar no aparelho ---------- */
  function salvoValido(s) {
    try {
      const int = Number.isInteger;
      // cor e foto vão direto pra dentro do HTML/SVG: só passam no formato exato
      const modeloOk = (m) => /^[a-z0-9]{1,20}$/.test(m.id) && typeof m.nome === 'string' && m.nome.length >= 1 && m.nome.length <= 40
        && D.CATEGORIAS.includes(m.cat) && ['hatch', 'sedan', 'suv', 'picape', 'van'].includes(m.tipo) && /^#[0-9A-Fa-f]{6}$/.test(m.cor)
        && (m.cambio === undefined || ['manual', 'automatico'].includes(m.cambio))
        && ['lugares', 'portas', 'malas'].every((k) => m[k] === undefined || int(m[k]));
      if (s.versao !== 5 || !Array.isArray(s.modelos) || !s.modelos.every(modeloOk)) return false;
      const modelos = s.modelos.map((m) => m.id), locais = D.LOCAIS.map((l) => l.id), zonas = C.ZONAS.map((z) => z.id);
      const planos = D.PLANOS.map((p) => p.id), extras = D.EXTRAS.map((e) => e.id);
      const num = Number.isFinite;
      const fotoOk = (f) => f === null || (typeof f === 'string' && f.length <= 800000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/.test(f));
      const unidadeOk = (u) => /^u\d+$/.test(u.id) && modelos.includes(u.modelo) && locais.includes(u.local)
        && ['ok', 'vistoria', 'manutencao'].includes(u.situacao) && typeof u.placa === 'string' && u.placa.length <= 10 && num(u.km)
        && int(u.ano) && int(u.oleoKm) && u.oleoKm > 0 && int(u.filtroKm) && u.filtroKm > 0 && fotoOk(u.foto)
        && (u.fipe === undefined || (int(u.fipe) && u.fipe >= 0))
        && (u.cor === undefined || (typeof u.cor === 'string' && u.cor.length <= 20))
        && (u.renavam === undefined || u.renavam === '' || /^\d{11}$/.test(u.renavam))
        && (u.kmData === undefined || u.kmData === null || L.dataValida(u.kmData));
      const frota = [...s.unidades, ...s.removidos];
      const dataOk = (d) => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d) && !Number.isNaN(L.ms(`${d}T00:00`));
      const txt = (v, max) => typeof v === 'string' && v.length <= max;
      const dataOuVazio = (d) => d === '' || dataOk(d);
      const clienteOk = (c) => /^cl\d+$/.test(c.id) && txt(c.nome, 80) && txt(c.cpf, 14) && /^\d{11}$/.test(c.cnhNumero)
        && L.CATEGORIAS_CNH.includes(c.cnhCategoria) && dataOk(c.cnhValidade) && txt(c.endereco, 160) && txt(c.fone, 20) && txt(c.email, 120)
        && typeof c.antecedentes.ok === 'boolean' && dataOuVazio(c.antecedentes.data) && txt(c.antecedentes.obs, 200)
        && (c.unidade === '' || frota.some((u) => u.id === c.unidade)) && dataOuVazio(c.entrega) && dataOuVazio(c.devolucao)
        && (c.diaVenc === null || (int(c.diaVenc) && c.diaVenc >= 0 && c.diaVenc <= 6)) && int(c.valorSemanal) && c.valorSemanal >= 0
        && (c.caucao === undefined || (int(c.caucao) && c.caucao >= 0)) && (c.caucaoData === undefined || dataOuVazio(c.caucaoData))
        && (c.caucaoAcerto === undefined || c.caucaoAcerto === null || (dataOk(c.caucaoAcerto.data) && int(c.caucaoAcerto.descontado)
          && c.caucaoAcerto.descontado >= 0 && int(c.caucaoAcerto.devolvido) && c.caucaoAcerto.devolvido >= 0 && txt(c.caucaoAcerto.motivo, 200)));
      const recebOk = (p) => /^pg\d+$/.test(p.id) && /^cl\d+$/.test(p.cliente) && typeof p.unidade === 'string'
        && dataOk(p.venc) && dataOk(p.data) && int(p.valor) && p.valor >= 0;
      const anexoOk = (a) => /^ax\d+$/.test(a.id) && /^(cl|u)\d+$/.test(a.dono) && txt(a.nome, 60) && L.TIPOS_ANEXO.includes(a.tipo)
        && int(a.tamanho) && a.tamanho >= 0 && dataOk(a.data);
      if (!s.clientes.every(clienteOk) || !s.recebimentos.every(recebOk) || !s.anexos.every(anexoOk)) return false;
      const manutOk = (m) => /^mt\d+$/.test(m.id) && frota.some((u) => u.id === m.unidade) && L.TIPOS_MANUTENCAO.includes(m.tipo)
        && dataOk(m.data) && int(m.km) && int(m.valor) && typeof m.obs === 'string' && m.obs.length <= 200
        && (m.filtro === undefined || m.filtro === '' || L.FILTROS.includes(m.filtro));
      if (!s.unidades.every(unidadeOk) || !s.removidos.every(unidadeOk) || !s.manutencoes.every(manutOk)) return false;
      const custoOk = (c) => /^cu\d+$/.test(c.id) && frota.some((u) => u.id === c.unidade) && L.TIPOS_CUSTO.includes(c.tipo)
        && dataOk(c.data) && int(c.valor) && c.valor >= 0 && typeof c.obs === 'string' && c.obs.length <= 120;
      const fixoOk = (f) => /^fx\d+$/.test(f.id) && typeof f.nome === 'string' && f.nome.length >= 1 && f.nome.length <= 40 && int(f.valor) && f.valor >= 0;
      const aliqOk = (a) => int(a) && a >= 0 && a <= 1000;
      if (!s.custos.every(custoOk) || !s.fixos.every(fixoOk) || !aliqOk(s.config.aliqLocadora) || !aliqOk(s.config.aliqParticular)) return false;
      const pinOk = (p) => num(p.x) && num(p.y) && zonas.includes(p.zona) && D.AVARIAS.includes(p.tipo);
      const vistOk = (v) => !v || (v.pins.every(pinOk) && num(v.comb) && num(v.km) && v.fotos.every((f) => D.FOTOS.includes(f)));
      const assinOk = (a) => a === null
        || (a.tipo === 'texto' && typeof a.texto === 'string' && a.texto.length <= 80)
        || (a.tipo === 'traco' && a.tracos.every((tr) => tr.every((p) => num(p[0]) && num(p[1]))));
      const ckOk = (c) => typeof c.cnh === 'boolean' && typeof c.selfie === 'boolean' && assinOk(c.assinatura)
        && (c.em === null || !Number.isNaN(L.ms(c.em)));
      return typeof s.semeadoEm === 'string'
        && modelos.every((m) => Number.isInteger(s.tarifas[m]))
        && s.reservas.every((r) => /^r[A-Z0-9]+$/.test(r.id) && /^[A-Z0-9]+$/.test(r.codigo)
          && ['reservada', 'retirada', 'devolvida', 'cancelada'].includes(r.status)
          && frota.some((u) => u.id === r.unidade) && modelos.includes(r.modelo)
          && locais.includes(r.local) && locais.includes(r.localDev)
          && planos.includes(r.plano) && r.extras.every((x) => extras.includes(x)) && ['cartao', 'pix'].includes(r.pagamento)
          && !Number.isNaN(L.ms(r.ini)) && !Number.isNaN(L.ms(r.fim))
          && Number.isInteger(r.total) && Number.isInteger(r.tarifaDia) && Number.isInteger(r.multa)
          && typeof r.motorista.nome === 'string'
          && r.linhas.every((l) => typeof D.TEXTOS[l.chave] === 'string' && Number.isInteger(l.valor))
          && ckOk(r.checkin) && vistOk(r.vistoria.ret) && vistOk(r.vistoria.dev));
    } catch (erro) {
      log('dados salvos não batem com a demonstração atual', erro.message);
      return false;
    }
  }

  /* o mesmo caminho vale pro salvo do aparelho, pro que vem do banco e pra cópia anexada:
     migra versões antigas, confere tudo e vira o dia. Devolve null se não passar na conferência. */
  function prepararSalvo(salvo, hoje) {
    if (salvo && salvo.versao === 3) salvo = migrarDaV3(salvo, hoje);
    if (salvo && salvo.versao === 4) salvo = migrarDaV4(salvo, hoje);
    if (!salvoValido(salvo)) return null;
    // carro cadastrado antes dos campos FIPE, cor e RENAVAM: fica "não informado"
    for (const u of [...salvo.unidades, ...salvo.removidos]) {
      if (u.fipe === undefined) u.fipe = 0;
      if (u.cor === undefined) u.cor = '';
      if (u.renavam === undefined) u.renavam = '';
      if (u.kmData === undefined) u.kmData = null;
    }
    if (salvo.semeadoEm === hoje) return salvo;
    log('dia novo: frota, preços e manutenções continuam; as reservas de exemplo recomeçam a partir de hoje');
    return virarDia(salvo, hoje);
  }

  // só no modo "banco vazio": o que este aparelho tinha na v3 (a chave mimizinho-v3 continua a mesma e nunca é apagada)
  function carregar() {
    const hoje = L.agoraLocal(new Date()).slice(0, 10);
    try {
      const bruto = localStorage.getItem(CHAVE);
      if (bruto) {
        const pronto = prepararSalvo(JSON.parse(bruto), hoje);
        if (pronto) return pronto;
        log('dados salvos incompletos ou de versão antiga; recomeçando a demonstração');
      }
    } catch (erro) {
      console.error('[volante] não consegui ler o salvo do aparelho; usando dados de exemplo:', erro);
    }
    return D.semear(L, hoje);
  }

  /* salvo da versão anterior (sem custos): mantém tudo e só acrescenta o que é novo.
     Carro de exemplo que continua com a mesma placa ganha a FIPE e os custos de exemplo; carro do dono fica com FIPE em branco. */
  function migrarDaV3(s, hoje) {
    const novo = D.semear(L, hoje);
    const doExemplo = (u) => !!u && D.UNIDADES.some((x) => x.id === u.id && x.placa === u.placa);
    const frota = [...(Array.isArray(s.unidades) ? s.unidades : []), ...(Array.isArray(s.removidos) ? s.removidos : [])];
    for (const u of frota) if (u && u.fipe === undefined) u.fipe = doExemplo(u) ? D.UNIDADES.find((x) => x.id === u.id).fipe : 0;
    const ativosDoExemplo = (Array.isArray(s.unidades) ? s.unidades : []).filter(doExemplo).map((u) => u.id);
    log('atualizando os dados salvos para a versão com custos e margem; nada do que foi cadastrado se perde');
    return { ...s, versao: 4, custos: novo.custos.filter((c) => ativosDoExemplo.includes(c.unidade)), fixos: novo.fixos, config: novo.config };
  }

  /* salvo da v4 (sem clientes nem anexos): mantém tudo e acrescenta o que é novo.
     Carro de exemplo ganha cor e RENAVAM de exemplo; carro do dono fica com os dois em branco.
     Os clientes de exemplo só entram se o carro deles continua na frota e está livre nas datas do contrato. */
  function migrarDaV4(s, hoje) {
    const novo = D.semear(L, hoje);
    const lista = (v) => (Array.isArray(v) ? v : []);
    const doExemplo = (u) => !!u && D.UNIDADES.some((x) => x.id === u.id && x.placa === u.placa);
    for (const u of [...lista(s.unidades), ...lista(s.removidos)]) {
      if (!u) continue;
      if (u.cor === undefined) u.cor = doExemplo(u) ? D.UNIDADES.find((x) => x.id === u.id).cor : '';
      if (u.renavam === undefined) u.renavam = doExemplo(u) ? D.renavamExemplo(L, u.id) : '';
      if (u.kmData === undefined) u.kmData = null;
    }
    const ativos = lista(s.unidades).filter(doExemplo).map((u) => u.id);
    const clientes = novo.clientes.filter((c) => ativos.includes(c.unidade) && !L.conflitoCarroCliente({ reservas: lista(s.reservas), clientes: [] }, c, null));
    const ids = clientes.map((c) => c.id);
    log('atualizando os dados salvos para a versão com clientes, anexos e lembretes; nada do que foi cadastrado se perde');
    return { ...s, versao: 5, clientes, recebimentos: novo.recebimentos.filter((p) => ids.includes(p.cliente)), anexos: [] };
  }

  // o que o dono cadastrou (carros, preços, manutenções, custos, fixos, alíquotas, clientes, pagamentos, anexos) não pode sumir na virada do dia
  function virarDia(salvo, hoje) {
    const novo = D.semear(L, hoje);
    const carroAindaIgual = (r) => salvo.unidades.some((u) => u.id === r.unidade && u.modelo === r.modelo);
    // reserva de exemplo não cai em cima do contrato de um cliente do aluguel semanal
    const semCliente = (r) => !salvo.clientes.some((c) => c.unidade === r.unidade && L.clienteNoPeriodo(c, r.ini.slice(0, 10), r.fim.slice(0, 10)));
    return { ...novo, modelos: salvo.modelos, unidades: salvo.unidades, removidos: salvo.removidos, tarifas: salvo.tarifas,
      manutencoes: salvo.manutencoes, custos: salvo.custos, fixos: salvo.fixos, config: salvo.config,
      clientes: salvo.clientes, recebimentos: salvo.recebimentos, anexos: salvo.anexos,
      reservas: novo.reservas.filter((r) => carroAindaIgual(r) && semCliente(r)) };
  }

  function salvar() {
    NUVEM.mexeuLocal++;
    if (NUVEM.modo === 'banco') { Nuvem.gravar(E); return true; } // grava em segundo plano; erro aparece num aviso
    try { localStorage.setItem(CHAVE, JSON.stringify(E)); return true; }
    catch (erro) { console.warn('[volante] não consegui salvar no aparelho; os dados valem só até fechar a página:', erro); return false; }
  }

  /* ---------- utilidades ---------- */
  function t(chave, vars) {
    let s = D.TEXTOS[chave];
    if (typeof s !== 'string') { console.warn('[volante] texto faltando:', chave); return String(chave).replace(/[^\w-]/g, ''); }
    if (vars) for (const k of Object.keys(vars)) s = s.split(`{${k}}`).join(vars[k]);
    return s;
  }
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtMoeda = new Intl.NumberFormat(LOCALE, { style: 'currency', currency: D.CONFIG.moeda });
  const moeda = (c) => fmtMoeda.format(c / 100);
  const fmtDataHora = new Intl.DateTimeFormat(LOCALE, { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'UTC' });
  const fmtDataCurta = new Intl.DateTimeFormat(LOCALE, { day: '2-digit', month: 'short', timeZone: 'UTC' });
  const dataHora = (s) => fmtDataHora.format(L.ms(s));
  const dataCurta = (s) => fmtDataCurta.format(L.ms(s));
  const modelo = (id) => E.modelos.find((m) => m.id === id);
  const local = (id) => D.LOCAIS.find((l) => l.id === id);
  // carro removido da frota continua achável, pra reserva antiga abrir
  const unidade = (id) => E.unidades.find((u) => u.id === id) || E.removidos.find((u) => u.id === id);
  const temFrota = (modeloId) => E.unidades.some((u) => u.modelo === modeloId);
  const temReservaAtiva = (u) => E.reservas.some((r) => r.unidade === u.id && L.reservaOcupa(r));
  const fmtNum = (n) => Number(n).toLocaleString(LOCALE);
  const fmtDataAno = new Intl.DateTimeFormat(LOCALE, { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC' });
  const dataBR = (d) => fmtDataAno.format(L.ms(`${d}T00:00`));
  const hojeData = () => hojeTxt().slice(0, 10);
  const anoAtual = () => Number(hojeTxt().slice(0, 4));
  const reaisTxt = (c) => (c % 100 ? (c / 100).toFixed(2).replace('.', ',') : String(c / 100));
  const reserva = (id) => E.reservas.find((r) => r.id === id);
  const plano = (id) => D.PLANOS.find((p) => p.id === id);
  const dias = (n) => (n === 1 ? t('diaUm') : t('diaVarios', { n }));
  const periodo = () => ({ ini: `${UI.busca.iniData}T${UI.busca.iniHora}`, fim: `${UI.busca.fimData}T${UI.busca.fimHora}` });
  const localDev = () => (UI.busca.mesmo ? UI.busca.local : UI.busca.localDev);
  const linhaTexto = (l) => {
    const v = { ...l.vars };
    if (v.valor !== undefined) { v.v = moeda(v.valor); v.n = dias(v.n); }
    return t(l.chave, v);
  };
  // foto que o dono pôs em algum carro do modelo; sem foto, o desenho
  const carroDe = (id) => {
    const m = modelo(id), comFoto = E.unidades.find((u) => u.modelo === id && u.foto);
    return comFoto ? `<img class="carro foto-real" src="${esc(comFoto.foto)}" alt="${esc(m.nome)}">` : C.lateral(m.tipo, m.cor, esc(m.nome));
  };
  const placaHTML = (p) => `<span class="matricula">${esc(p)}</span>`;
  const horas = () => { const o = []; for (let h = 0; h <= 23; h++) { for (const m of ['00', '30']) o.push(`${String(h).padStart(2, '0')}:${m}`); } return o; };
  const opcoes = (lista, atual) => lista.map(([v, r]) => `<option value="${esc(v)}"${v === atual ? ' selected' : ''}>${esc(r)}</option>`).join('');
  // carro cadastrado pelo dono não tem lugares/portas/malas/câmbio: mostra só o que se sabe
  const specs = (m) => [m.lugares ? t('lugares', { n: m.lugares }) : '', m.portas ? t('portas', { n: m.portas }) : '', m.malas ? t('malas', { n: m.malas }) : '',
    m.cambio ? t('cambio_' + m.cambio) : '', m.ar ? t('arCond') : '']
    .filter(Boolean).map((s) => `<span class="spec">${esc(s)}</span>`).join('');
  const ICONES = {
    balcao: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/>',
    km: '<path d="M4 12c0-2 1.6-3.5 3.6-3.5C11 8.5 13 15.5 16.4 15.5c2 0 3.6-1.5 3.6-3.5s-1.6-3.5-3.6-3.5C13 8.5 11 15.5 7.6 15.5 5.6 15.5 4 14 4 12z"/>',
    '27h': '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    pontos: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  };
  const icone = (k) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${ICONES[k]}</svg>`;

  function orcar(modeloId, planoId, extras) {
    const { ini, fim } = periodo();
    return L.preco({
      tarifaDia: E.tarifas[modeloId], dias: L.diarias(ini, fim),
      plano: plano(planoId),
      extras: D.EXTRAS.filter((e) => extras.includes(e.id)),
    });
  }

  function avisar(texto) {
    const el = document.getElementById('aviso');
    el.textContent = texto;
    el.hidden = false;
    clearTimeout(avisar.tempo);
    avisar.tempo = setTimeout(() => { el.hidden = true; }, 3800);
  }

  /* ---------- tema dia / noite ----------
     Sem escolha salva, segue o celular. A escolha fica só neste aparelho (se o navegador não deixar guardar, vale até fechar). */
  const CHAVE_TEMA = 'mimizinho-tema';
  function temaSalvo() {
    try { const v = localStorage.getItem(CHAVE_TEMA); return v === 'light' || v === 'dark' ? v : null; } catch { return null; }
  }
  function temaAtual() {
    const v = document.documentElement.dataset.theme;
    if (v === 'light' || v === 'dark') return v;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function aplicarTema(v) {
    if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme;
  }
  aplicarTema(temaSalvo());
  if (window.matchMedia) {
    try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!temaSalvo()) desenhar(); }); } catch { /* navegador antigo: o botão continua funcionando */ }
  }
  const ICONE_SOL = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
  const ICONE_LUA = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>';
  function botaoTema() {
    const noite = temaAtual() === 'dark';
    const rotulo = t(noite ? 'temaDia' : 'temaNoite');
    return `<button class="fino tema" data-acao="tema" aria-label="${esc(rotulo)}" title="${esc(rotulo)}">${noite ? ICONE_SOL : ICONE_LUA}</button>`;
  }

  // logo da locadora (js/marca.js): versão "claro" (TRACK grafite) no modo dia, "escuro" (TRACK branco) no modo noite.
  // Sem o arquivo do logo, cai no nome escrito, pra nunca ficar sem marca.
  function logoMarca(versao) {
    const L = window.LOGO_MARCA;
    if (!L || !L[versao]) return `<span class="marca-nome">${esc(D.CONFIG.marca)}</span>`;
    return `<img class="marca-logo" src="${L[versao]}" alt="${esc(D.CONFIG.marca)}">`;
  }

  /* ---------- barra de cima ---------- */
  function topo() {
    const vistas = [['cliente', 'vistaCliente'], ['locadora', 'vistaLocadora'], ['ambos', 'vistaAmbos']];
    return `<header class="topo gut">
      <span class="marca">${logoMarca(temaAtual() === 'dark' ? 'escuro' : 'claro')}</span>
      ${D.CONFIG.ladoCliente ? `<div class="vistas" role="group">
        ${vistas.map(([id, k]) => `<button class="vista${id === 'ambos' ? ' so-largo' : ''}" data-acao="modo" data-x="${id}" aria-pressed="${UI.modo === id}">${t(k)}</button>`).join('')}
      </div>` : ''}
      <div class="topo-dir">
        ${botaoTema()}
        ${D.CONFIG.copias ? `<button class="fino copia" data-acao="salvarCopia"${UI.salvandoCopia ? ' disabled' : ''}>${t(UI.salvandoCopia ? 'salvandoCopia' : 'salvarCopia')}</button>
        <button class="fino copia" data-acao="anexarCopia"${UI.modal && UI.modal.tipo === 'copia' ? ' disabled' : ''}>${t('anexarCopia')}</button>
        <input type="file" id="arquivo-copia" accept=".json,application/json" data-campo="arquivoCopia" hidden>` : ''}
        <button class="fino conta" data-acao="abrirConta" aria-label="${esc(t('contaDe', { e: NUVEM.email }))}">${t('conta')}</button>
      </div>
    </header>
    ${NUVEM.modo === 'bancoVazio' ? `<p class="faixa faixa-alerta gut" role="status">${t(D.CONFIG.copias ? 'faixaBancoVazio' : 'faixaBancoVazioSemCopia')}</p>` : ''}`;
  }

  /* ---------- CLIENTE ---------- */
  function placaBusca() {
    const b = UI.busca, { ini, fim } = periodo(), n = L.diarias(ini, fim);
    const hs = horas().map((h) => [h, h]);
    const loja = local(b.local);
    // local único e fixo: só informação, sem escolha
    return `<form class="placa" data-form="busca" novalidate>
      <div class="placa-aba">${n ? esc(dias(n)) : '–'}</div>
      <div class="placa-miolo">
        <div class="destino">
          <span class="destino-rotulo">${t('lojaRetirada')}</span>
          <div class="destino-linha">
            <svg class="seta" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg>
            <strong class="destino-fixo">${esc(loja.nome)}</strong>
          </div>
          <p class="destino-nota">${esc(loja.nota)}</p>

          <div class="campo"><label for="b-ihora">${t('horaRetirada')}</label><select id="b-ihora" data-campo="busca.iniHora">${opcoes(hs, b.iniHora)}</select></div>
          <div class="campo"><label for="b-fdata">${t('dataDevolucao')}</label><input id="b-fdata" type="date" min="${esc(b.iniData)}" value="${esc(b.fimData)}" data-campo="busca.fimData"></div>
          <div class="campo"><label for="b-fhora">${t('horaDevolucao')}</label><select id="b-fhora" data-campo="busca.fimHora">${opcoes(hs, b.fimHora)}</select></div>
        </div>
        ${UI.erroBusca ? `<p class="erro-placa" role="alert">${esc(t(UI.erroBusca.chave, UI.erroBusca.vars))}</p>` : ''}
        <button class="botao ambar" type="submit">${t('buscarCarros')}</button>
      </div>
    </form>`;
  }

  function faixaEditando() {
    const r = UI.editandoId && reserva(UI.editandoId);
    if (!r) return '';
    return `<div class="editando" role="status"><p>${esc(t('editando', { c: r.codigo }))}</p><button class="fino" data-acao="desistirAlterar">${t('desistirAlterar')}</button></div>`;
  }

  function telaBusca() {
    const proxima = E.reservas.filter((r) => r.minha && L.reservaOcupa(r)).sort((a, b) => L.ms(a.ini) - L.ms(b.ini))[0];

      ${placaBusca()}
      <section class="bloco">
        <h2 class="rotulo">${t('porTipo')}</h2>
        <div class="tipos" id="rolo-tipos">
          ${D.CATEGORIAS.map((c) => { const m = E.modelos.find((x) => x.cat === c && temFrota(x.id)); return m ? `<button class="tipo" data-acao="buscarCat" data-x="${c}">${carroDe(m.id)}<span>${t('cat_' + c)}</span></button>` : ''; }).join('')}
        </div>
      </section>
      ${proxima && !UI.editandoId ? `<section class="bloco"><h2 class="rotulo">${t('proximaReserva')}</h2>${cartaoViagem(proxima)}</section>` : ''}
      <section class="bloco">
        <h2 class="rotulo">${t('vantagens')}</h2>

      </section>
      <section class="bloco">
        <h2 class="rotulo">${t('nossasLojas')}</h2>
        <ul class="lojas">${D.LOCAIS.map((l) => `<li><strong>${esc(l.nome)}</strong><small>${esc(l.endereco)}</small><small>${esc(l.nota)}</small></li>`).join('')}</ul>
      </section>
    </div>`;
  }

  function miniPlaca() {
    const { ini, fim } = periodo(), n = L.diarias(ini, fim);
    return `<button class="placa mini" data-acao="irBusca" aria-label="${t('trocarBusca')}">
      <div class="placa-aba">${esc(dias(n))}</div>
      <div class="placa-miolo">
        <strong>${esc(local(UI.busca.local).nome)}${UI.busca.mesmo ? '' : ' → ' + esc(local(localDev()).nome)}</strong>
        <span>${esc(dataHora(ini))} → ${esc(dataHora(fim))}</span>
      </div>
    </button>`;
  }

  function listaCarros() {
    const { ini, fim } = periodo();
    const lista = E.modelos
      .filter((m) => (UI.categoria === 'todos' || m.cat === UI.categoria) && (UI.cambio === 'todos' || m.cambio === UI.cambio))
      .map((m) => ({ m, livres: L.unidadesLivres(E, m.id, UI.busca.local, ini, fim, hojeTxt(), UI.editandoId).length, temFrota: E.unidades.some((u) => u.modelo === m.id && u.local === UI.busca.local) }))
      .filter((x) => x.temFrota);
    lista.sort((a, b) => {
      if (!a.livres !== !b.livres) return a.livres ? -1 : 1;
      const dif = E.tarifas[a.m.id] - E.tarifas[b.m.id];
      return UI.ordem === 'maior' ? -dif : dif;
    });
    if (!lista.length) return `<p class="vazio">${t('nenhumCarro')}</p>`;
    return lista.map(({ m, livres }) => {
      const conta = orcar(m.id, 'basica', []);
      const off = livres === 0;
      return `<button class="cartao-carro" data-acao="verCarro" data-x="${m.id}"${off ? ' disabled' : ''}>
        <span class="cc-topo"><span class="cc-grupo">${t('cat_' + m.cat)}</span>${off ? `<span class="selo pare">${t('esgotado')}</span>` : livres === 1 ? `<span class="selo atencao">${t('ultimoUm')}</span>` : ''}</span>
        <span class="cc-foto">${carroDe(m.id)}</span>
        <span class="cc-nome"><strong>${esc(m.nome)}</strong> <small>${t('ouSimilar')}</small></span>
        <span class="specs-ic">${specs(m)}</span>
        <span class="cc-pe">
          <span class="kmlivre">${t('kmLivre')}</span>
          <span class="cc-preco"><b>${esc(moeda(E.tarifas[m.id]))}</b><span>${t('porDia')}</span><small>${esc(t('totalCurto', { v: moeda(conta.total) }))}</small></span>
        </span>
      </button>`;
    }).join('');
  }

  function telaResultados() {
    const chips = ['todos', ...D.CATEGORIAS];
    return `<div class="tela">
      ${faixaEditando()}
      ${miniPlaca()}
      <div class="filtros" id="rolo-chips" role="group">
        ${chips.map((c) => `<button class="chip" data-acao="categoria" data-x="${c}" aria-pressed="${UI.categoria === c}">${t('cat_' + c)}</button>`).join('')}
      </div>
      <div class="ordem">
        <label for="cambio">${t('cambio')}</label><select id="cambio" data-campo="cambio">${opcoes([['todos', t('cambioTodos')], ['manual', t('cambio_manual')], ['automatico', t('cambio_automatico')]], UI.cambio)}</select>
        <label for="ordem">${t('ordenar')}</label><select id="ordem" data-campo="ordem">${opcoes([['menor', t('ordPrecoMenor')], ['maior', t('ordPrecoMaior')]], UI.ordem)}</select>
      </div>
      <div class="lista">${listaCarros()}</div>
    </div>`;
  }

  function telaCarro() {
    const m = modelo(UI.modeloId), conta = orcar(m.id, 'basica', []);
    const basica = plano('basica'), loja = local(UI.busca.local), { ini, fim } = periodo();
    return `<div class="tela com-barra">
      <button class="voltar" data-acao="irResultados">← ${t('voltar')}</button>
      <div class="vitrine grande">${carroDe(m.id)}</div>
      <div><span class="cc-grupo">${t('cat_' + m.cat)}</span>
      <h1 class="titulo" tabindex="-1">${esc(m.nome)} <small>${t('ouSimilar')}</small></h1></div>
      <div class="specs-ic">${specs(m)}</div>
      <section class="bloco">
        <h2 class="rotulo">${t('oQueInclui')}</h2>
        <ul class="inclui">
          <li>${t('inclui_km')}</li>
          <li>${esc(t('inclui_protecao', { v: moeda(basica.copart) }))}</li>
          <li>${t('inclui_27h')}</li>
          <li>${t('inclui_cancelar')}</li>
          <li>${t('inclui_digital')}</li>
        </ul>
      </section>
      <section class="bloco">
        <h2 class="rotulo">${t('protecoesDisp')}</h2>
        <div class="mini-planos">${D.PLANOS.map((p) => `<div class="mini-plano"><strong>${t('plano_' + p.id)}</strong><small>${p.copart ? esc(t('planoCopart', { v: moeda(p.copart) })) : t('planoSemCopart')}</small><b>${p.dia ? esc(t('maisPorDia', { v: moeda(p.dia) })) : t('incluido')}</b></div>`).join('')}</div>
      </section>
      <section class="bloco">
        <h2 class="rotulo">${t('ondeRetira')}</h2>
        <div class="revisao"><p><strong>${esc(loja.nome)}</strong></p><p>${esc(loja.endereco)} · ${esc(loja.nota)}</p>
          <p>${t('retirada')}: ${esc(dataHora(ini))}</p><p>${t('devolucao')}: ${esc(local(localDev()).nome)}, ${esc(dataHora(fim))}</p></div>
      </section>
      <section class="bloco">
        <h2 class="rotulo">${t('paraRetirar')}</h2>
        <ul class="inclui neutro">
          <li>${t('req_idade', { n: L.REGRAS.idadeMin })}</li>
          <li>${t('req_cnh', { n: L.REGRAS.cnhMinAnos })}</li>
          <li>${t('req_cartao')}</li>
        </ul>
      </section>
      <section class="bloco"><h2 class="rotulo">${t('resumo')}</h2>${conta2HTML(conta)}</section>
    </div>
    <div class="barra"><div><small>${t('total')}</small><b>${esc(moeda(conta.total))}</b></div><button class="botao verde" data-acao="iniciarReserva">${t('reservarCarro')}</button></div>`;
  }

  function conta2HTML(conta) {
    return `<dl class="conta">${conta.linhas.map((l) => `<div><dt>${esc(linhaTexto(l))}</dt><dd>${esc(moeda(l.valor))}</dd></div>`).join('')}
      <div class="conta-total"><dt>${t('total')}</dt><dd>${esc(moeda(conta.total))}</dd></div></dl>`;
  }

  function etapaProtecao() {
    const r = UI.rascunho;
    return `<fieldset class="grupo"><legend class="rotulo">${t('etapa1')}</legend>
      ${D.PLANOS.map((p) => `<label class="opcao plano"><input id="plano-${p.id}" type="radio" name="plano" data-campo="plano" value="${p.id}"${r.plano === p.id ? ' checked' : ''}>
        <span class="op-txt"><strong>${t('plano_' + p.id)}</strong>
          <small>${p.copart ? esc(t('planoCopart', { v: moeda(p.copart) })) : t('planoSemCopart')} · ${esc(t('planoCaucao', { v: moeda(p.caucao) }))}</small>
          <span class="cobre"><em>${t('cobre')}</em>${p.cobre.map((c) => `<span class="sim">${esc(c)}</span>`).join('')}</span>
          ${p.naoCobre.length ? `<span class="cobre"><em>${t('naoCobre')}</em>${p.naoCobre.map((c) => `<span class="nao">${esc(c)}</span>`).join('')}</span>` : ''}
        </span>
        <span class="op-preco">${p.dia ? esc(t('maisPorDia', { v: moeda(p.dia) })) : t('incluido')}</span></label>`).join('')}
    </fieldset>`;
  }

  function etapaAdicionais() {
    const r = UI.rascunho, premium = plano(r.plano).incluiVidros;
    return `<fieldset class="grupo"><legend class="rotulo">${t('etapa2')}</legend>
      ${D.EXTRAS.map((e) => {
        const travado = e.id === 'vidros' && premium;
        return `<label class="opcao${travado ? ' travada' : ''}"><input id="extra-${e.id}" type="checkbox" data-campo="extra" value="${e.id}"${r.extras.includes(e.id) || travado ? ' checked' : ''}${travado ? ' disabled' : ''}>
        <span class="op-txt"><strong>${t('extra_' + e.id)}</strong><small>${travado ? t('vidrosNaPremium') : t('extraTxt_' + e.id)}</small></span>
        <span class="op-preco">${travado ? t('incluido') : esc(t('maisPorDia', { v: moeda(e.dia) }))}</span></label>`;
      }).join('')}
    </fieldset>`;
  }

  function campoMotorista(id, tipo, rotulo, extra) {
    const r = UI.rascunho, erro = r.erros[id];
    return `<div class="campo-claro"><label for="m-${id}">${t(rotulo)}</label>
      <input id="m-${id}" type="${tipo}" value="${esc(r.motorista[id])}" data-campo="motorista.${id}" ${extra || ''} aria-invalid="${!!erro}"${erro ? ` aria-describedby="m-${id}-erro"` : ''}>
      ${erro ? `<p id="m-${id}-erro" class="erro" role="alert">${t(erro)}</p>` : ''}</div>`;
  }

  function etapaMotorista() {
    return `<div class="grupo"><h2 class="rotulo">${t('etapa3')}</h2>
      <p class="nota">${t('avisoDados')}</p>
      ${campoMotorista('nome', 'text', 'nomeCompleto', 'autocomplete="off" maxlength="80"')}
      ${campoMotorista('email', 'email', 'email', 'autocomplete="off" maxlength="120"')}
      ${campoMotorista('fone', 'tel', 'telefone', 'autocomplete="off" maxlength="20"')}
      ${campoMotorista('cpf', 'text', 'cpf', 'autocomplete="off" inputmode="numeric" maxlength="14"')}
      ${campoMotorista('idade', 'number', 'idadeMotorista', 'inputmode="numeric" min="21" max="99"')}
      <p class="nota">${t('avisoIdade', { n: L.REGRAS.idadeMin, c: L.REGRAS.cnhMinAnos })}</p>
    </div>`;
  }

  function etapaPagamento(conta) {
    const r = UI.rascunho, m = modelo(UI.modeloId), { ini, fim } = periodo();
    const ext = r.extras.filter((x) => !(x === 'vidros' && plano(r.plano).incluiVidros));
    return `<div class="grupo"><h2 class="rotulo">${t('resumo')}</h2>
      <div class="revisao">
        <p><strong>${esc(m.nome)}</strong> ${t('ouSimilar')} · ${t('cat_' + m.cat)}</p>
        <p>${t('retirada')}: ${esc(local(UI.busca.local).nome)}, ${esc(dataHora(ini))}</p>
        <p>${t('devolucao')}: ${esc(local(localDev()).nome)}, ${esc(dataHora(fim))}</p>
        <p>${t('protecaoRes')}: ${t('plano_' + r.plano)}</p>
        <p>${t('adicionaisRes')}: ${ext.length ? ext.map((x) => t('extra_' + x)).join(', ') : t('nenhum')}</p>
        <p>${t('condutorRes')}: ${esc(r.motorista.nome)}</p>
      </div>
      ${conta2HTML(conta)}
      <p class="pontos-ganha">${icone('pontos')} ${esc(t('pontosGanha', { n: L.diarias(ini, fim) * L.REGRAS.pontosPorDiaria }))}</p>
    </div>
    <fieldset class="grupo"><legend class="rotulo">${t('pagamento')}</legend>
      ${['cartao', 'pix'].map((p) => `<label class="opcao"><input id="pag-${p}" type="radio" name="pag" data-campo="pagamento" value="${p}"${r.pagamento === p ? ' checked' : ''}><span class="op-txt"><strong>${t('pag_' + p)}</strong></span><span></span></label>`).join('')}
      <p class="nota">${t('pagNota')}</p>
      ${r.erroReserva ? `<p class="erro" role="alert">${t(r.erroReserva)}</p>` : ''}
    </fieldset>`;
  }

  function telaReserva() {
    const r = UI.rascunho, conta = orcar(UI.modeloId, r.plano, r.extras);
    const corpo = [null, etapaProtecao, etapaAdicionais, etapaMotorista, etapaPagamento][r.etapa](conta);
    const ultimo = r.etapa === 4;
    return `<div class="tela com-barra">
      <button class="voltar" data-acao="etapaVoltar">← ${t('voltar')}</button>
      <div class="passos" aria-label="${t('etapaDe', { n: r.etapa })}">
        ${[1, 2, 3, 4].map((n) => `<span class="passo${n === r.etapa ? ' atual' : n < r.etapa ? ' feito' : ''}"><i>${n}</i><span>${t('etapa' + n)}</span></span>`).join('')}
      </div>
      ${corpo}
    </div>
    <div class="barra"><div><small>${t('total')}</small><b>${esc(moeda(conta.total))}</b></div>
      <button class="botao ${ultimo ? 'ambar' : 'verde'}" data-acao="etapaAvancar">${t(ultimo ? (UI.editandoId ? 'salvarAlteracao' : 'confirmarReserva') : 'continuar')}</button></div>`;
  }

  function telaConfirmada() {
    const r = reserva(UI.confirmadaId);
    return `<div class="tela confirmada">
      <div class="chaveiro">
        <span class="argola"></span>
        <div class="etiqueta">
          <small>${esc(D.CONFIG.marca)}</small>
          <strong class="codigo">${esc(r.codigo)}</strong>
          ${placaHTML(unidade(r.unidade).placa)}
        </div>
      </div>
      <h1 class="titulo centro" tabindex="-1">${t(UI.foiAlteracao ? 'reservaAlterada' : 'reservaConfirmada')}</h1>
      <p class="centro specs">${esc(modelo(r.modelo).nome)} ${t('ouSimilar')} · ${esc(dataHora(r.ini))}</p>
      ${L.checkinFeito(r) ? '' : `<p class="centro proximo">${esc(t('proximoPasso', { l: local(r.local).nome }))}</p>`}
      <div class="acoes-col">
        ${L.checkinFeito(r) ? '' : `<button class="botao ambar" data-acao="abrirCheckin" data-x="${r.id}">${t('fazerCheckin')}</button>`}
        <button class="botao verde" data-acao="verViagem" data-x="${r.id}">${t('verReserva')}</button>
        <button class="botao linha" data-acao="irBusca">${t('novaReservaBotao')}</button>
      </div>
    </div>`;
  }

  function cartaoViagem(r) {
    const pend = r.status === 'reservada' && !L.checkinFeito(r);
    return `<button class="cartao-viagem" data-acao="verViagem" data-x="${r.id}">
      <span class="cv-carro">${carroDe(r.modelo)}</span>
      <span class="cv-txt">
        <span class="selo st-${r.status}">${t('st_' + r.status)}</span>
        <strong>${esc(modelo(r.modelo).nome)}</strong>
        <small>${esc(r.codigo)} · ${esc(local(r.local).nome)}</small>
        <small>${esc(dataCurta(r.ini))} → ${esc(dataCurta(r.fim))}</small>
        ${pend ? `<small class="alerta-ck">${t('checkinPendente')}</small>` : ''}
      </span>
    </button>`;
  }

  function cartaoFidelidade() {
    const f = L.fidelidade(E.reservas);
    const niv = L.REGRAS.niveis, i = niv.findIndex(([id]) => id === f.nivel);
    const pct = f.proximo ? Math.round(((f.saldo - niv[i][1]) / (niv[i + 1][1] - niv[i][1])) * 100) : 100;
    return `<section class="fid nivel-${f.nivel}">
      <div class="fid-topo"><span>${t('fidTitulo')}</span><span class="selo">${t('fidNivel', { n: t('nivel_' + f.nivel) })}</span></div>
      <b class="fid-saldo">${t('fidSaldo', { n: f.saldo.toLocaleString(LOCALE) })}</b>
      <div class="fid-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
      <small>${f.proximo ? t('fidFaltam', { n: f.faltam, p: t('nivel_' + f.proximo) }) : t('fidTopo')}</small>
      ${f.pendentes ? `<small>${t('fidPendentes', { n: f.pendentes })}</small>` : ''}
      <small>${t('fidRegra', { n: L.REGRAS.pontosPorDiaria })}</small>
    </section>`;
  }

  function telaReservas() {
    const minhas = E.reservas.filter((r) => r.minha).sort((a, b) => L.ms(b.ini) - L.ms(a.ini));
    const prox = minhas.filter((r) => L.reservaOcupa(r)).reverse(), ant = minhas.filter((r) => !L.reservaOcupa(r));
    return `<div class="tela">
      ${cartaoFidelidade()}
      ${!minhas.length ? `<p class="vazio">${t('semReservas')}</p>` : ''}
      ${prox.length ? `<section class="bloco"><h2 class="rotulo">${t('proximas')}</h2><div class="lista">${prox.map(cartaoViagem).join('')}</div></section>` : ''}
      ${ant.length ? `<section class="bloco"><h2 class="rotulo">${t('anteriores')}</h2><div class="lista">${ant.map(cartaoViagem).join('')}</div></section>` : ''}
    </div>`;
  }

  function telaReservaDet() {
    const r = reserva(UI.viagemId);
    return `<div class="tela">
      <button class="voltar" data-acao="irReservas">← ${t('voltar')}</button>
      ${detalheReserva(r, false)}
    </div>`;
  }

  // mesmo miolo na tela de reserva do cliente e na janela da locadora
  function detalheReserva(r, noPainel) {
    const u = unidade(r.unidade), m = modelo(r.modelo);
    const ck = L.checkinFeito(r);
    const passos = [['st_reservada', true], ['tl_checkin', ck || r.status === 'retirada' || r.status === 'devolvida'], ['st_retirada', r.status === 'retirada' || r.status === 'devolvida'], ['st_devolvida', r.status === 'devolvida']];
    const ext = r.extras.filter((x) => !(x === 'vidros' && plano(r.plano).incluiVidros));
    return `<div class="det">
      <div class="det-topo">
        <div><span class="selo st-${r.status}">${t('st_' + r.status)}</span><h2 class="det-codigo">${esc(r.codigo)}</h2></div>
        ${placaHTML(u.placa)}
      </div>
      <div class="vitrine pequena">${carroDe(r.modelo)}</div>
      <p><strong>${esc(m.nome)}</strong> ${t('ouSimilar')} · ${t('cat_' + m.cat)}</p>
      ${r.status !== 'cancelada' ? `<ol class="linha-tempo">${passos.map(([k, feito]) => `<li class="${feito ? 'feito' : ''}">${t(k)}</li>`).join('')}</ol>` : ''}
      ${noPainel ? `<p>${t('colCliente')}: <strong>${esc(r.motorista.nome)}</strong></p>` : ''}
      <p>${t('retirada')}: ${esc(local(r.local).nome)}, ${esc(dataHora(r.ini))}</p>
      <p>${t('devolucao')}: ${esc(local(r.localDev).nome)}, ${esc(dataHora(r.fim))}</p>
      <p>${t('protecaoRes')}: ${t('plano_' + r.plano)} · ${t('adicionaisRes')}: ${ext.length ? ext.map((x) => t('extra_' + x)).join(', ') : t('nenhum')}</p>
      ${r.status === 'reservada' ? blocoCheckin(r) : ''}
      ${resumoVistorias(r)}
      ${conta2HTML(r)}
      ${r.multa ? `<p class="nota">${esc(t('multaCobrada', { v: moeda(r.multa) }))}</p>` : ''}
      ${acoesReserva(r, noPainel)}
    </div>`;
  }

  function blocoCheckin(r) {
    if (!L.checkinFeito(r)) return `<div class="ck-caixa pendente"><strong>${t('checkinPendente')}</strong><small>${esc(t('proximoPasso', { l: local(r.local).nome }))}</small></div>`;
    return `<div class="ck-caixa ok">
      ${C.qr(r.codigo)}
      <div><strong>${t('checkinOk')}</strong><small>${esc(t('ck_prontoTxt', { l: local(r.local).nome }))}</small>
      <small>${t('ck_qrSimulado')} · ${esc(t('ck_assinadoEm', { d: dataHora(r.checkin.em) }))}</small></div>
    </div>`;
  }

  function resumoVistorias(r) {
    const v = r.vistoria || {};
    if (!v.ret && !v.dev) return '';
    const novos = v.dev ? v.dev.pins.length : 0;
    return `<section class="bloco"><h3 class="rotulo">${t('vistorias')}</h3>
      <div class="vist-duas">
        ${v.ret ? vistoriaMini(v.ret, [], t('retirada')) : ''}
        ${v.dev ? vistoriaMini(v.dev, v.ret ? v.ret.pins : [], t('devolucao')) : ''}
      </div>
      ${v.dev ? `<p class="selo ${novos ? 'pare' : 'ok'}">${esc(novos === 1 ? t('danoNovoUm') : novos ? t('danosNovos', { n: novos }) : t('semDanoNovo'))}</p>` : ''}
    </section>`;
  }

  function pinsSVG(pins, classe) {
    return pins.map((p, i) => `<g class="pin ${classe}" transform="translate(${Number(p.x)} ${Number(p.y)})"><circle r="${classe === 'velho' ? 6 : 10}"/><text text-anchor="middle" dy="4">${classe === 'velho' ? '' : i + 1}</text></g>`).join('');
  }

  const NIVEIS_COMB = { 8: 'cheio', 6: 'tresQuartos', 4: 'meio', 2: 'umQuarto', 0: 'vazio' };

  function vistoriaMini(v, antigos, rotulo) {
    return `<div class="vist-mini">
      <svg viewBox="0 0 200 420" aria-hidden="true">${C.deCima('var(--carro-claro)')}${pinsSVG(antigos, 'velho')}${pinsSVG(v.pins, 'novo')}</svg>
      <div><strong>${esc(rotulo)}</strong>
      <small>${t('combustivel')}: ${t(NIVEIS_COMB[v.comb] || 'cheio')}</small>
      <small>${esc(Number(v.km).toLocaleString(LOCALE))} km · ${esc(t('fotosFeitas', { n: v.fotos.length }))}</small>
      ${v.pins.length ? `<ul class="danos">${v.pins.map((p, i) => `<li>${i + 1}. ${t('zona_' + p.zona)}: ${t('av_' + p.tipo)}</li>`).join('')}</ul>` : `<small>${t('semAvarias')}</small>`}</div>
    </div>`;
  }

  function acoesReserva(r, noPainel) {
    if (r.status === 'reservada') {
      const certeza = UI.certezaCancelar === r.id;
      const multa = L.multaCancelamento(r, hojeTxt());
      const ck = L.checkinFeito(r);
      return `<div class="acoes-col">
        ${ck ? `<button class="botao verde" data-acao="abrirVistoria" data-x="${r.id}" data-y="ret">${t('fazerVistoriaRet')}</button>`
          : `<button class="botao ambar" data-acao="abrirCheckin" data-x="${r.id}">${t('fazerCheckin')}</button>`}
        ${r.minha && !noPainel ? `<button class="botao linha" data-acao="alterar" data-x="${r.id}">${t('alterarReserva')}</button>` : ''}
        ${certeza ? `<div class="certeza" role="alert"><p>${esc(multa ? t('cancelarMulta', { v: moeda(multa) }) : t('cancelarGratis'))}</p>
          <div class="certeza-botoes"><button class="botao pare" data-acao="cancelarSim" data-x="${r.id}">${t('simCancelar')}</button><button class="botao linha" data-acao="cancelarNao">${t('naoManter')}</button></div></div>`
          : `<button class="botao linha" data-acao="cancelarPedir" data-x="${r.id}">${t('cancelarReserva')}</button>`}
      </div>`;
    }
    if (r.status === 'retirada') {
      return `<div class="acoes-col"><button class="botao ambar" data-acao="abrirVistoria" data-x="${r.id}" data-y="dev">${t('fazerVistoriaDev')}</button></div>`;
    }
    return '';
  }

  function cliente() {
    const telas = { busca: telaBusca, resultados: telaResultados, carro: telaCarro, reserva: telaReserva, confirmada: telaConfirmada, reservas: telaReservas, reservaDet: telaReservaDet };
    const semAbas = UI.tela === 'carro' || UI.tela === 'reserva';
    return `<section class="sup-cliente" aria-label="${t('vistaCliente')}">
      <div class="rolo" id="rolo-cliente">${telas[UI.tela]()}</div>
      ${semAbas ? '' : `<nav class="abas">
        <button data-acao="irBusca" aria-pressed="${UI.abaCliente === 'reservar'}">${t('abaReservar')}</button>
        <button data-acao="irReservas" aria-pressed="${UI.abaCliente === 'reservas'}">${t('abaReservas')}</button>
      </nav>`}
    </section>`;
  }

  /* ---------- LOCADORA ---------- */
  const naLoja = (id) => UI.lojaPainel === 'todas' || id === UI.lojaPainel;

  function filtroLojas() {
    if (D.LOCAIS.length < 2) return ''; // loja única: filtro não serve pra nada
    const op = [['todas', t('todasLojas')], ...D.LOCAIS.map((l) => [l.id, l.nome])];
    return `<div class="filtros" id="rolo-lojas" role="group">${op.map(([id, nome]) => `<button class="chip" data-acao="lojaPainel" data-x="${id}" aria-pressed="${UI.lojaPainel === id}">${esc(nome)}</button>`).join('')}</div>`;
  }

  function kpis() {
    const k = L.indicadores(E, hojeTxt());
    if (!D.CONFIG.reservas) {
      // sem reserva pelo app: "alugado" vem do cliente semanal com carro (e da situação do carro)
      const alugados = E.unidades.filter((u) => L.estadoCarro(E, u, hojeData()) === 'alugado').length, guardado = L.caucoesGuardadas(E.clientes);
      return `<div class="kpis">
      <div class="kpi"><small>${t('kpiNaRua')}</small><b>${alugados} <i>${t('kpiDeFrota', { n: k.frota })}</i></b></div>
      <div class="kpi"><small>${t('kpiParados')}</small><b>${k.vistoria} / ${k.manutencao}</b></div>
      ${guardado ? `<div class="kpi"><small>${t('kpiCaucoes')}</small><b>${esc(moeda(guardado))}</b></div>` : ''}
    </div>`;
    }
    return `<div class="kpis">
      <div class="kpi"><small>${t('kpiRetiradas')}</small><b>${k.retiradasHoje}</b></div>
      <div class="kpi"><small>${t('kpiDevolucoes')}</small><b>${k.devolucoesHoje}</b></div>
      <div class="kpi"><small>${t('kpiNaRua')}</small><b>${k.naRua} <i>${t('kpiDeFrota', { n: k.frota })}</i></b></div>
      <div class="kpi"><small>${t('kpiParados')}</small><b>${k.vistoria} / ${k.manutencao}</b></div>
      <div class="kpi"><small>${t('kpiReceita')}</small><b>${esc(moeda(k.receitaMes))}</b></div>
    </div>`;
  }

  function painelHoje() {
    if (!D.CONFIG.reservas) return blocoLembretes(); // sem reserva: a aba Hoje é só lembretes
    const hoje = hojeTxt().slice(0, 10), agora = hojeTxt();
    const ret = E.reservas.filter((r) => r.status === 'reservada' && r.ini.slice(0, 10) === hoje && naLoja(r.local)).sort((a, b) => L.ms(a.ini) - L.ms(b.ini));
    const dev = E.reservas.filter((r) => r.status === 'retirada' && r.fim.slice(0, 10) <= hoje && naLoja(r.localDev)).sort((a, b) => L.ms(a.fim) - L.ms(b.fim));
    const linha = (r, quando, extra) => `<tr class="${UI.destaque === r.id ? 'pulsa' : ''}">
        <td class="mono">${esc(quando.slice(0, 10) === hoje ? quando.slice(11) : dataCurta(quando) + ' ' + quando.slice(11))}</td>
        <td><button class="link mono" data-acao="abrirReserva" data-x="${r.id}">${esc(r.codigo)}</button></td>
        <td>${esc(r.motorista.nome)}</td>
        <td>${esc(modelo(r.modelo).nome)}<small>${esc(unidade(r.unidade).placa)} · ${esc(local(r.local).nome)}</small></td>
        <td>${extra}</td></tr>`;
    const tabela = (lista, cab, fn) => lista.length ? `<div class="tabela-rolo"><table class="tabela">
        <thead><tr><th>${t('colHora')}</th><th>${t('colCodigo')}</th><th>${t('colCliente')}</th><th>${t('colCarro')}</th><th>${cab}</th></tr></thead>
        <tbody>${lista.map(fn).join('')}</tbody></table></div>` : `<p class="vazio">${t('nadaHoje')}</p>`;
    return `${blocoLembretes()}${filtroLojas()}
      <section class="bloco"><h2 class="rotulo">${t('retiradasHoje')}</h2>
        ${tabela(ret, t('colCheckin'), (r) => linha(r, r.ini, L.checkinFeito(r) ? `<span class="selo ok">${t('ckFeito')}</span>` : `<span class="selo atencao">${t('ckFalta')}</span>`))}</section>
      <section class="bloco"><h2 class="rotulo">${t('devolucoesHoje')}</h2>
        ${tabela(dev, t('colSituacao'), (r) => linha(r, r.fim, L.ms(r.fim) < L.ms(agora) ? `<span class="selo pare">${t('atrasada')}</span>` : `<span class="selo st-retirada">${t('st_retirada')}</span>`))}</section>`;
  }

  function quadro() {
    const hoje = hojeTxt().slice(0, 10), nDias = 14, celula = 52, inicio = L.somarDias(hoje, -1);
    const base = L.ms(`${inicio}T00:00`);
    const fmtDia = new Intl.DateTimeFormat(LOCALE, { day: '2-digit', timeZone: 'UTC' });
    const fmtSem = new Intl.DateTimeFormat(LOCALE, { weekday: 'narrow', timeZone: 'UTC' });
    const cabec = [];
    for (let i = 0; i < nDias; i++) {
      const d = L.somarDias(inicio, i);
      cabec.push(`<div class="q-dia${d === hoje ? ' hoje' : ''}"><small>${esc(fmtSem.format(L.ms(`${d}T00:00`)))}</small>${esc(fmtDia.format(L.ms(`${d}T00:00`)))}</div>`);
    }
    const agoraX = ((L.ms(hojeTxt()) - base) / L.DIA) * celula;
    const ordemLoja = (u) => D.LOCAIS.findIndex((l) => l.id === u.local);
    const carros = E.unidades.filter((u) => naLoja(u.local)).sort((a, b) => ordemLoja(a) - ordemLoja(b));
    const linhas = carros.map((u) => {
      const m = modelo(u.modelo);
      const barras = E.reservas.filter((r) => r.unidade === u.id && r.status !== 'cancelada').map((r) => {
        const a = (L.ms(r.ini) - base) / L.DIA, b = (L.ms(r.fim) - base) / L.DIA;
        if (b <= 0 || a >= nDias) return '';
        const esq = Math.max(a, 0) * celula, larg = (Math.min(b, nDias) - Math.max(a, 0)) * celula;
        return `<button class="q-barra st-${r.status}${UI.destaque === r.id ? ' pulsa' : ''}" style="left:${esq}px;width:${Math.max(larg - 3, 18)}px" data-acao="abrirReserva" data-x="${r.id}" title="${esc(r.codigo)} · ${esc(r.motorista.nome)}">${esc(r.motorista.nome)}</button>`;
      }).join('');
      return `<div class="q-linha">
        <div class="q-rotulo"><strong>${esc(m.nome)}</strong><small>${esc(u.placa)} · ${esc(local(u.local).nome)}</small></div>
        <div class="q-trilha${u.situacao === 'manutencao' ? ' manutencao' : ''}" style="width:${nDias * celula}px">${barras}</div>
      </div>`;
    }).join('');
    return `${filtroLojas()}
      <div class="legenda">
        <span><i class="st-reservada"></i>${t('legReservada')}</span><span><i class="st-retirada"></i>${t('legNaRua')}</span>
        <span><i class="st-devolvida"></i>${t('legDevolvida')}</span><span><i class="manutencao"></i>${t('legManutencao')}</span>
        <em>${t('quadroAjuda')}</em>
      </div>
      <div class="quadro" id="rolo-quadro" tabindex="0" style="--celula:${celula}px">
        <div class="q-interno" style="--agora:${agoraX}px">
          <div class="q-linha q-cabec"><div class="q-rotulo"></div><div class="q-dias">${cabec.join('')}</div></div>
          ${linhas}
        </div>
      </div>`;
  }

  function reservasTabela() {
    const lista = E.reservas
      .filter((r) => UI.filtroReservas === 'todas' || L.reservaOcupa(r))
      .sort((a, b) => L.ms(a.ini) - L.ms(b.ini));
    const filtro = [['ativas', 'filtroAtivas'], ['todas', 'filtroTodas']];
    return `<div class="filtros" id="rolo-filtro" role="group">${filtro.map(([id, k]) => `<button class="chip" data-acao="filtroReservas" data-x="${id}" aria-pressed="${UI.filtroReservas === id}">${t(k)}</button>`).join('')}</div>
      ${lista.length ? `<div class="tabela-rolo" id="rolo-reservas" tabindex="0"><table class="tabela">
        <thead><tr><th>${t('colCodigo')}</th><th>${t('colCliente')}</th><th>${t('colCarro')}</th><th>${t('colLocal')}</th><th>${t('retirada')}</th><th>${t('devolucao')}</th><th class="num">${t('total')}</th><th>${t('colSituacao')}</th></tr></thead>
        <tbody>${lista.map((r) => `<tr class="${UI.destaque === r.id ? 'pulsa' : ''}">
          <td><button class="link mono" data-acao="abrirReserva" data-x="${r.id}">${esc(r.codigo)}</button></td>
          <td>${esc(r.motorista.nome)}</td>
          <td>${esc(modelo(r.modelo).nome)}<small>${esc(unidade(r.unidade).placa)}</small></td>
          <td>${esc(local(r.local).nome)}</td>
          <td>${esc(dataHora(r.ini))}</td><td>${esc(dataHora(r.fim))}</td>
          <td class="num">${esc(moeda(r.total))}</td>
          <td><span class="selo st-${r.status}">${t('st_' + r.status)}</span>${r.vistoria?.dev?.pins.length ? `<small class="alerta-dano">${t('danoNovoCurto')}</small>` : ''}</td>
        </tr>`).join('')}</tbody></table></div>` : `<p class="vazio">${t('nenhumaReserva')}</p>`}`;
  }

  function frotaLista() {
    const carros = E.unidades.filter((u) => naLoja(u.local));
    return `${filtroLojas()}<div class="frota-topo"><button class="botao verde" data-acao="novoCarro">+ ${t('cadastrarCarro')}</button></div>
      <div class="tabela-rolo" id="rolo-frota" tabindex="0"><table class="tabela">
      <thead><tr><th>${t('placaCarro')}</th><th>${t('colCarro')}</th><th>${t('colLocal')}</th><th class="num">${t('colKm')}</th><th>${t('colSituacao')}</th><th></th></tr></thead>
      <tbody>${carros.map((u) => {
        const estado = L.estadoCarro(E, u, hojeData());
        const botao = estado === 'alugado' ? `<button class="fino" disabled>${t('mandarManutencao')}</button>`
          : estado === 'disponivel' ? `<button class="fino" data-acao="manutencao" data-x="${u.id}">${t('mandarManutencao')}</button>`
          : `<button class="fino" data-acao="liberar" data-x="${u.id}">${t('liberar')}</button>`;
        return `<tr>
          <td>${placaHTML(u.placa)}</td><td>${esc(modelo(u.modelo).nome)}<small>${t('cat_' + modelo(u.modelo).cat)} · ${esc(u.ano)}${u.cor ? ` · ${esc(u.cor)}` : ''}</small></td><td>${esc(local(u.local).nome)}</td>
          <td class="num">${esc(Number(u.km).toLocaleString(LOCALE))}</td>
          <td><span class="selo car-${estado}">${t('car_' + estado)}</span></td>
          <td><span class="acoes-linha">${botao}<button class="fino" data-acao="editarCarro" data-x="${u.id}">${t('editarCarro')}</button></span></td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
  }

  function precosLista() {
    return `<p class="nota">${t('precoAjuda')}</p>
      <div class="precos">${E.modelos.filter((m) => temFrota(m.id)).map((m) => {
        const erro = UI.erroTarifa[m.id], c = E.tarifas[m.id];
        return `<div class="preco-linha">
          <div class="pl-carro">${carroDe(m.id)}</div>
          <label for="tarifa-${m.id}"><span class="cc-grupo">${t('cat_' + m.cat)}</span><strong>${esc(m.nome)}</strong><small>${t('colTarifa')}</small></label>
          <div class="pl-entrada"><span>R$</span><input id="tarifa-${m.id}" inputmode="decimal" value="${c % 100 ? (c / 100).toFixed(2).replace('.', ',') : c / 100}" data-campo="tarifa" data-x="${m.id}" aria-invalid="${!!erro}"></div>
          ${erro ? `<p class="erro" role="alert">${t('erroTarifa')}</p>` : ''}
        </div>`;
      }).join('')}</div>`;
  }

  /* ---------- manutenção (dono) ---------- */
  const SELO_TROCA = { passou: 'pare', perto: 'atencao', ok: 'ok', semRegistro: '' };
  const PESO_TROCA = { passou: 0, perto: 1, semRegistro: 2, ok: 3 };

  function trocasDaFrota() {
    const hoje = hojeData();
    return E.unidades.map((u) => {
      const oleo = L.situacaoTroca(u, E.manutencoes, 'oleo', hoje), filtro = L.situacaoFiltros(u, E.manutencoes, hoje);
      return { u, oleo, filtro, pior: Math.min(PESO_TROCA[oleo.estado], PESO_TROCA[filtro.estado]) };
    });
  }

  function blocoTroca(u, tipo, s) {
    const chave = `${u.id}-${tipo}`, erro = UI.erroIntervalo[chave], id = `int-${tipo}-${u.id}`;
    const txt = s.estado === 'semRegistro' ? t('trSemRegistroTxt')
      : t(s.faltam > 0 ? 'trFaltam' : 'trPassou', { p: fmtNum(s.proximaKm), f: fmtNum(Math.abs(s.faltam)) });
    const porData = s.estado === 'semRegistro' ? ''
      : `<small>${esc(t('trUltima', { d: dataBR(s.ultimaData) }))}</small><small>${esc(t(s.diasFaltam > 0 ? 'trData' : 'trDataPassou', { d: dataBR(s.proximaData), n: Math.abs(s.diasFaltam) }))}</small>`;
    return `<div class="troca tr-${s.estado}">
      <div class="troca-topo"><strong>${t('curto_' + tipo)}</strong><span class="selo ${SELO_TROCA[s.estado]}">${t('tr_' + s.estado)}</span></div>
      <small>${esc(txt)}</small>${porData}
      <label for="${id}">${t(tipo === 'oleo' ? 'intervaloOleo' : 'intervaloFiltro')}</label>
      <input id="${id}" inputmode="numeric" value="${esc(s.intervalo)}" data-campo="intervalo" data-x="${u.id}" data-y="${tipo}" aria-invalid="${!!erro}">
      ${erro ? `<p class="erro" role="alert">${t('erroIntervalo')}</p>` : ''}
    </div>`;
  }

  // filtros: uma linha por filtro já trocado (cada um conta do seu último registro) e um intervalo só pro carro
  function blocoFiltros(u, f) {
    if (f.linhas.length === 1 && f.linhas[0].filtro === null) return blocoTroca(u, 'filtro', f.linhas[0].s);
    const chave = `${u.id}-filtro`, erro = UI.erroIntervalo[chave], id = `int-filtro-${u.id}`;
    const linha = ({ filtro, s }) => `<div class="filtro-linha">
        <div class="troca-topo"><span>${esc(t('filtro_' + filtro))}</span><span class="selo ${SELO_TROCA[s.estado]}">${t('tr_' + s.estado)}</span></div>
        <small>${esc(t(s.faltam > 0 ? 'trFaltam' : 'trPassou', { p: fmtNum(s.proximaKm), f: fmtNum(Math.abs(s.faltam)) }))}</small>
        <small>${esc(t('trUltima', { d: dataBR(s.ultimaData) }))}</small></div>`;
    return `<div class="troca tr-${f.estado}">
      <div class="troca-topo"><strong>${t('curto_filtro')}</strong><span class="selo ${SELO_TROCA[f.estado]}">${t('tr_' + f.estado)}</span></div>
      ${f.linhas.map(linha).join('')}
      <label for="${id}">${t('intervaloFiltro')}</label>
      <input id="${id}" inputmode="numeric" value="${esc(f.intervalo)}" data-campo="intervalo" data-x="${u.id}" data-y="filtro" aria-invalid="${!!erro}">
      ${erro ? `<p class="erro" role="alert">${t('erroIntervalo')}</p>` : ''}
    </div>`;
  }

  const nomeManut = (r) => (r.tipo === 'filtro' && r.filtro !== undefined ? t('filtro_' + (r.filtro || '')) : t('troca_' + r.tipo));

  function cartaoManut({ u, oleo, filtro }) {
    const m = modelo(u.modelo);
    const regs = E.manutencoes.filter((r) => r.unidade === u.id).sort((a, b) => b.data.localeCompare(a.data) || b.km - a.km);
    return `<article class="manut-cartao">
      <div class="manut-cab">${placaHTML(u.placa)}<div><strong>${esc(m.nome)}</strong><small>${esc(t('kmAtual', { n: fmtNum(u.km) }))} · ${esc(u.ano)}</small></div>
        <b class="manut-gasto">${esc(t('gastoCarro', { v: moeda(L.gastoManutencao(E.manutencoes, u.id)) }))}</b></div>
      <div class="trocas">${blocoTroca(u, 'oleo', oleo)}${blocoFiltros(u, filtro)}</div>
      ${regs.length ? `<ul class="manut-regs">${regs.map((r) => `<li><span><strong>${esc(nomeManut(r))}</strong> · ${esc(fmtDataAno.format(L.ms(`${r.data}T00:00`)))} · ${esc(fmtNum(r.km))} km · ${esc(moeda(r.valor))}${r.obs ? `<small>${esc(r.obs)}</small>` : ''}</span>
        <button class="fino" data-acao="apagarManut" data-x="${r.id}">${t(UI.certezaManut === r.id ? 'apagarManutCerteza' : 'apagarManut')}</button></li>`).join('')}</ul>`
        : `<p class="nota">${t('semManutRegistro')}</p>`}
      <button class="botao linha" data-acao="novaManut" data-x="${u.id}">${t('registrarManut')}</button>
    </article>`;
  }

  function manutencaoLista() {
    const lista = trocasDaFrota().sort((a, b) => a.pior - b.pior);
    const vencidas = lista.filter((x) => x.pior === 0).length, perto = lista.filter((x) => x.pior === 1).length;
    const total = E.unidades.reduce((s, u) => s + L.gastoManutencao(E.manutencoes, u.id), 0);
    return `<p class="nota">${esc(t('manutAjuda', { n: fmtNum(L.REGRAS.avisoTrocaKm), d: L.REGRAS.avisoTrocaDias }))}</p>
      <div class="manut-resumo">
        ${vencidas ? `<span class="selo pare">${esc(t('manutVencidas', { n: vencidas }))}</span>` : ''}
        ${perto ? `<span class="selo atencao">${esc(t('manutPerto', { n: perto }))}</span>` : ''}
        <span class="selo">${esc(t('manutTotalGeral', { v: moeda(total) }))}</span>
      </div>
      <div class="manut-lista">${lista.map(cartaoManut).join('')}</div>`;
  }

  /* ---------- ficha do carro, custos, margem, simulador e configurações (dono) ---------- */
  const mesAtual = () => hojeTxt().slice(0, 7);
  const fmtMes = new Intl.DateTimeFormat(LOCALE, { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const nomeMes = (mes) => fmtMes.format(L.ms(`${mes}-01T00:00`));
  const pctTxt = (aliq) => (aliq / 100).toLocaleString(LOCALE, { maximumFractionDigits: 2 });
  const margemTxt = (m) => (m === null ? '–' : `${m.toLocaleString(LOCALE, { maximumFractionDigits: 1 })}%`);
  const moedaSinal = (c) => `<span class="${c < 0 ? 'neg' : ''}">${esc(moeda(c || 0))}</span>`; // c || 0: sem "-R$ 0,00"
  const nomeCarro = (u) => `${u.placa} · ${modelo(u.modelo).nome}`;
  const unidadeFicha = () => E.unidades.find((u) => u.id === UI.fichaId) || E.unidades[0];
  const fotoUnidade = (u) => {
    const m = modelo(u.modelo);
    return u.foto ? `<img class="carro foto-real" src="${esc(u.foto)}" alt="${esc(m.nome)}">` : C.lateral(m.tipo, m.cor, esc(m.nome));
  };

  function mesNav() {
    const atual = UI.mes === mesAtual();
    return `<div class="mes-nav" role="group" aria-label="${t('mesEscolhido')}">
        <button class="fino" data-acao="mes" data-x="-1" aria-label="${t('mesAnterior')}">‹</button>
        <strong>${esc(nomeMes(UI.mes))}</strong>
        <button class="fino" data-acao="mes" data-x="1" aria-label="${t('mesSeguinte')}">›</button>
        ${atual ? '' : `<button class="fino" data-acao="mes" data-x="0">${t('voltarMesAtual')}</button>`}
      </div>
      ${atual ? `<p class="nota">${t('mesEmAndamento')}</p>` : ''}`;
  }

  function contaMargem(mg) {
    const linhas = [
      [t(mg.reservas === 1 ? 'mgReceitaUma' : 'mgReceita', { n: mg.reservas, d: mg.diarias }), mg.receita - mg.semanal - (mg.caucaoRetida || 0)],
      ...(mg.semanal ? [[t('mgSemanal'), mg.semanal]] : []),
      ...(mg.caucaoRetida ? [[t('mgCaucao'), mg.caucaoRetida]] : []),
      [t('mgManutencao'), -mg.manutencao],
      [t('mgCustos'), -mg.custos],
      ...(mg.ipvaEstimado ? [[t('mgIpvaEstimado'), -mg.ipvaEstimado]] : []),
      [t('mgFixo'), -mg.fixo],
    ];

      <div><dt>${t('mgMargem')}</dt><dd>${esc(margemTxt(mg.margem))}</dd></div></dl>`;
  }

  function listaCustos(u) {
    const lista = E.custos.filter((c) => c.unidade === u.id).sort((a, b) => b.data.localeCompare(a.data) || b.id.localeCompare(a.id));
