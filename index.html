    return `<ul class="manut-regs">${lista.map((c) => `<li><span><strong>${t('tc_' + c.tipo)}</strong> · ${esc(fmtDataAno.format(L.ms(`${c.data}T00:00`)))} · ${esc(moeda(c.valor))}
        ${L.CUSTOS_ANUAIS.includes(c.tipo) ? `<small>${esc(t('custoAnualTxt', { v: moeda(Math.round(c.valor / 12)) }))}</small>` : ''}${c.obs ? `<small>${esc(c.obs)}</small>` : ''}</span>
      <button class="fino" data-acao="apagarCusto" data-x="${c.id}">${t(UI.certezaCusto === c.id ? 'apagarManutCerteza' : 'apagarManut')}</button></li>`).join('')}</ul>`;
  }

  function fichaCarro() {
    const u = unidadeFicha();
    if (!u) return `<p class="vazio">${t('semCarros')}</p>`;
    const n = E.unidades.length, i = E.unidades.indexOf(u), m = modelo(u.modelo), estado = L.estadoCarro(E, u, hojeData());
    const cliente = L.clienteDoCarro(E, u.id, hojeData());
    const ant = E.unidades[(i - 1 + n) % n], prox = E.unidades[(i + 1) % n];
    const mg = L.margemCarro(E, u, UI.mes);
    const res = E.reservas.filter((r) => r.unidade === u.id && r.ini.slice(0, 7) === UI.mes).sort((a, b) => L.ms(b.ini) - L.ms(a.ini));
    const troca = trocasDaFrota().find((x) => x.u === u);
    const cfg = E.config;
    return `<div class="ficha-nav">
        <button class="fino" id="ficha-ant" data-acao="verFicha" data-x="${ant.id}" aria-label="${t('carroAnterior')}">‹</button>
        <select id="ficha-carro" data-campo="ficha" aria-label="${t('escolherCarro')}">${opcoes(E.unidades.map((x) => [x.id, nomeCarro(x)]), u.id)}</select>
        <button class="fino" id="ficha-prox" data-acao="verFicha" data-x="${prox.id}" aria-label="${t('carroSeguinte')}">›</button>
        <span class="nota">${i + 1} / ${n}</span>
      </div>
      <article class="ficha">
        <div class="ficha-cab">
          <div class="ficha-foto">${fotoUnidade(u)}</div>
          <div class="ficha-dados">${placaHTML(u.placa)}<strong>${esc(m.nome)}</strong>
            <small>${t('cat_' + m.cat)} · ${esc(u.ano)} · ${esc(t('kmAtual', { n: fmtNum(u.km) }))}</small>
            <small>${u.fipe ? esc(t('fichaFipe', { v: moeda(u.fipe) })) : t('fichaSemFipe')}</small>
            <small>${u.cor ? `${esc(t('fichaCor', { c: u.cor }))} · ` : ''}${u.renavam ? esc(t('fichaRenavam', { r: u.renavam })) : t('fichaSemRenavam')}</small>
            ${cliente ? `<small>${t('colCliente')}: <strong>${esc(cliente.nome)}</strong></small>` : ''}
            <span class="acoes-linha"><span class="selo car-${estado}">${t('car_' + estado)}</span><button class="fino" data-acao="editarCarro" data-x="${u.id}">${t('editarCarro')}</button>
              <button class="fino" data-acao="abrirAnexos" data-x="${u.id}">${esc(t('anexosN', { n: anexosDe(u.id).length }))}</button></span>
          </div>
        </div>
        ${mesNav()}
        <section class="bloco"><h3 class="rotulo">${t('fichaMargem')}</h3>${contaMargem(mg)}</section>
        <section class="bloco"><h3 class="rotulo">${t('fichaReservas')}</h3>
          ${res.length ? `<div class="tabela-rolo"><table class="tabela">
            <thead><tr><th>${t('colCodigo')}</th><th>${t('colCliente')}</th><th>${t('retirada')}</th><th>${t('devolucao')}</th><th class="num">${t('total')}</th><th>${t('colSituacao')}</th></tr></thead>
            <tbody>${res.map((r) => `<tr><td><button class="link mono" data-acao="abrirReserva" data-x="${r.id}">${esc(r.codigo)}</button></td><td>${esc(r.motorista.nome)}</td>
              <td>${esc(dataHora(r.ini))}</td><td>${esc(dataHora(r.fim))}</td><td class="num">${esc(moeda(r.status === 'cancelada' ? r.multa : r.total))}</td>
              <td><span class="selo st-${r.status}">${t('st_' + r.status)}</span></td></tr>`).join('')}</tbody></table></div>` : `<p class="nota">${t('fichaSemReservas')}</p>`}
        </section>
        <section class="bloco"><h3 class="rotulo">${t('fichaCustos')}</h3>
          ${u.fipe ? `<p class="nota">${esc(t('fichaIpva', { l: moeda(L.ipva(u.fipe, cfg.aliqLocadora)), a: pctTxt(cfg.aliqLocadora), p: moeda(L.ipva(u.fipe, cfg.aliqParticular)), b: pctTxt(cfg.aliqParticular) }))}</p>` : ''}
          ${listaCustos(u)}
          <button class="botao linha" data-acao="novoCusto" data-x="${u.id}">${t('lancarCusto')}</button>
        </section>
        <section class="bloco"><h3 class="rotulo">${t('fichaManut')}</h3>${cartaoManut(troca)}</section>
      </article>`;
  }

  function fixosBloco() {
    const total = L.totalFixos(E.fixos), n = E.unidades.length, nf = UI.novoFixo, en = UI.erroNovoFixo;
    return `<section class="bloco"><h2 class="rotulo">${t('fixosTitulo')}</h2>
      <p class="nota">${esc(t('fixosAjuda', { v: moeda(total), n, p: moeda(L.fixoPorCarro(E)) }))}</p>
      <div class="fixos">${E.fixos.map((f) => {
        const erro = UI.erroFixo[f.id];
        return `<div class="fixo-linha">
          <input id="fx-nome-${f.id}" class="fixo-nome" value="${esc(f.nome)}" maxlength="40" autocomplete="off" data-campo="fixoNome" data-x="${f.id}" aria-label="${t('fixoNome')}" aria-invalid="${erro === 'erroNomeFixo'}">
          <div class="pl-entrada"><span>R$</span><input id="fx-valor-${f.id}" inputmode="decimal" value="${esc(reaisTxt(f.valor))}" maxlength="13" data-campo="fixoValor" data-x="${f.id}" aria-label="${esc(t('fixoValorDe', { n: f.nome }))}" aria-invalid="${erro === 'erroValorCusto'}"></div>
          <button class="fino" data-acao="apagarFixo" data-x="${f.id}">${t(UI.certezaFixo === f.id ? 'apagarManutCerteza' : 'apagarManut')}</button>
          ${erro ? `<p class="erro" role="alert">${t(erro)}</p>` : ''}
        </div>`;
      }).join('')}
        <div class="fixo-linha novo">
          <input id="nf-nome" class="fixo-nome" value="${esc(nf.nome)}" maxlength="40" autocomplete="off" placeholder="${t('fixoNovoNome')}" data-campo="novoFixo.nome" aria-label="${t('fixoNome')}" aria-invalid="${!!en.nome}">
          <div class="pl-entrada"><span>R$</span><input id="nf-valor" inputmode="decimal" value="${esc(nf.valor)}" maxlength="13" placeholder="0" data-campo="novoFixo.valor" aria-label="${t('fixoValor')}" aria-invalid="${!!en.valor}"></div>
          <button class="fino" data-acao="addFixo">+ ${t('fixoAdicionar')}</button>
          ${en.nome || en.valor ? `<p class="erro" role="alert">${t(en.nome || en.valor)}</p>` : ''}
        </div>
      </div>
    </section>`;
  }

  function margemPainel() {
    const f = L.margemFrota(E, UI.mes);
    const linhas = f.carros.map((mg, i) => {
      const u = E.unidades.find((x) => x.id === mg.unidade), pos = i === 0 ? 'topo-rank' : i === f.carros.length - 1 ? 'fundo-rank' : '';
      return `<tr class="${pos}"><td class="mono">${i + 1}º</td>
        <td><button class="link" data-acao="verFicha" data-x="${u.id}">${esc(u.placa)}</button><small>${esc(modelo(u.modelo).nome)}</small></td>
        <td class="num">${esc(moeda(mg.receita))}<small>${esc(t('mgDiarias', { n: mg.diarias }))}</small></td>
        <td class="num">${esc(moeda(mg.custoCarro))}</td><td class="num">${esc(moeda(mg.fixo))}</td>
        <td class="num">${moedaSinal(mg.lucro)}</td><td class="num">${esc(margemTxt(mg.margem))}</td></tr>`;
    }).join('');
    const melhor = f.carros[0], pior = f.carros[f.carros.length - 1];
    const placaDe = (mg) => E.unidades.find((x) => x.id === mg.unidade).placa;
    return `${mesNav()}
      <div class="kpis">
        <div class="kpi"><small>${t('mgReceitaFrota')}</small><b>${esc(moeda(f.receita))}</b></div>
        <div class="kpi"><small>${t('mgCustosFrota')}</small><b>${esc(moeda(f.custoCarro))}</b></div>
        <div class="kpi"><small>${t('mgFixoFrota')}</small><b>${esc(moeda(f.fixo))}</b></div>
        <div class="kpi"><small>${t('mgLucro')}</small><b>${moedaSinal(f.lucro)}</b></div>
        <div class="kpi"><small>${t('mgMargem')}</small><b>${esc(margemTxt(f.margem))}</b></div>
      </div>
      ${melhor ? `<div class="manut-resumo"><span class="selo ok">${esc(t('mgMelhor', { p: placaDe(melhor), v: moeda(melhor.lucro) }))}</span>
        <span class="selo pare">${esc(t('mgPior', { p: placaDe(pior), v: moeda(pior.lucro) }))}</span>
        <button class="fino" data-acao="novoCusto" data-x="${esc(UI.fichaId || '')}">+ ${t('lancarCusto')}</button></div>` : ''}
      <p class="nota">${t('mgAjuda')}</p>
      ${linhas ? `<div class="tabela-rolo" id="rolo-margem" tabindex="0"><table class="tabela rank">
        <thead><tr><th></th><th>${t('colCarro')}</th><th class="num">${t('mgColReceita')}</th><th class="num">${t('mgColCustos')}</th><th class="num">${t('mgColFixo')}</th><th class="num">${t('mgLucro')}</th><th class="num">${t('mgMargem')}</th></tr></thead>
        <tbody>${linhas}</tbody></table></div>` : `<p class="vazio">${t('semCarros')}</p>`}
      ${fixosBloco()}`;
  }

  // ponto de partida do simulador: a frota de hoje, no mês escolhido
  function baseSimulador() {
    const n = E.unidades.length;
    const media = (lista) => (lista.length ? Math.round(lista.reduce((s, v) => s + v, 0) / lista.length) : 0);
    return {
      custo: media(E.unidades.map((u) => L.margemCarro(E, u, UI.mes).custoCarro)),
      diaria: media(E.unidades.map((u) => E.tarifas[u.modelo]).filter(Number.isInteger)),
      fipe: media(E.unidades.map((u) => u.fipe).filter((v) => v > 0)),
      n,
    };
  }

  function simuladorPainel() {
    const base = baseSimulador(), s = UI.sim, cfg = E.config;
    const valor = (k) => (s[k] === null ? base[k] : s[k]);
    const conta = (n) => L.simular({ n, fixosMes: L.totalFixos(E.fixos), custoCarroMes: valor('custo'), diariaMedia: valor('diaria'),
      fipeMedio: valor('fipe'), aliqLocadora: cfg.aliqLocadora, aliqParticular: cfg.aliqParticular });
    const r = conta(s.n);
    const ns = [...new Set([base.n, 5, 10, 15, 20, s.n])].filter((x) => x > 0).sort((a, b) => a - b);
    const campo = (k, rotulo, ajuda) => `<div class="campo-claro"><label for="sim-${k}">${t(rotulo)}</label>
        <div class="pl-entrada"><span>R$</span><input id="sim-${k}" inputmode="decimal" maxlength="13" value="${esc(reaisTxt(valor(k)))}" data-campo="sim.${k}" aria-invalid="${!!s.erros[k]}"></div>
        <p class="nota">${esc(ajuda)}${s[k] !== null ? ` <button class="fino" data-acao="simFrota" data-x="${k}">${t('simUsarFrota')}</button>` : ''}</p>
        ${s.erros[k] ? `<p class="erro" role="alert">${t('erroValorCusto')}</p>` : ''}</div>`;
    const ocup = r.equilibrio === null ? null : Math.round((r.equilibrio / 30) * 100);
    return `<p class="nota">${t('simAjuda')}</p>
      <div class="filtros" role="group" aria-label="${t('simQuantos')}">${[5, 10, 15, 20].map((n) => `<button class="chip" data-acao="simN" data-x="${n}" aria-pressed="${s.n === n}">${esc(t('simNCarros', { n }))}</button>`).join('')}</div>
      <div class="sim-campos">
        <div class="campo-claro"><label for="sim-n">${t('simQuantos')}</label>
          <input id="sim-n" inputmode="numeric" maxlength="3" value="${esc(s.n)}" data-campo="sim.n" aria-invalid="${!!s.erros.n}">
          <p class="nota">${esc(t('simFrotaHoje', { n: base.n }))}</p>
          ${s.erros.n ? `<p class="erro" role="alert">${t('erroSimN')}</p>` : ''}</div>
        ${campo('custo', 'simCusto', t('simCustoAjuda', { m: nomeMes(UI.mes), v: moeda(base.custo) }))}
        ${campo('diaria', 'simDiaria', t('simDiariaAjuda', { v: moeda(base.diaria) }))}
        ${campo('fipe', 'simFipe', t('simFipeAjuda', { v: moeda(base.fipe) }))}
      </div>
      <div class="kpis">
        <div class="kpi"><small>${t('simFixoPorCarro')}</small><b>${esc(moeda(r.fixoPorCarro))}</b><i>${esc(t('simFixoTotal', { v: moeda(L.totalFixos(E.fixos)) }))}</i></div>
        <div class="kpi"><small>${t('simCustoPorCarro')}</small><b>${esc(moeda(r.custoPorCarro))}</b></div>
        <div class="kpi"><small>${esc(t('simEconomia', { n: r.n }))}</small><b>${esc(moeda(r.economiaAnual))}</b><i>${esc(t('simIpvaCarro', { l: moeda(r.ipvaLocadora), p: moeda(r.ipvaParticular) }))}</i></div>
        <div class="kpi"><small>${t('simEquilibrio')}</small><b>${r.equilibrio === null ? '–' : esc(t('simDiariasMes', { n: r.equilibrio }))}</b>${ocup === null ? '' : `<i>${esc(t('simOcupacao', { p: ocup }))}</i>`}</div>
      </div>
      <div class="tabela-rolo" id="rolo-sim" tabindex="0"><table class="tabela rank">
        <thead><tr><th>${t('simColCarros')}</th><th class="num">${t('simFixoPorCarro')}</th><th class="num">${t('simCustoPorCarro')}</th><th class="num">${t('simEquilibrio')}</th><th class="num">${t('simColEconomia')}</th></tr></thead>
        <tbody>${ns.map((n) => { const x = conta(n); return `<tr class="${n === s.n ? 'topo-rank' : ''}"><td>${esc(t('simNCarros', { n }))}${n === base.n ? `<small>${t('simHoje')}</small>` : ''}</td>
          <td class="num">${esc(moeda(x.fixoPorCarro))}</td><td class="num">${esc(moeda(x.custoPorCarro))}</td>
          <td class="num">${x.equilibrio === null ? '–' : esc(t('simDiariasMes', { n: x.equilibrio }))}</td><td class="num">${esc(moeda(x.economiaAnual))}</td></tr>`; }).join('')}</tbody>
      </table></div>
      <p class="nota">${esc(t('simConta', { a: pctTxt(cfg.aliqLocadora), b: pctTxt(cfg.aliqParticular) }))}</p>`;
  }

  function configPainel() {
    const cfg = E.config, e = UI.erroConfig;
    const campo = (k, rotulo, ajuda) => `<div class="campo-claro"><label for="cfg-${k}">${t(rotulo)}</label>
        <div class="pl-entrada"><input id="cfg-${k}" inputmode="decimal" maxlength="5" value="${esc(pctTxt(cfg[k]))}" data-campo="aliquota" data-x="${k}" aria-invalid="${!!e[k]}"><span>%</span></div>
        <p class="nota">${t(ajuda)}</p>
        ${e[k] ? `<p class="erro" role="alert">${t('erroAliquota')}</p>` : ''}</div>`;
    return `<section class="bloco config"><h2 class="rotulo">${t('cfgIpvaTitulo')}</h2>
      <p class="nota">${t('cfgIpvaAjuda')}</p>
      ${campo('aliqLocadora', 'cfgAliqLocadora', 'cfgAliqLocadoraAjuda')}
      ${campo('aliqParticular', 'cfgAliqParticular', 'cfgAliqParticularAjuda')}
      <p class="nota">${esc(t('cfgExemplo', { l: moeda(L.ipva(10000000, cfg.aliqLocadora)), p: moeda(L.ipva(10000000, cfg.aliqParticular)) }))}</p>
    </section>`;
  }

  /* ---------- clientes do aluguel semanal, anexos e lembretes (dono) ---------- */
  const anexosDe = (dono) => E.anexos.filter((a) => a.dono === dono);
  const clienteId = (id) => E.clientes.find((c) => c.id === id);
  const SELO_LEM = { atrasado: 'pare', hoje: 'atencao', emDias: '' };
  const SELO_CNH = { vencida: 'pare', vence: 'atencao', ok: 'ok' };
  const SELO_CAUCAO = { guardada: '', acertar: 'atencao', acertada: 'ok' };
  const carroTxt = (id) => { const u = unidade(id); return u ? nomeCarro(u) : t('clCarroRemovido'); };
  const lemPagTxt = (l) => (l.estado === 'atrasado' ? (l.dias === -1 ? t('lem_atrasadoUm') : t('lem_atrasado', { n: -l.dias }))
    : l.estado === 'hoje' ? t('lem_hoje') : l.dias === 1 ? t('lem_amanha') : t('lem_emDias', { n: l.dias }));
  const lemKmTxt = (l) => t('lemKm_' + l.estado, { n: Math.abs(l.dias) });

  // pagamentos semanais e perguntas de km de hoje; `pendentes` = o que precisa de ação agora (atrasado ou hoje)
  function lembretes() {
    const hoje = hojeData();
    const pag = E.clientes.map((c) => ({ c, l: L.lembretePagamento(c, E.recebimentos, hoje) })).filter((x) => x.l)
      .sort((a, b) => a.l.venc.localeCompare(b.l.venc));
    const km = E.clientes.map((c) => { const u = E.unidades.find((x) => x.id === c.unidade); return { c, u, l: L.lembreteKm(c, u, hoje) }; })
      .filter((x) => x.l).sort((a, b) => a.l.dias - b.l.dias);
    const cau = E.clientes.map((c) => ({ c, l: L.situacaoCaucao(c, hoje) })).filter((x) => x.l && x.l.estado === 'acertar');
    const pendentes = pag.filter((x) => x.l.estado !== 'emDias').length + km.filter((x) => x.l.estado !== 'emDias').length + cau.length;
    return { pag, km, cau, pendentes };
  }

  function blocoLembretes() {
    const { pag, km, cau, pendentes } = lembretes();
    const itemCau = ({ c, l }) => `<li class="lem lem-hoje">
        <div class="lem-txt"><strong>${t('lemCaucao')} · ${esc(c.nome)}</strong>
          <small>${esc(carroTxt(c.unidade))} · ${esc(t('lemCaucaoTxt', { d: dataBR(c.devolucao), v: moeda(l.valor) }))}</small></div>
        <span class="selo atencao">${t('lemCaucaoSelo')}</span>
        <button class="botao verde" data-acao="acertarCaucao" data-x="${c.id}">${t('acertarCaucao')}</button>
      </li>`;
    const itemPag = ({ c, l }) => `<li class="lem lem-${l.estado}">
        <div class="lem-txt"><strong>${t('lemPagamento')} · ${esc(c.nome)}</strong>
          <small>${esc(carroTxt(c.unidade))} · ${esc(t('lemPagTxt', { v: moeda(l.valor), d: dataBR(l.venc) }))}</small>
          ${l.abertos > 1 ? `<small class="erro">${esc(t('lemSemanasAbertas', { n: l.abertos }))}</small>` : ''}</div>
        <span class="selo ${SELO_LEM[l.estado]}">${esc(lemPagTxt(l))}</span>
        <button class="botao verde" data-acao="marcarPago" data-x="${c.id}" data-y="${l.venc}">${t('marcarPago')}</button>
      </li>`;
    const itemKm = ({ c, u, l }) => {
      const erro = UI.erroKmLembrete[u.id];
      return `<li class="lem lem-${l.estado}">
        <div class="lem-txt"><strong>${t('lemKm')} · ${esc(c.nome)}</strong>
          <small>${esc(nomeCarro(u))} · ${esc(t('lemKmTxt', { k: fmtNum(u.km), d: dataBR(l.base) }))}</small></div>
        <span class="selo ${SELO_LEM[l.estado]}">${esc(lemKmTxt(l))}</span>
        <span class="lem-km"><input id="km-lem-${u.id}" inputmode="numeric" maxlength="9" autocomplete="off" placeholder="${esc(fmtNum(u.km))}" value="${esc(UI.kmLembrete[u.id] || '')}"
          data-campo="kmLembrete" data-x="${u.id}" aria-label="${esc(t('lemKmNovo') + ' · ' + u.placa)}" aria-invalid="${!!erro}">
          <button class="botao linha" data-acao="registrarKm" data-x="${u.id}">${t('registrarKm')}</button></span>
        ${erro ? `<p class="erro" role="alert">${t(erro)}</p>` : ''}
      </li>`;
    };
    return `<section class="bloco lembretes"><h2 class="rotulo">${pendentes ? esc(t('lembretesN', { n: pendentes })) : t('lembretes')}</h2>
      <p class="nota aviso-lem">${t('lembretesAviso')}</p>

  function cartaoCliente(c) {

    const a = c.antecedentes;
    return `<article class="manut-cartao cliente">
      <div class="cl-cab"><strong>${esc(c.nome)}</strong>
        <small>${t('cpf')} ${esc(c.cpf)} · ${esc(c.fone)}${c.email ? ` · ${esc(c.email)}` : ''}</small>
        <small>${esc(c.endereco)}</small></div>
      <div class="manut-resumo">
        <span class="selo ${SELO_CNH[cnh.estado]}">${esc(t('cnh_' + cnh.estado, { n: cnh.dias }))}</span>
        <span class="selo ${a.ok ? 'ok' : 'atencao'}">${esc(a.ok ? t('ant_sim', { d: dataBR(a.data) }) : t('ant_nao'))}</span>
        ${pag ? `<span class="selo ${SELO_LEM[pag.estado]}">${esc(lemPagTxt(pag))}</span>` : ''}
        ${cau ? `<span class="selo ${SELO_CAUCAO[cau.estado]}">${esc(t('cau_' + cau.estado, { v: moeda(cau.valor), d: cau.data ? dataBR(cau.data) : '' }))}</span>` : ''}
      </div>
      <small>${esc(t('cnhTxt', { c: c.cnhCategoria, d: dataBR(c.cnhValidade) }))} · nº ${esc(c.cnhNumero)}</small>
      ${a.obs ? `<small>${esc(a.obs)}</small>` : ''}
      ${c.unidade ? `<small><strong>${esc(t('clCarro', { c: carroTxt(c.unidade) }))}</strong></small>
        <small>${esc(t('clPeriodo', { e: dataBR(c.entrega), d: c.devolucao ? dataBR(c.devolucao) : t('clSemDevolucao') }))}</small>
        <small>${esc(t('clValor', { v: moeda(c.valorSemanal), d: t('sem_' + c.diaVenc).toLocaleLowerCase(LOCALE) }))}</small>` : `<small>${t('clSemCarro')}</small>`}
      ${cau && cau.estado === 'acertada' ? `<small>${esc(t('cauAcertadaTxt', { v: moeda(cau.valor), r: moeda(cau.devolvido),

      ${pagos.length ? `<h3 class="rotulo">${t('clPagamentos')}</h3><ul class="manut-regs">${pagos.map((p) => `<li><span>${esc(t('clPagoEm', { v: dataBR(p.venc), r: moeda(p.valor), p: dataBR(p.data) }))}</span>
        <button class="fino" data-acao="apagarPagamento" data-x="${p.id}">${t(UI.certezaPagamento === p.id ? 'apagarManutCerteza' : 'apagarManut')}</button></li>`).join('')}</ul>` : ''}
      <span class="acoes-linha">${cau && cau.estado === 'acertar' ? `<button class="botao verde" data-acao="acertarCaucao" data-x="${c.id}">${t('acertarCaucao')}</button>` : ''}
        <button class="fino" data-acao="editarCliente" data-x="${c.id}">${t('editarCarro')}</button>
        <button class="fino" data-acao="abrirAnexos" data-x="${c.id}">${esc(t('anexosN', { n: anexosDe(c.id).length }))}</button></span>
    </article>`;

  function clientesLista() {
    const lista = [...E.clientes].sort((a, b) => a.nome.localeCompare(b.nome, LOCALE));
    return `<p class="nota">${t('clientesAjuda')}</p>
      <div class="frota-topo"><button class="botao verde" data-acao="novoCliente">+ ${t('cadastrarCliente')}</button></div>
      ${lista.length ? `<div class="manut-lista">${lista.map(cartaoCliente).join('')}</div>` : `<p class="vazio">${t('semClientes')}</p>`}`;
  }

  function painel() {
    const abas = [['hoje', 'abaHoje'], ['quadro', 'abaQuadro'], ['reservas', 'abaReservasPainel'], ['frota', 'abaFrota'], ['clientes', 'abaClientes'], ['ficha', 'abaFicha'], ['manut', 'abaManut'],
      ['margem', 'abaMargem'], ['simulador', 'abaSimulador'], ['precos', 'abaPrecos'], ['config', 'abaConfig']]
      .filter(([id]) => D.CONFIG.reservas || (id !== 'quadro' && id !== 'reservas'));
    if (!abas.some(([id]) => id === UI.abaPainel)) UI.abaPainel = 'hoje';
    const corpo = { hoje: painelHoje, quadro, reservas: reservasTabela, frota: frotaLista, clientes: clientesLista, ficha: fichaCarro, manut: manutencaoLista,
      margem: margemPainel, simulador: simuladorPainel, precos: precosLista, config: configPainel }[UI.abaPainel]();
    const alertas = trocasDaFrota().filter((x) => x.pior <= 1).length;
    const pendentes = lembretes().pendentes;
    const rotuloAba = (id, k) => (id === 'manut' && alertas ? t('abaManutAlerta', { n: alertas })
      : id === 'hoje' && pendentes ? t('abaHojeN', { n: pendentes }) : t(k));
    return `<section class="sup-painel" aria-label="${t('vistaLocadora')}">
      <div class="rolo" id="rolo-painel"><div class="painel-miolo gut">
        ${kpis()}
        <nav class="abas-painel" role="group">${abas.map(([id, k]) => `<button data-acao="abaPainel" data-x="${id}" aria-pressed="${UI.abaPainel === id}">${rotuloAba(id, k)}</button>`).join('')}</nav>
        ${corpo}
      </div></div>
    </section>`;
  }

  /* ---------- janelas ---------- */
  function modalReserva(r) {
    return `<div class="jan-fundo" data-acao="fecharModal" data-fundo="1"><div class="janela" role="dialog" aria-modal="true" aria-label="${esc(r.codigo)}">
      <button class="fechar" id="jan-fechar" data-acao="fecharModal" aria-label="${t('fechar')}">×</button>
      ${detalheReserva(r, true)}

  function fotoHTML(f, cor) {
    if (f === 'frente') return C.frente(cor, false);
    if (f === 'traseira') return C.frente(cor, true);
    return `<span class="${f === 'direita' ? 'espelho' : ''}">${C.lateral('sedan', cor, '')}</span>`;
  }

  function modalVistoria() {
    const v = UI.modal, r = reserva(v.id), fase = v.fase, m = modelo(r.modelo);
    const antigos = fase === 'dev' && r.vistoria.ret ? r.vistoria.ret.pins : [];
    const zonas = C.ZONAS.map((z) => `<rect id="z-${z.id}" class="zona" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="4" tabindex="0" role="button" aria-label="${t('zona_' + z.id)}" data-zona="${z.id}"><title>${t('zona_' + z.id)}</title></rect>`).join('');
    const niveis = [[8, 'cheio'], [6, 'tresQuartos'], [4, 'meio'], [2, 'umQuarto'], [0, 'vazio']];
    const titulo = t(fase === 'ret' ? 'vistoriaRetTitulo' : 'vistoriaDevTitulo');
    return `<div class="jan-fundo"><div class="janela" role="dialog" aria-modal="true" aria-label="${titulo}">
      <button class="fechar" id="jan-fechar" data-acao="fecharModal" aria-label="${t('fechar')}">×</button>
      <h2 class="titulo">${titulo}</h2>
      <p class="specs">${esc(m.nome)} ${placaHTML(unidade(r.unidade).placa)}</p>
      <p class="nota">${t(fase === 'ret' ? 'vistoriaAjuda' : 'vistoriaAjudaDev')}</p>
      <h3 class="rotulo">${t('fotosVistoria')} · ${esc(t('fotosFeitas', { n: v.fotos.length }))}</h3>
      <div class="fotos">${D.FOTOS.map((f) => `<button class="foto${v.fotos.includes(f) ? ' feita' : ''}" id="foto-${f}" data-acao="tirarFoto" data-x="${f}" aria-pressed="${v.fotos.includes(f)}">
        ${v.fotos.includes(f) ? fotoHTML(f, m.cor) : '<span class="foto-vazia" aria-hidden="true">📷</span>'}<span>${t('foto_' + f)}</span></button>`).join('')}</div>
      ${v.erroFotos ? `<p class="erro" role="alert">${t('erroFotos')}</p>` : ''}
      <div class="filtros" role="group" aria-label="${t('tipoDano')}">${D.AVARIAS.map((a) => `<button class="chip" id="tipo-${a}" data-acao="tipoDano" data-x="${a}" aria-pressed="${v.dano === a}">${t('av_' + a)}</button>`).join('')}</div>
      <div class="vist-grande">
        <svg id="vist-svg" viewBox="0 0 200 420">${C.deCima('var(--carro-claro)')}${zonas}${pinsSVG(antigos, 'velho')}${pinsSVG(v.pins, 'novo')}</svg>
        <div class="vist-lado">
          ${v.pins.length ? `<ul class="danos">${v.pins.map((p, i) => `<li><span>${i + 1}. ${t('zona_' + p.zona)}: ${t('av_' + p.tipo)}</span><button class="fino" data-acao="removerPin" data-x="${i}">${t('remover')}</button></li>`).join('')}</ul>` : `<p class="nota">${t('semAvarias')}</p>`}
          <div class="campo-claro"><label for="v-comb">${t('combustivel')}</label><select id="v-comb" data-campo="vist.comb">${opcoes(niveis.map(([n, k]) => [String(n), t(k)]), String(v.comb))}</select></div>
          <div class="campo-claro"><label for="v-km">${t('odometro')}</label><input id="v-km" type="number" inputmode="numeric" min="0" value="${esc(v.km)}" data-campo="vist.km" aria-invalid="${!!v.erroKm}">${v.erroKm ? `<p class="erro" role="alert">${esc(t('erroOdometro', { n: Number(v.erroKm).toLocaleString(LOCALE) }))}</p>` : ''}</div>
        </div>
      </div>
      <button class="botao ${fase === 'ret' ? 'verde' : 'ambar'} largo" id="v-salvar" data-acao="salvarVistoria">${t(fase === 'ret' ? 'registrarRetirada' : 'registrarDevolucao')}</button>
    </div></div>`;
  }

  function contratoHTML(r) {
    const m = modelo(r.modelo), p = plano(r.plano), n = L.diarias(r.ini, r.fim);
    const cob = p.copart ? t('planoCopart', { v: moeda(p.copart) }) : t('planoSemCopart');
    const itens = [
      t('ct_partes', { m: D.CONFIG.marca, n: r.motorista.nome }),
      t('ct_veiculo', { g: t('cat_' + m.cat), c: m.nome, p: unidade(r.unidade).placa }),
      t('ct_periodo', { i: dataHora(r.ini), f: dataHora(r.fim), d: dias(n) }),
      t('ct_protecao', { p: t('plano_' + p.id), c: cob }),
      t('ct_caucao', { v: moeda(p.caucao) }),
      t('ct_km'), t('ct_combustivel'), t('ct_multas'),
      t('ct_total', { v: moeda(r.total) }),
    ];
    return `<div class="contrato"><strong>${t('contratoTitulo')}</strong><ol>${itens.map((x) => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
  }

  const tracosD = (tracos) => tracos.map((tr) => tr.length === 1 ? `M${tr[0][0]} ${tr[0][1]}l0.5 0` : 'M' + tr.map((p) => `${p[0]} ${p[1]}`).join('L')).join('');

  function modalCheckin() {
    const c = UI.modal, r = reserva(c.id), m = modelo(r.modelo);
    let corpo;
    if (c.etapa === 4) {
      corpo = `<div class="ck-pronto">${C.qr(r.codigo)}
        <h3 class="titulo centro" tabindex="-1" id="ck-pronto">${t('ck_prontoTitulo')}</h3>
        <p class="centro">${esc(t('ck_prontoTxt', { l: local(r.local).nome }))}</p>
        <p class="centro nota">${t('ck_qrSimulado')} · ${esc(r.codigo)}</p></div>
        <button class="botao verde largo" data-acao="fecharModal">${t('fechar')}</button>`;
    } else if (c.etapa === 1 || c.etapa === 2) {
      const qual = c.etapa === 1 ? 'cnh' : 'selfie';
      const feito = c[qual];
      corpo = `<p class="nota">${t(qual === 'cnh' ? 'ck_cnhAjuda' : 'ck_selfieAjuda')}</p>
        <div class="ck-foto${feito ? ' feita' : ''}">${feito ? (qual === 'cnh' ? C.cnh(esc(r.motorista.nome)) : C.selfie()) : '<span class="foto-vazia" aria-hidden="true">📷</span>'}</div>
        ${feito ? `<p class="selo ok">${t('ck_fotoOk')}</p><button class="botao linha" data-acao="ckFoto" data-x="${qual}">${t('ck_refazer')}</button>`
          : `<button class="botao linha" id="ck-tirar" data-acao="ckFoto" data-x="${qual}">${t(qual === 'cnh' ? 'ck_tirarCnh' : 'ck_tirarSelfie')}</button>`}
        ${c.erro ? `<p class="erro" role="alert">${t(c.erro)}</p>` : ''}
        <button class="botao verde largo" id="ck-avancar" data-acao="ckAvancar">${t('continuar')}</button>`;
    } else {
      corpo = `<p class="nota">${t('ck_contratoAjuda')}</p>
        ${contratoHTML(r)}
        <label class="marcar claro"><input id="ck-aceite" type="checkbox" data-campo="ck.aceite"${c.aceite ? ' checked' : ''}> ${t('ck_aceite')}</label>
        <div class="assin-caixa">
          <svg id="ck-assin" class="assin${c.tracos.length ? ' assinado' : ''}" viewBox="0 0 300 120" aria-label="${t('ck_assineAqui')}" role="img">
            <text x="150" y="66" text-anchor="middle" class="assin-dica">${t('ck_assineAqui')}</text>
            <path d="M20 96H280" class="assin-linha"/>
            <path class="traco" d="${tracosD(c.tracos)}"/>
          </svg>
          <button class="fino" data-acao="ckLimpar">${t('ck_limpar')}</button>
        </div>
        <div class="campo-claro"><label for="ck-texto">${t('ck_ouDigite')}</label><input id="ck-texto" type="text" maxlength="80" autocomplete="off" value="${esc(c.texto)}" data-campo="ck.texto"></div>
        ${c.erro ? `<p class="erro" role="alert">${t(c.erro)}</p>` : ''}
        <button class="botao ambar largo" id="ck-concluir" data-acao="ckConcluir">${t('ck_concluir')}</button>`;
    }
    return `<div class="jan-fundo"><div class="janela" role="dialog" aria-modal="true" aria-label="${t('checkinTitulo')}">
      <button class="fechar" id="jan-fechar" data-acao="fecharModal" aria-label="${t('fechar')}">×</button>
      <h2 class="titulo">${t('checkinTitulo')}</h2>
      <p class="specs">${esc(r.codigo)} · ${esc(m.nome)} · ${esc(local(r.local).nome)}</p>
      ${c.etapa < 4 ? `<div class="passos">${[1, 2, 3].map((n) => `<span class="passo${n === c.etapa ? ' atual' : n < c.etapa ? ' feito' : ''}"><i>${n}</i><span>${t('ck_passo' + n)}</span></span>`).join('')}</div>` : ''}
      ${corpo}
    </div></div>`;
  }

  // campo de formulário das janelas do dono; prefixo "fc" = carro, "fm" = manutenção, "fu" = custo
  function campoForm(pre, id, rotulo, attrs, ajuda) {
    const c = UI.modal, erro = c.erros[id], idEl = `${pre}-${id}`;
    return `<div class="campo-claro"><label for="${idEl}">${t(rotulo)}</label>
      <input id="${idEl}" value="${esc(c.f[id])}" data-campo="${pre}.${id}" ${attrs} aria-invalid="${!!erro}"${erro ? ` aria-describedby="${idEl}-erro"` : ''}>
      ${ajuda ? `<p class="nota">${esc(ajuda)}</p>` : ''}
      ${erro ? `<p id="${idEl}-erro" class="erro" role="alert">${esc(t(erro, { n: anoAtual() + 1 }))}</p>` : ''}</div>`;
  }

      <button class="fechar" id="jan-fechar" data-acao="fecharModal" aria-label="${t('fechar')}">×</button>
      <h2 class="titulo">${esc(titulo)}</h2>
      ${campoForm('fc', 'modelo', 'fc_modelo', 'type="text" list="fc-modelos" maxlength="40" autocomplete="off"', t('fc_modeloAjuda'))}

      <div class="campo-claro"><label for="fc-categoria">${t('fc_categoria')}</label>
        <select id="fc-categoria" data-campo="fc.categoria">${opcoes(cats, f.categoria)}</select>
        ${e.categoria ? `<p class="erro" role="alert">${t('erroCategoriaCarro')}</p>` : ''}</div>

      ${campoForm('fc', 'renavam', 'fc_renavam', 'type="text" inputmode="numeric" maxlength="13" autocomplete="off" spellcheck="false"', t('fc_renavamAjuda'))}

        ${e.filtro ? `<p class="erro" role="alert">${t(e.filtro)}</p>` : ''}</div>` : ''}

      ${f.tipo === 'filtro' && f.filtro === 'outro' ? campoForm('fm', 'obs', 'fm_obsFiltro', 'type="text" maxlength="200" autocomplete="off"') : ''}

  function salvarAcertoCaucao() {
    const m = UI.modal, c = clienteId(m.cliente), hoje = hojeData();
    if (!c || !(c.caucao > 0) || c.caucaoAcerto) { log('acerto de caução cancelado', m.cliente); fecharModal(); desenhar(); return; }
    const { erros, acerto } = L.validarAcertoCaucao(m.f, c, hoje);
    m.erros = erros;
    if (Object.keys(erros).length) { log('acerto de caução com erro', Object.keys(erros).join(', ')); desenharModal(); focarErro('fk', erros); return; }
    c.caucaoAcerto = acerto;
    const ok = salvar();
    log('caução acertada', `${c.id} descontado ${acerto.descontado}`);
    avisar(ok ? t('caucaoAcertadaAviso', { n: c.nome, v: moeda(acerto.devolvido) }) : t('erroSalvarAparelho'));
    fecharModal();
    desenhar();
  }

  const MB = 1024 * 1024;
  const tamanhoTxt = (b) => (b >= MB ? `${(b / MB).toLocaleString(LOCALE, { maximumFractionDigits: 1 })} MB` : `${Math.max(1, Math.round(b / 1024))} KB`);

  const donoNome = (dono) => (dono.startsWith('cl') ? (clienteId(dono) || {}).nome || '' : (() => { const u = unidade(dono); return u ? nomeCarro(u) : ''; })());
  const donoExiste = (dono) => (dono.startsWith('cl') ? !!clienteId(dono) : E.unidades.some((u) => u.id === dono));

        <span class="acoes-linha"><button class="fino" data-acao="abrirAnexo" data-x="${a.id}">${t('abrirAnexo')}</button><button class="fino" data-acao="baixarAnexo" data-x="${a.id}">${t('baixarAnexo')}</button>
        <button class="fino" data-acao="apagarAnexo" data-x="${a.id}">${t(UI.certezaAnexo === a.id ? 'apagarManutCerteza' : 'apagarManut')}</button></span></li>`).join('')}</ul>`

        ${m.arquivo ? `<p class="nota">${esc(m.arquivo.name)} · ${esc(tamanhoTxt(m.arquivo.size))}</p>` : ''}
        ${e.arquivo ? `<p id="fa-arquivo-erro" class="erro" role="alert">${esc(t(e.arquivo, { n: maxMb }))}</p>` : ''}</div>
      ${campoForm('fa', 'nome', 'fa_nome', 'type="text" maxlength="60" autocomplete="off"', t('fa_nomeAjuda'))}
      ${campoForm('fa', 'data', 'fa_data', `type="date" max="${hoje}"`)}

  // no IPVA, preenche o valor calculado; se o dono digitou outro valor, respeita
  function ipvaAutomatico(c) {
    const u = unidade(c.f.unidade);
    if (c.f.tipo === 'ipva' && (c.f.valor === '' || c.auto) && u && u.fipe) { c.f.valor = reaisTxt(L.ipva(u.fipe, E.config.aliqLocadora)); c.auto = true; }
    else if (c.auto && (c.f.tipo !== 'ipva' || !u || !u.fipe)) { c.f.valor = ''; c.auto = false; }
  }

  /* ---------- desenhar ---------- */
  function seletorDe(el) {
    if (!el || el === document.body) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    if (el.dataset && el.dataset.acao) return `[data-acao="${el.dataset.acao}"]` + (el.dataset.x ? `[data-x="${CSS.escape(el.dataset.x)}"]` : '');
    return null;
  }

  // redesenho vindo de `change`: esperar o foco assentar e o clique terminar, senão o botão some antes do clique contar
  let dedoApertado = false, redesenhoPendente = false;
  function desenharDepois() {
    if (dedoApertado) { redesenhoPendente = true; return; }
    setTimeout(desenhar, 0);
  }
  addEventListener('pointerdown', () => { dedoApertado = true; }, true);
  for (const ev of ['pointerup', 'pointercancel']) {
    addEventListener(ev, () => {
      dedoApertado = false;
      setTimeout(() => { if (redesenhoPendente) { redesenhoPendente = false; desenhar(); } }, 30);
    }, true);
  }

  function desenhar() {
    const foco = seletorDe(document.activeElement);
    if (NUVEM.tela !== 'app' || !E) {
      document.getElementById('app').innerHTML = telaEntrada();
      document.getElementById('modal').innerHTML = '';
      const el = foco && document.querySelector(foco);
      const alvo = el || document.querySelector('.entrada input, .entrada button');
      if (alvo) alvo.focus({ preventScroll: true });
      return;
    }
    const rolos = {};
    for (const id of ['rolo-cliente', 'rolo-painel', 'rolo-quadro', 'rolo-tipos', 'rolo-chips', 'rolo-filtro', 'rolo-reservas', 'rolo-frota', 'rolo-lojas', 'rolo-margem', 'rolo-sim']) {
      const el = document.getElementById(id);
      if (el) rolos[id] = [el.scrollTop, el.scrollLeft];
    }
    document.getElementById('app').innerHTML = `${topo()}<main class="palco modo-${UI.modo}">
      ${UI.modo !== 'locadora' ? cliente() : ''}
      ${UI.modo !== 'cliente' ? painel() : ''}
    </main>`;
    desenharModal();
    for (const [id, pos] of Object.entries(rolos)) {
      const el = document.getElementById(id);
      if (el) { el.scrollTop = pos[0]; el.scrollLeft = pos[1]; }
    }
    if (foco) { const el = document.querySelector(foco); if (el) el.focus({ preventScroll: true }); }
  }

  function desenharModal() {
    const alvo = document.getElementById('modal');
    const m = UI.modal;
    const antes = alvo.querySelector('.janela');
    const y = antes ? antes.scrollTop : 0;
    const janelas = { vistoria: modalVistoria, checkin: modalCheckin, carro: modalCarro, manut: modalManut, custo: modalCusto, cliente: modalCliente, anexos: modalAnexos, copia: modalCopia, conta: modalConta, caucao: modalCaucao };
    alvo.innerHTML = !m ? '' : janelas[m.tipo] ? janelas[m.tipo]() : modalReserva(reserva(m.id));
    const depois = alvo.querySelector('.janela');
    if (depois) depois.scrollTop = y;
  }

  function irPara(tela) {
    UI.tela = tela;
    if (document.activeElement) document.activeElement.blur();
    desenhar();
    const r = document.getElementById('rolo-cliente');
    if (r) r.scrollTop = 0;
    // leva o foco pra tela nova, senão quem usa teclado fica preso no botão que sumiu
    const alvo = r && r.querySelector('h1, .voltar, .placa select, button');
    if (alvo && document.activeElement === document.body) alvo.focus({ preventScroll: true });
  }

  function abrirModal(m) {
    if (!UI.modal) UI.abridor = seletorDe(document.activeElement);
    UI.modal = m;
    UI.certezaCancelar = null;
    desenharModal();
    const jan = document.querySelector('.janela');
    if (jan) jan.scrollTop = 0;
    const f = document.getElementById('jan-fechar');
    if (f) f.focus();
  }

  function fecharModal() {
    UI.modal = null;
    UI.certezaCancelar = null;
    desenharModal();
    const el = UI.abridor && document.querySelector(UI.abridor);
    if (el) el.focus({ preventScroll: true });
  }

  /* ---------- operações ---------- */
  function confirmarReserva() {
    const r = UI.rascunho, { ini, fim } = periodo(), m = UI.modeloId;
    const editada = UI.editandoId ? reserva(UI.editandoId) : null;
    if (UI.editandoId && (!editada || editada.status !== 'reservada')) {
      log('alteração recusada: a reserva não está mais ativa', UI.editandoId);
      UI.editandoId = null; UI.rascunho = null; UI.abaCliente = 'reservas';
      irPara('reservas');
      return;
    }
    const erroPeriodo = erroDaBusca();
    if (erroPeriodo) {
      log('reserva recusada: o período deixou de valer', erroPeriodo.chave);
      UI.erroBusca = erroPeriodo;
      UI.rascunho = null;
      UI.abaCliente = 'reservar';
      irPara('busca');
      return;
    }
    const livres = L.unidadesLivres(E, m, UI.busca.local, ini, fim, hojeTxt(), UI.editandoId);
    if (!livres.length) {
      log('reserva recusada: carro ficou sem unidade livre', m);
      r.erroReserva = 'erroSemCarro';
      desenhar();
      return;
    }
    const conta = orcar(m, r.plano, r.extras);
    const extras = r.extras.filter((x) => !(x === 'vidros' && plano(r.plano).incluiVidros));
    const dados = {
      unidade: (editada && livres.find((u) => u.id === editada.unidade) || livres[0]).id, modelo: m, local: UI.busca.local, localDev: localDev(), ini, fim,
      plano: r.plano, extras, pagamento: r.pagamento, tarifaDia: E.tarifas[m],
      motorista: { nome: r.motorista.nome.trim(), email: r.motorista.email.trim(), fone: r.motorista.fone.trim(), cpf: r.motorista.cpf.trim(), idade: Number(r.motorista.idade) },
      linhas: conta.linhas, total: conta.total,
    };
    let alvo;
    if (editada) {
      // contrato mudou: CNH e selfie continuam valendo, mas precisa assinar de novo
      Object.assign(editada, dados);
      editada.checkin = { ...editada.checkin, assinatura: null, em: null };
      alvo = editada;
      log('reserva alterada', editada.codigo);
      if (UI.modo === 'ambos') avisar(t('alteradaAviso', { c: editada.codigo }));
    } else {
      const codigo = L.novoCodigo(E.reservas.map((x) => x.codigo), Math.random);
      alvo = { id: 'r' + codigo, codigo, status: 'reservada', minha: true, multa: 0, vistoria: {},
        checkin: { cnh: false, selfie: false, assinatura: null, em: null }, ...dados };
      E.reservas.push(alvo);
      log('reserva criada', codigo);
      if (UI.modo === 'ambos') avisar(t('novaReservaAviso', { c: codigo, n: alvo.motorista.nome }));
    }
    salvar();
    UI.foiAlteracao = !!editada;
    UI.editandoId = null;
    UI.confirmadaId = alvo.id;
    UI.rascunho = null;
    UI.destaque = alvo.id;
    setTimeout(() => { if (UI.destaque === alvo.id) { UI.destaque = null; desenhar(); } }, 5000);
    irPara('confirmada');
  }

  function salvarVistoria() {
    const v = UI.modal, r = reserva(v.id), u = unidade(r.unidade);
    if (v.fotos.length < D.FOTOS.length) { v.erroFotos = true; desenharModal(); return; }
    const km = Number(v.km);
    const minimo = v.fase === 'dev' && r.vistoria.ret ? r.vistoria.ret.km : u.km;
    if (!Number.isFinite(km) || km < minimo || km < 0 || String(v.km).trim() === '') {
      v.erroKm = String(minimo);
      desenharModal();
      return;
    }
    r.vistoria[v.fase] = { pins: v.pins, comb: Number(v.comb), km, fotos: [...v.fotos] };
    u.km = km;
    r.status = v.fase === 'ret' ? 'retirada' : 'devolvida';
    if (v.fase === 'dev') {
      u.situacao = 'vistoria'; // volta pra loja e passa por vistoria/limpeza antes de alugar de novo
      // devolveu em outra loja: o carro passa a estar lá, a não ser que já tenha reserva saindo daqui
      if (!E.reservas.some((x) => x.unidade === u.id && x.status === 'reservada' && x.local === u.local)) u.local = r.localDev;
    }
    salvar();
    log(`vistoria de ${v.fase} registrada`, r.codigo);
    avisar(t(v.fase === 'ret' ? 'retiradaOk' : 'devolucaoOk', { c: r.codigo, n: L.pontosDe(r) }));
    fecharModal();
    desenhar();
  }

  function pontoSVG(svg, evento) {
    const p = new DOMPoint(evento.clientX, evento.clientY).matrixTransform(svg.getScreenCTM().inverse());
    return [Math.round(p.x), Math.round(p.y)];
  }

  function adicionarPin(zonaEl, evento) {
    const v = UI.modal, z = C.ZONAS.find((x) => x.id === zonaEl.dataset.zona);
    let x = z.x + z.w / 2, y = z.y + z.h / 2;
    const svg = document.getElementById('vist-svg');
    if (evento && evento.clientX && svg.getScreenCTM()) [x, y] = pontoSVG(svg, evento);
    v.pins.push({ x, y, zona: z.id, tipo: v.dano });

  function concluirCheckin() {

  function focarErro(pre, erros) {
    const k = Object.keys(erros)[0];
    const el = k && document.getElementById(`${pre}-${k}`);
    if (el) el.focus();
  }

  function proximoId(prefixo, lista) {
    const nums = lista.map((x) => Number(String(x.id).slice(prefixo.length))).filter(Number.isInteger);
    return prefixo + (Math.max(0, ...nums) + 1);
  }

  function salvarCarro() {
    const c = UI.modal, f = c.f;
    const atual = c.unidade ? E.unidades.find((u) => u.id === c.unidade) : null;
    if (c.unidade && !atual) { log('edição cancelada: o carro não está mais na frota', c.unidade); fecharModal(); desenhar(); return; }
    const { erros, carro } = L.validarCarro(f, {
      categorias: D.CATEGORIAS, anoAtual: anoAtual(),
      placasEmUso: E.unidades.filter((u) => u !== atual).map((u) => L.normalizarPlaca(u.placa)),
      renavamsEmUso: E.unidades.filter((u) => u !== atual && u.renavam).map((u) => u.renavam),
    });
    const nome = carro.modelo.toLocaleLowerCase(LOCALE);
    let m = E.modelos.find((x) => x.nome.toLocaleLowerCase(LOCALE) === nome);
    // reserva ativa foi feita pra este modelo; trocar o modelo do carro no meio bagunçaria a reserva
    if (!erros.modelo && atual && (!m || m.id !== atual.modelo) && temReservaAtiva(atual)) erros.modelo = 'erroModeloComReserva';
    c.erros = erros;
    if (Object.keys(erros).length) { log('cadastro de carro com erro', Object.keys(erros).join(', ')); desenharModal(); focarErro('fc', erros); return; }
    if (!m) {
      m = { id: proximoId('m', E.modelos.filter((x) => /^m\d+$/.test(x.id))), nome: carro.modelo, cat: carro.categoria,
        tipo: D.DESENHO_POR_CATEGORIA[carro.categoria] || 'sedan', cor: '#7E8A90' };
      E.modelos.push(m);
      log('modelo novo na frota', m.nome);
    }
    m.cat = carro.categoria; // categoria e diária são do modelo (o cliente reserva o modelo, "ou similar")
    E.tarifas[m.id] = carro.tarifa;
    if (atual) {
      Object.assign(atual, { modelo: m.id, ano: carro.ano, placa: carro.placa, km: carro.km, fipe: carro.fipe, foto: f.foto || null, cor: carro.cor, renavam: carro.renavam, oleoKm: carro.oleoKm, filtroKm: carro.filtroKm });
    } else {
      E.unidades.push({ id: proximoId('u', [...E.unidades, ...E.removidos]), modelo: m.id, placa: carro.placa, local: D.LOCAIS[0].id,
        km: carro.km, situacao: 'ok', ano: carro.ano, oleoKm: carro.oleoKm, filtroKm: carro.filtroKm, foto: f.foto || null, fipe: carro.fipe,
        cor: carro.cor, renavam: carro.renavam, kmData: null });
    }
    const ok = salvar();
    log(atual ? 'carro editado' : 'carro cadastrado', carro.placa);
    avisar(ok ? t('carroSalvo', { p: carro.placa }) : t('erroSalvarAparelho'));
    fecharModal();
    desenhar();
  }

  function removerCarro() {
    const u = E.unidades.find((x) => x.id === UI.modal.unidade);
    if (!u) { fecharModal(); desenhar(); return; }
    if (temReservaAtiva(u)) { UI.modal.certezaRemover = false; avisar(t('erroRemoverComReserva', { p: u.placa })); desenharModal(); return; }
    if (E.clientes.some((c) => c.unidade === u.id)) { UI.modal.certezaRemover = false; avisar(t('erroCarroComCliente', { p: u.placa })); desenharModal(); return; }
    E.unidades = E.unidades.filter((x) => x !== u);
    // com reserva ou aluguel semanal recebido, o carro vai pro arquivo pra o histórico continuar abrindo
    // (e a id não é reaproveitada por outro carro); sem nada, sai de vez
    if (E.reservas.some((r) => r.unidade === u.id) || E.recebimentos.some((p) => p.unidade === u.id)) E.removidos.push(u);
    else {
      E.manutencoes = E.manutencoes.filter((r) => r.unidade !== u.id);
      E.custos = E.custos.filter((c) => c.unidade !== u.id);
      apagarAnexosDe(u.id);
    }
    salvar();
    log('carro removido da frota', u.placa);
    avisar(t('carroRemovido', { p: u.placa }));
    fecharModal();
    desenhar();
  }

  // reduz a foto no próprio aparelho (nada sai daqui) pra caber no armazenamento local
  function lerFoto(arquivo) {
    const c = UI.modal;
    if (!c || c.tipo !== 'carro' || !arquivo) return;
    const erro = (chave) => { if (UI.modal === c) { c.erros = { ...c.erros, foto: chave }; desenharModal(); } };
    if (!/^image\//.test(arquivo.type)) { log('arquivo escolhido não é imagem', arquivo.type); erro('erroFotoCarro'); return; }
    if (arquivo.size > 15 * 1024 * 1024) { log('foto grande demais', `${Math.round(arquivo.size / 1048576)} MB`); erro('erroFotoGrande'); return; }
    log('reduzindo foto do carro', `${Math.round(arquivo.size / 1024)} KB`);
    const url = URL.createObjectURL(arquivo), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      try {
        const escala = Math.min(1, 640 / Math.max(img.naturalWidth, img.naturalHeight));
        const tela = document.createElement('canvas');
        tela.width = Math.max(1, Math.round(img.naturalWidth * escala));
        tela.height = Math.max(1, Math.round(img.naturalHeight * escala));
        tela.getContext('2d').drawImage(img, 0, 0, tela.width, tela.height);
        const dado = tela.toDataURL('image/jpeg', 0.72);
        if (UI.modal !== c) return; // fechou a janela no meio
        c.f.foto = dado;
        delete c.erros.foto;
        log('foto pronta', `${Math.round(dado.length / 1024)} KB`);
        desenharModal();
      } catch (falha) {
        console.warn('[volante] não consegui reduzir a foto do carro:', falha);
        erro('erroFotoCarro');
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); console.warn('[volante] o navegador não abriu essa imagem (formato não suportado?)'); erro('erroFotoCarro'); };
    img.src = url;
  }

  /* ---------- clientes, anexos e lembretes ---------- */

  // confere tamanho e tipo (pelos primeiros bytes) assim que o arquivo é escolhido
  async function escolherAnexo(arquivo) {
    const m = UI.modal;
    if (!m || m.tipo !== 'anexos') return;
    m.arquivo = null; m.tipoArq = null; delete m.erros.arquivo;
    if (!arquivo) { desenharModal(); return; }
    if (arquivo.size > L.REGRAS.anexoMaxBytes) { log('anexo grande demais', tamanhoTxt(arquivo.size)); m.erros.arquivo = 'erroAnexoGrande'; desenharModal(); return; }
    let tipo = null;
    try { tipo = L.tipoPorAssinatura(new Uint8Array(await arquivo.slice(0, 12).arrayBuffer())); }
    catch (falha) { console.warn('[volante] não consegui ler o começo do arquivo escolhido:', falha); }
    if (UI.modal !== m) return; // fechou a janela no meio
    if (!tipo) { log('anexo recusado: não é PDF nem imagem', arquivo.type || 'tipo desconhecido'); m.erros.arquivo = 'erroAnexoTipo'; desenharModal(); return; }
    m.arquivo = arquivo; m.tipoArq = tipo;
    if (!m.f.nome.trim()) m.f.nome = arquivo.name.replace(/\.[^.]*$/, '').replace(/[\\/<>]/g, ' ').slice(0, 60);
    desenharModal();
  }

  async function salvarAnexo() {
    const m = UI.modal;
    if (!m || m.tipo !== 'anexos' || m.gravando) return;
    if (!donoExiste(m.dono)) { log('anexo não guardado: o dono não existe mais', m.dono); fecharModal(); desenhar(); return; }
    const { erros, anexo } = L.validarAnexo(m.f, hojeData());
    if (!m.arquivo) erros.arquivo = 'erroAnexoFalta';
    m.erros = erros;
    if (Object.keys(erros).length) { log('anexo com erro', Object.keys(erros).join(', ')); desenharModal(); focarErro('fa', erros); return; }
    const id = proximoId('ax', E.anexos);
    m.gravando = true;
    desenharModal();
    log('guardando anexo no aparelho', `${id} ${tamanhoTxt(m.arquivo.size)}`);
    try {
      await Anexos.guardar(id, new Blob([m.arquivo], { type: m.tipoArq }));
    } catch (falha) {
      console.error('[volante] falhou ao guardar o anexo no IndexedDB:', falha);
      m.gravando = false;
      if (UI.modal === m) { m.erros = { arquivo: 'erroAnexoAparelho' }; desenharModal(); }
      return;
    }
    E.anexos.push({ id, dono: m.dono, nome: anexo.nome, tipo: m.tipoArq, tamanho: m.arquivo.size, data: anexo.data });
    if (!salvar()) {
      E.anexos = E.anexos.filter((a) => a.id !== id);
      Anexos.apagar(id).catch(() => {});
      avisar(t('erroSalvarAparelho'));
    } else avisar(t('anexoSalvo', { n: anexo.nome }));
    m.gravando = false; m.arquivo = null; m.tipoArq = null; m.f = { nome: '', data: hojeData() };
    desenhar();
  }

  function nomeDoArquivo(a) {
    const ext = { 'application/pdf': 'pdf', 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[a.tipo];
    return `${a.nome.replace(/[^\p{L}\p{N} _-]/gu, '').trim() || 'anexo'}.${ext}`;
  }

  // abre numa aba nova ou baixa; o arquivo vem do próprio aparelho, com o tipo conferido no envio
  async function abrirAnexo(id, baixar) {
    const a = E.anexos.find((x) => x.id === id);
    if (!a) return;
    try {
      const blob = await Anexos.ler(id);
      if (!blob) { log('anexo sem arquivo no aparelho', id); avisar(t('erroAnexoSumiu')); return; }
      const url = URL.createObjectURL(new Blob([blob], { type: a.tipo }));
      const link = document.createElement('a');
      link.href = url; link.rel = 'noopener';
      if (baixar) link.download = nomeDoArquivo(a); else link.target = '_blank';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      log(baixar ? 'anexo baixado' : 'anexo aberto', id);
    } catch (falha) {
      console.error('[volante] não consegui abrir o anexo', id, falha);
      avisar(t('erroAnexoAparelho'));
    }
  }

  const erroSenhaNova = (a, b) => (!a || a.length < 8 ? 'senhaCurta' : a !== b ? 'senhaDiferente' : null);
  function msgErroAuth(erro) {
    const m = String((erro && (erro.code || erro.message)) || '');
    if (/invalid_credentials|Invalid login/i.test(m)) return 'entSenhaErrada';
    if (/email_not_confirmed/i.test(m)) return 'entNaoConfirmado';
    if (/same_password|different from the old/i.test(m)) return 'senhaIgual';
    if (/weak_password|at least/i.test(m)) return 'senhaCurta';
    if (/fetch|network|Failed/i.test(m)) return 'entSemInternet';
    return 'entErro';
  }

  function sairDaTela() {
    E = null; NUVEM.modo = null; NUVEM.email = ''; NUVEM.tela = 'entrada'; NUVEM.msg = null;
    NUVEM.form = { email: '', senha: '', senha2: '' };
    Anexos.usarBanco(null);
    resetarUI();
    desenhar();

  // depois do login: confere se é membro, lê o banco e monta a tela
  async function abrirDados() {
    NUVEM.tela = 'carregando'; NUVEM.msg = null; desenhar();
    try {
      const s = await Nuvem.sessao();
      if (!s) { NUVEM.tela = 'entrada'; desenhar(); return; }
      NUVEM.email = s.user.email || '';
      if (!(await Nuvem.ehMembro())) { log('login sem acesso ao Mimizinho (não está em membros)'); NUVEM.tela = 'naoMembro'; desenhar(); return; }
      const lido = await Nuvem.carregar();
      const hoje = hojeData();
      if (lido.vazio) {
        lido.aceitar();
        NUVEM.modo = 'bancoVazio';
        Anexos.usarBanco(null);
        E = carregar();
        log('banco ainda vazio: mostrando o que está neste aparelho; nada vai pro banco até anexar uma cópia');
      } else {
        const pronto = prepararSalvo(JSON.parse(JSON.stringify(lido.estado)), hoje);
        if (!pronto) {
          // nunca grava por cima do banco com dados de exemplo
          console.error('[volante] os dados do banco não passaram na conferência; nada foi gravado');
          NUVEM.tela = 'erro'; NUVEM.erro = 'erroDadosBanco'; desenhar(); return;
        }
        lido.aceitar();
        NUVEM.modo = 'banco';
        Anexos.usarBanco(Nuvem.arquivos);
        E = pronto;
        if (Nuvem.canon(pronto) !== Nuvem.canon(lido.estado)) Nuvem.gravar(E); // virada do dia: as outras pessoas veem igual
      }
      NUVEM.tela = 'app';
      desenhar();
      log('pronto', `${E.unidades.length} carros, ${E.clientes.length} clientes (${NUVEM.modo})`);
    } catch (erro) {
      console.error('[volante] não consegui ler os dados do banco:', erro);
      NUVEM.tela = 'erro'; NUVEM.erro = msgErroAuth(erro) === 'entSemInternet' ? 'entSemInternet' : 'erroLerBanco'; desenhar();
    }
  }

  // o que outra pessoa gravou aparece aqui quando a aba volta a ficar visível (e a cada minuto)
  let relendo = false;
  async function recarregarDoBanco(motivo, forcar) {
    if (NUVEM.modo !== 'banco' || NUVEM.tela !== 'app' || relendo || Nuvem.pendente()) return;
    if (!forcar) {
      if (document.hidden) return;
      const ativo = document.activeElement;
      if (ativo && /^(INPUT|TEXTAREA|SELECT)$/.test(ativo.tagName) && ativo.type !== 'file') return; // não atrapalha quem está digitando
      if (UI.modal && (UI.modal.tipo === 'copia' || UI.modal.gravando)) return;
    }
    relendo = true;
    const marca = NUVEM.mexeuLocal;
    try {
      const lido = await Nuvem.carregar();
      // mexeram aqui enquanto lia: descarta a leitura (a gravação local vai na frente)
      if (marca !== NUVEM.mexeuLocal || Nuvem.pendente() || NUVEM.modo !== 'banco' || lido.vazio) return;
      const pronto = prepararSalvo(JSON.parse(JSON.stringify(lido.estado)), hojeData());
      if (!pronto) { console.error('[volante] dados novos do banco não passaram na conferência; mantendo os da tela'); return; }
      lido.aceitar();
      if (Nuvem.canon(pronto) === Nuvem.canon(E)) return;
      E = pronto;
      log('dados atualizados pelo banco', motivo);
      aplicarMudancaDeFora();
    } catch (erro) {
      console.warn('[volante] não consegui reler o banco (tento de novo depois):', erro && erro.message);
    } finally { relendo = false; }
  }

  // lê o .json escolhido e mostra o resumo antes de gravar
  async function lerCopia(arquivo) {
    if (!arquivo) return;
    log('lendo cópia escolhida', `${arquivo.name} ${tamanhoTxt(arquivo.size)}`);
    let json;
    try {
      if (arquivo.size > 300 * MB) throw new Error('arquivo grande demais');
      json = JSON.parse(await arquivo.text());
    } catch (erro) { console.warn('[volante] cópia ilegível:', erro && erro.message); avisar(t('erroCopiaFormato')); return; }
    const c = json && json.copia;
    if (!c || c.app !== 'mimizinho' || c.formato !== 1 || !json.dados || typeof json.dados !== 'object') { avisar(t('erroCopiaFormato')); return; }
    let estado = null;
    try { estado = prepararSalvo(JSON.parse(JSON.stringify(json.dados)), hojeData()); } catch (erro) { console.warn('[volante] cópia não passou na conferência:', erro); }
    if (!estado) { log('cópia recusada: os dados não batem com o formato do app'); avisar(t('erroCopiaInvalida')); return; }
    const arquivos = json.arquivos && typeof json.arquivos === 'object' ? json.arquivos : {};
    const comArquivo = estado.anexos.filter((a) => typeof arquivos[a.id] === 'string').length;
    abrirModal({ tipo: 'copia', estado, arquivos, nome: arquivo.name, feitaEm: typeof c.feitaEm === 'string' ? c.feitaEm : '', comArquivo, andamento: null, erro: null });
  }

  async function gravarCopiaNoBanco() {
    const m = UI.modal;
    if (!m || m.tipo !== 'copia' || m.andamento) return;
    m.erro = null;
    try {
      // banco com dados: antes de substituir, baixa uma cópia do que está nele (nada se perde sem volta)
      if (NUVEM.modo === 'banco') {
        m.andamento = 'antes'; desenharModal();
        await Nuvem.esperarGravacoes();
        baixar(`mimizinho-banco-antes-de-anexar-${hojeData()}.json`, JSON.stringify(await montarCopia()));
        log('cópia de segurança do banco baixada antes de anexar');
      }
      m.andamento = 'enviando'; m.feitos = 0; m.total = m.estado.anexos.length; desenharModal();
      const r = await Nuvem.importar(m.estado, m.arquivos, (feitos, total) => { m.feitos = feitos; m.total = total; if (UI.modal === m) desenharModal(); });
      const resumo = { c: m.estado.unidades.length, k: m.estado.clientes.length, a: r.enviados };
      resetarUI();
      await abrirDados();
      avisar(r.semArquivo ? t('copiaAnexadaFaltou', { ...resumo, f: r.semArquivo }) : t('copiaAnexada', resumo));
    } catch (erro) {
      console.error('[volante] falhou ao gravar a cópia no banco (o banco fica como estava):', erro);
      m.andamento = null; m.erro = 'erroAnexarBanco';
      if (UI.modal === m) desenharModal();
    }
  }

  /* ---------- ações dos botões ---------- */
  /* 17/11/2026: cópia de tudo o que está no aparelho (dados + arquivos anexados) num arquivo .json.
     O dono baixa e guarda; a versão com banco de dados vai ler esse arquivo de volta. Nada sai do aparelho aqui. */
  const blobParaTexto = (blob) => new Promise((ok, falha) => {
    const leitor = new FileReader();
    leitor.onload = () => ok(leitor.result);
    leitor.onerror = () => falha(leitor.error);
    leitor.readAsDataURL(blob);
  });
  async function montarCopia() {
    const arquivos = {};
    let faltando = 0;
    for (const a of E.anexos) {
      try {
        const blob = await Anexos.ler(a.id);
        if (blob) arquivos[a.id] = await blobParaTexto(blob);
        else { faltando++; console.warn('[volante] anexo sem conteúdo no aparelho, vai só a ficha:', a.id); }
      } catch (erro) { faltando++; console.warn('[volante] não consegui ler o anexo para a cópia:', a.id, erro); }
    }
    return { copia: { app: 'mimizinho', formato: 1, chave: CHAVE, feitaEm: new Date().toISOString(), anexosSemArquivo: faltando }, dados: E, arquivos };
  }
  function baixar(nome, texto) {
    const url = URL.createObjectURL(new Blob([texto], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = nome; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  function erroDaBusca() {
    const { ini, fim } = periodo();
    const chave = L.validarPeriodo(ini, fim, hojeTxt());
    if (chave) return { chave };
    for (const [loja, quando] of [[local(UI.busca.local), ini], [local(localDev()), fim]]) {
      if (!L.lojaAberta(loja, quando)) return { chave: 'erroLojaFechada', vars: { l: loja.nome, h: loja.nota } };
    }
    return null;
  }

  function buscar() {
    UI.erroBusca = erroDaBusca();
    if (UI.erroBusca) { UI.tela = 'busca'; desenhar(); return; }
    UI.abaCliente = 'reservar';
    irPara('resultados');
  }

  function atualizarDatasNaPlaca() {
    const { ini, fim } = periodo(), n = L.diarias(ini, fim);
    document.querySelector('form.placa .placa-aba').textContent = n ? dias(n) : '–';
    const dev = document.getElementById('b-fdata');
    dev.min = UI.busca.iniData;
    if (document.activeElement !== dev) dev.value = UI.busca.fimData;
    const erro = document.querySelector('.erro-placa');
    if (erro) erro.remove();
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', (e) => {
    const zona = e.target.closest('[data-zona]');
    if (zona && UI.modal) { adicionarPin(zona, e); return; }
    const el = e.target.closest('[data-acao]');
    if (!el || el.disabled) return;
    if (el.dataset.fundo && e.target !== el) return; // clique dentro da janela não fecha
    if (e.detail > 1 && el.dataset.acao === 'etapaAvancar') return; // 2º clique do duplo não confirma a reserva
    const acao = ACOES[el.dataset.acao];
    if (!acao) { console.warn('[volante] botão sem ação conhecida:', el.dataset.acao); return; }
    acao(el.dataset.x, el.dataset.y);
  });

  // assinatura na tela: desenha com dedo ou mouse; guarda só números (sem imagem)
  let tracando = null;
  document.addEventListener('pointerdown', (e) => {
    const svg = e.target.closest && e.target.closest('#ck-assin');
    if (!svg || !UI.modal || UI.modal.tipo !== 'checkin') return;
    e.preventDefault();
    if (svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
    tracando = [pontoSVG(svg, e)];
    UI.modal.tracos.push(tracando);
    svg.classList.add('assinado');
    svg.querySelector('.traco').setAttribute('d', tracosD(UI.modal.tracos));
  });
  document.addEventListener('pointermove', (e) => {
    if (!tracando) return;
    const svg = document.getElementById('ck-assin');
    if (!svg) { tracando = null; return; }
    const p = pontoSVG(svg, e), ult = tracando[tracando.length - 1];
    const total = UI.modal.tracos.reduce((s, tr) => s + tr.length, 0);
    if (total > 1500 || (Math.abs(p[0] - ult[0]) < 2 && Math.abs(p[1] - ult[1]) < 2)) return;
    tracando.push([Math.max(0, Math.min(300, p[0])), Math.max(0, Math.min(120, p[1]))]);
    svg.querySelector('.traco').setAttribute('d', tracosD(UI.modal.tracos));
  });
  for (const ev of ['pointerup', 'pointercancel']) document.addEventListener(ev, () => { tracando = null; });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && UI.modal) { fecharModal(); return; }
    if (e.key === 'Tab' && UI.modal) {
      const jan = document.querySelector('.janela');
      const itens = [...jan.querySelectorAll('button:not(:disabled), input, select, [tabindex="0"]')];
      const primeiro = itens[0], ultimo = itens[itens.length - 1], atual = document.activeElement;
      if (!jan.contains(atual)) { e.preventDefault(); primeiro.focus(); }
      else if (e.shiftKey && atual === primeiro) { e.preventDefault(); ultimo.focus(); }
      else if (!e.shiftKey && atual === ultimo) { e.preventDefault(); primeiro.focus(); }
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.zona) {
      e.preventDefault();
      adicionarPin(e.target, null);
    }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.dataset.form === 'busca') buscar();
    if (e.target.dataset.form === 'entrar') ACOES.entrar();
    if (e.target.dataset.form === 'criarSenha') ACOES.criarSenha();
  });

  document.addEventListener('input', (e) => {
    const c = e.target.dataset.campo;
    if (!c) return;
    if (c.startsWith('motorista.')) UI.rascunho.motorista[c.split('.')[1]] = e.target.value;
    if (c === 'vist.km') UI.modal.km = e.target.value;
    if (c === 'ck.texto') UI.modal.texto = e.target.value;
    if (/^f[cmulak]\.\w+$/.test(c) && c !== 'fc.foto' && c !== 'fa.arquivo' && UI.modal && UI.modal.f) UI.modal.f[c.slice(3)] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (c === 'fu.valor' && UI.modal) UI.modal.auto = false; // o dono digitou: não troca mais o valor sozinho
    if (c === 'fk.descontado' && UI.modal && UI.modal.tipo === 'caucao') {
      // mostra na hora quanto devolver (sem redesenhar a janela, pra não perder o cursor)
      const cl = clienteId(UI.modal.cliente), alvo = document.getElementById('ak-devolver');
      if (cl && alvo) {
        const d = L.validarDinheiro(e.target.value, 0, cl.caucao, 0);
        alvo.innerHTML = `<strong>${esc(t('ak_devolver', { v: moeda(d === null ? cl.caucao : cl.caucao - d) }))}</strong>`;
      }
    }
    if (c.startsWith('novoFixo.')) UI.novoFixo[c.slice(9)] = e.target.value;
    if (c === 'kmLembrete') UI.kmLembrete[e.target.dataset.x] = e.target.value;
    if (c.startsWith('ent.')) NUVEM.form[c.slice(4)] = e.target.value;
    if (c.startsWith('ct.') && UI.modal && UI.modal.tipo === 'conta') UI.modal.f[c.slice(3)] = e.target.value;
  });

  document.addEventListener('change', (e) => {
    const el = e.target, c = el.dataset.campo;
    if (!c) return;
    if (c === 'fc.foto') { lerFoto(el.files && el.files[0]); return; }
    if (c === 'fa.arquivo') { escolherAnexo(el.files && el.files[0]); return; }
    if (c === 'arquivoCopia') { lerCopia(el.files && el.files[0]); return; }
    if ((c === 'fm.tipo' || c === 'fm.filtro') && UI.modal && UI.modal.tipo === 'manut') {
      UI.modal.f[c.slice(3)] = el.value;
      UI.modal.erros = {};
      desenharModal();
      const de = document.getElementById(el.id);
      if (de) de.focus({ preventScroll: true });
      return;
    }
    if (c === 'fu.tipo' || c === 'fu.unidade') {
      const m = UI.modal;
      if (!m || m.tipo !== 'custo') return;
      m.f[c.slice(3)] = el.value;
      ipvaAutomatico(m);
      desenharModal();
      const de = document.getElementById(el.id);
      if (de) de.focus({ preventScroll: true });
      return;
    }
    if (/^f[cmulak]\.\w+$/.test(c)) { if (UI.modal && UI.modal.f) UI.modal.f[c.slice(3)] = el.type === 'checkbox' ? el.checked : el.value; return; }
    if (c.startsWith('novoFixo.')) { UI.novoFixo[c.slice(9)] = el.value; return; }
    if (c === 'ficha') { if (E.unidades.some((u) => u.id === el.value)) { UI.fichaId = el.value; desenhar(); } return; }
    if (c === 'fixoNome' || c === 'fixoValor') {
      const f = E.fixos.find((x) => x.id === el.dataset.x);
      if (!f) return;
      const { erros, fixo } = L.validarFixo(c === 'fixoNome' ? { nome: el.value, valor: reaisTxt(f.valor) } : { nome: f.nome, valor: el.value });
      const erro = c === 'fixoNome' ? erros.nome : erros.valor;
      if (erro) { UI.erroFixo[f.id] = erro; desenharDepois(); return; }
      delete UI.erroFixo[f.id];
      if (c === 'fixoNome') f.nome = fixo.nome; else f.valor = fixo.valor;
      salvar();
      log('custo fixo alterado', `${f.nome} ${f.valor}`);
      avisar(t('fixoSalvo', { n: f.nome, v: moeda(f.valor) }));
      desenharDepois();
      return;
    }
    if (c === 'aliquota') {
      const k = el.dataset.x, v = L.validarAliquota(el.value);
      if (!['aliqLocadora', 'aliqParticular'].includes(k)) return;
      if (v === null) { UI.erroConfig[k] = true; desenharDepois(); return; }
      delete UI.erroConfig[k];
      E.config[k] = v;
      salvar();
      log('alíquota de IPVA alterada', `${k} ${v}`);
      avisar(t('aliquotaSalva', { a: pctTxt(v) }));
      desenharDepois();
      return;
    }
    if (c.startsWith('sim.')) {
      const k = c.slice(4);
      if (k === 'n') {
        const n = Number(el.value.trim());
        if (!/^\d{1,3}$/.test(el.value.trim()) || n < 1 || n > 500) UI.sim.erros.n = true;
        else { UI.sim.n = n; delete UI.sim.erros.n; }
      } else if (['custo', 'diaria', 'fipe'].includes(k)) {
        const v = L.validarDinheiro(el.value, 0, 500000000, null);
        if (v === null && el.value.trim() !== '') UI.sim.erros[k] = true;
        else { UI.sim[k] = v; delete UI.sim.erros[k]; }
      }
      desenharDepois();
      return;
    }
    if (c === 'intervalo') {
      const u = E.unidades.find((x) => x.id === el.dataset.x), tipo = el.dataset.y;
      if (!u || !['oleo', 'filtro'].includes(tipo)) return;
      const chave = `${u.id}-${tipo}`, km = L.validarIntervalo(el.value);
      if (km === null) { UI.erroIntervalo[chave] = true; desenharDepois(); return; }
      delete UI.erroIntervalo[chave];
      u[tipo === 'oleo' ? 'oleoKm' : 'filtroKm'] = km;
      salvar();
      log('intervalo de troca alterado', `${u.placa} ${tipo} ${km}`);
      avisar(t('intervaloSalvo', { p: u.placa, k: t('curto_' + tipo), n: fmtNum(km) }));
      desenharDepois();
      return;
    }
    if (c === 'ordem') { UI.ordem = el.value; desenhar(); return; }
    if (c === 'cambio') { UI.cambio = el.value; desenhar(); return; }
    if (c.startsWith('busca.')) {
      const k = c.split('.')[1];
      UI.busca[k] = el.type === 'checkbox' ? el.checked : el.value;
      // devolução nunca fica antes da retirada ao mudar a data de retirada
      if (k === 'iniData' && UI.busca.fimData <= UI.busca.iniData && UI.busca.iniData) UI.busca.fimData = L.somarDias(UI.busca.iniData, 3);
      UI.erroBusca = null;
      if (el.type === 'date') { atualizarDatasNaPlaca(); return; }
      desenhar();
      return;
    }
    if (c === 'plano') {
      const r = UI.rascunho;
      r.plano = el.value;
      if (plano(r.plano).incluiVidros) r.extras = r.extras.filter((x) => x !== 'vidros');
      desenhar();
      return;
    }
    if (c === 'extra') {
      const r = UI.rascunho;
      r.extras = el.checked ? [...r.extras, el.value] : r.extras.filter((x) => x !== el.value);
      desenhar();
      return;
    }
    if (c === 'pagamento') { UI.rascunho.pagamento = el.value; return; }
    if (c === 'motorista.idade') { desenharDepois(); return; }
    if (c === 'vist.comb') { UI.modal.comb = Number(el.value); return; }
    if (c === 'ck.aceite') { UI.modal.aceite = el.checked; UI.modal.erro = null; return; }
    if (c === 'tarifa') {
      const id = el.dataset.x, cents = L.validarTarifa(el.value);
      if (cents === null) { UI.erroTarifa[id] = true; desenharDepois(); return; }
      delete UI.erroTarifa[id];
      E.tarifas[id] = cents;
      salvar();
      log('preço alterado', id);
      avisar(t('tarifaSalva', { m: modelo(id).nome, v: moeda(cents) }));
      desenharDepois();
    }
  });

  // duas abas abertas na mesma demonstração ficam iguais (modo "banco vazio"; com o banco ligado, quem atualiza é a releitura)
  window.addEventListener('storage', (e) => {
    if (e.key !== CHAVE || NUVEM.modo !== 'bancoVazio' || !E) return;
    E = carregar();
    aplicarMudancaDeFora();
  });

  // dados novos chegaram de fora (outra aba ou outro aparelho): ajusta a janela aberta e redesenha
  function aplicarMudancaDeFora() {
    const m = UI.modal;
    if (m && (m.tipo === 'carro' || m.tipo === 'manut' || m.tipo === 'custo')) {
      // janela do dono continua aberta, a não ser que o carro tenha saído da frota na outra aba
      const id = m.tipo === 'custo' ? m.f.unidade : m.unidade;
      if (id && !E.unidades.some((u) => u.id === id)) UI.modal = null;
    } else if (m && m.tipo === 'cliente') {
      if (m.cliente && !clienteId(m.cliente)) UI.modal = null;
    } else if (m && m.tipo === 'anexos') {
      if (!donoExiste(m.dono)) UI.modal = null;
    } else if (m && (m.tipo === 'conta' || m.tipo === 'copia')) {
      // janela da conta ou da cópia não depende dos dados: continua aberta
    } else if (m) {
      const r = reserva(m.id);
      const esperado = m.tipo === 'vistoria' ? (m.fase === 'ret' ? 'reservada' : 'retirada') : m.tipo === 'checkin' ? 'reservada' : null;
      if (!r || (esperado && r.status !== esperado)) UI.modal = null;
    }
    if (UI.editandoId && !(reserva(UI.editandoId) && reserva(UI.editandoId).status === 'reservada')) { UI.editandoId = null; UI.rascunho = null; if (UI.tela === 'reserva') UI.tela = 'busca'; }
    if ((UI.tela === 'reservaDet' && !reserva(UI.viagemId)) || (UI.tela === 'confirmada' && !reserva(UI.confirmadaId))) { UI.tela = 'busca'; UI.abaCliente = 'reservar'; }
    desenhar();
  }

  document.addEventListener('visibilitychange', () => { if (!document.hidden) recarregarDoBanco('aba voltou'); });
  window.addEventListener('focus', () => recarregarDoBanco('janela em foco'));
  setInterval(() => recarregarDoBanco('a cada minuto'), 60000);
  // fechar a página com gravação pendente: o navegador pergunta antes
  window.addEventListener('beforeunload', (e) => { if (NUVEM.modo === 'banco' && Nuvem.pendente()) { e.preventDefault(); e.returnValue = ''; } });

  if (D.CONFIG.ladoCliente) {
    window.addEventListener('resize', () => {
      if (window.innerWidth < 1180 && UI.modo === 'ambos') { UI.modo = 'cliente'; desenhar(); }
    });
    const modoDoEndereco = () => {
      const pedido = location.hash.slice(1);
      if (['cliente', 'locadora', 'ambos'].includes(pedido)) UI.modo = pedido;
    };
    window.addEventListener('hashchange', () => { modoDoEndereco(); desenhar(); });
    modoDoEndereco();
  }
  if (window.Nuvem && Nuvem.ok) {
    Nuvem.aoErroGravar((tipo) => {
      avisar(t(tipo === 'conflito' ? 'erroConflito' : 'erroBanco'));
      // a gravação que deu conflito ainda está terminando: relê o banco logo depois dela
      if (tipo === 'conflito') Nuvem.esperarGravacoes().then(() => setTimeout(() => recarregarDoBanco('conflito', true), 0));
    });
    Nuvem.aoMudarSessao((evento) => {
      if (evento === 'PASSWORD_RECOVERY' && NUVEM.tela !== 'criarSenha') { NUVEM.tela = 'criarSenha'; NUVEM.msg = null; desenhar(); }
      if (evento === 'SIGNED_OUT' && NUVEM.tela !== 'entrada') sairDaTela(); // saiu em outra aba
    });
  }
  iniciar();
})();

</script>
